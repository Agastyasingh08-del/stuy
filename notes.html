<h3>What are Enzymes?</h3>
<p>Enzymes are <strong>organic (carbon-based) catalysts</strong> — mostly proteins — that speed up biochemical reactions without being consumed. They lower the <strong>activation energy</strong> required to start a reaction.</p>
<div class="def-box">
  <div class="def-term">Enzyme</div><div class="def-body">A biological catalyst (usually a protein) that speeds up a chemical reaction by lowering its activation energy.</div>
  <div class="def-term">Substrate</div><div class="def-body">The reactant molecule that binds to an enzyme's active site.</div>
  <div class="def-term">Active site</div><div class="def-body">The specific region of an enzyme where the substrate binds; complementary in shape to the substrate.</div>
  <div class="def-term">Enzyme-substrate complex</div><div class="def-body">The temporary structure formed when enzyme and substrate are bound together at the active site.</div>
  <div class="def-term">Conformational change</div><div class="def-body">A change in the three-dimensional shape of a molecule (e.g. the active site adjusts when a substrate binds — induced fit model).</div>
  <div class="def-term">Activation energy</div><div class="def-body">The minimum energy required to initiate a chemical reaction. Enzymes lower this.</div>
</div>

<h3>How Enzymes Work — Induced Fit Model</h3>
<ol>
  <li>Substrate approaches the enzyme's active site (complementary shape)</li>
  <li>Active site undergoes a slight <strong>conformational change</strong> to accommodate the substrate ("handshake/hug")</li>
  <li>Enzyme-substrate complex forms; bonds (hydrogen, hydrophobic) hold them together</li>
  <li>Reaction occurs; products are released</li>
  <li>Enzyme is unchanged and free to catalyse again</li>
</ol>
<div class="tip-box">⚠️ <strong>Exam tip:</strong> The <em>induced fit</em> model (active site changes shape) is the accepted model — not the old "lock and key" model (rigid active site). Always say the active site undergoes a conformational change.</div>

<h3>Key Properties of Enzymes</h3>
<ul>
  <li><strong>Reusable</strong> — not consumed in the reaction</li>
  <li><strong>Specific</strong> — each enzyme has one (or few) substrates whose shape is complementary to the active site</li>
  <li><strong>Mostly proteins</strong> — made from amino acids; 3D shape is essential to function</li>
  <li>Can catalyse reactions in <strong>both directions</strong> (anabolic and catabolic)</li>
  <li>Function throughout entire <strong>biochemical pathways</strong></li>
</ul>

<h3>Reaction Types</h3>
<div class="def-box">
  <div class="def-term">Catabolic reaction</div><div class="def-body">Breaking down of larger molecules into smaller ones (e.g. maltose → glucose + glucose by maltase). Releases energy.</div>
  <div class="def-term">Anabolic reaction</div><div class="def-body">Building up of larger molecules from smaller ones (e.g. glucose + glucose → maltose). Requires energy.</div>
  <div class="def-term">Biochemical pathway</div><div class="def-body">A series of enzyme-catalysed reactions where the product of one becomes the substrate of the next. Also called a metabolic pathway.</div>
</div>

<h3>Activation Energy Graphs</h3>
<ul>
  <li>Y-axis: energy; X-axis: time (progress of reaction)</li>
  <li>Without enzyme: large activation energy "hill"</li>
  <li>With enzyme: same reactants and products, but smaller activation energy hill</li>
  <li>The overall energy change (ΔG) is the <em>same</em> — enzymes only affect activation energy, not the energetics of the reaction</li>
</ul>

<h3>Example: Carbonic Anhydrase</h3>
<p>Catalyses CO₂ + H₂O → carbonic acid <strong>10 million times faster</strong> than the uncatalysed reaction. Illustrates how critical enzyme activity is.</p>
`,

<h3>1. Temperature</h3>
<p>As temperature increases, molecules have more kinetic energy → more frequent collisions → faster enzyme-substrate binding → increased reaction rate.</p>
<ul>
  <li><strong>Optimal temperature:</strong> temperature at which enzyme activity is greatest (most enzyme-substrate complexes form per second)</li>
  <li>Human enzymes: optimal 36–38°C (body temperature ≈ 37°C)</li>
  <li><strong>Below optimal:</strong> less kinetic energy → fewer collisions → slower rate (reversible)</li>
  <li><strong>Freezing:</strong> causes loss of function but is <em>reversible</em> — no permanent conformational change</li>
  <li><strong>Above optimal (denaturation):</strong> excessive heat disrupts hydrogen bonds holding active site shape → <em>irreversible</em> conformational change → enzyme non-functional</li>
</ul>
<div class="tip-box">⚠️ <strong>Graph shape:</strong> rises to peak at optimal temperature (X), then steeply drops — enzyme denatures (Z). Below optimal it tapers off (Y = freezing, reversible).</div>
<div class="tip-box">⚠️ <strong>Key distinction:</strong> Freezing = reversible (low kinetic energy, no permanent change). Denaturation = irreversible (bonds broken, shape permanently altered).</div>

<h3>2. pH</h3>
<p>Each enzyme has an <strong>optimal pH</strong> at which it functions best. Both overly acidic AND overly basic conditions denature the enzyme by disrupting ionic bonds that maintain the active site shape.</p>
<ul>
  <li>Graph = symmetrical <strong>bell-shaped curve</strong> peaking at optimal pH</li>
  <li>Pepsin (stomach): optimal pH ≈ 1.5–2</li>
  <li>Pancreatic lipase: optimal pH ≈ 8</li>
  <li>Denaturation occurs at <em>both</em> extremes (unlike temperature where only high temps denature)</li>
</ul>

<h3>3. Substrate Concentration</h3>
<ul>
  <li>More substrate → more enzyme-substrate complexes form → faster rate</li>

  <li>Before plateau: substrate is the limiting factor/reagent</li>
  <li>After plateau: enzyme concentration (or temperature/pH) is the limiting factor</li>

<h3>Enzyme Concentration</h3>
<ul>
  <li>More enzymes → more active sites available → faster rate (assuming substrate is not limiting)</li>
  <li>Graph: linear increase in rate as enzyme concentration rises</li>
</ul>

<h3>4. Competitive Inhibition</h3>
<div class="def-box">
  <div class="def-term">Competitive inhibitor</div><div class="def-body">A molecule structurally similar to the substrate that binds to the <strong>active site</strong>, blocking the substrate from binding. Does NOT trigger a reaction.</div>
</div>
<ul>
  <li>Inhibitor has complementary shape to active site (similar to substrate)</li>
  <li>Directly occupies active site → substrate cannot bind</li>
  <li>Can be overcome by <strong>increasing substrate concentration</strong> (outcompete the inhibitor)</li>
  <li>Usually reversible</li>
</ul>

<h3>5. Non-Competitive (Allosteric) Inhibition</h3>
<div class="def-box">
  <div class="def-term">Non-competitive inhibitor</div><div class="def-body">A molecule that binds to the <strong>allosteric site</strong> (NOT the active site), causing a conformational change that prevents substrate binding.</div>
  <div class="def-term">Allosteric site</div><div class="def-body">A site on an enzyme other than the active site where a regulatory molecule (non-competitive inhibitor) can bind.</div>
</div>
<ul>
  <li>Inhibitor binds at allosteric site → changes active site shape → substrate cannot bind</li>
  <li><strong>Cannot</strong> be overcome by increasing substrate concentration</li>
  <li>Can disrupt entire biochemical pathways (e.g. end product inhibiting first enzyme in pathway = feedback inhibition)</li>
</ul>

<h3>6. Reversible vs Irreversible Inhibition</h3>
<div class="def-box">
  <div class="def-term">Reversible inhibition</div><div class="def-body">Inhibitor forms weak bonds with enzyme; effects are temporary; inhibitor can dissociate → enzyme function restored.</div>
  <div class="def-term">Irreversible inhibition</div><div class="def-body">Inhibitor forms strong covalent bonds with enzyme; effects are permanent; enzyme permanently non-functional.</div>
</div>
<p>Most competitive inhibitors are reversible. Some poisons (e.g. nerve agents like sarin — inhibit acetylcholinesterase) are irreversible inhibitors.</p>

<h3>7. Coenzymes</h3>
<div class="def-box">
  <div class="def-term">Cofactor</div><div class="def-body">A molecule that assists enzyme functioning. Can be inorganic (metal ions) or organic.</div>
  <div class="def-term">Coenzyme</div><div class="def-body">An organic, non-protein cofactor that assists enzymes in catalysing reactions. Must be recycled after each reaction.</div>
</div>
<ul>
  <li>Key example: <strong>ATP (adenosine triphosphate)</strong> — transfers phosphate groups to provide energy</li>
  <li>ATP ⇌ ADP + Pᵢ (releases energy when broken; energy required to reform ATP)</li>
  <li>ATP assists enzymes like hexokinase (catalyses glucose → glucose-6-phosphate)</li>
  <li>Shown in diagrams as a curved arrow beside the main reaction arrow</li>
  <li>Other coenzymes in VCE: NADH, FADH₂, NADPH (involved in cellular respiration and photosynthesis)</li>
</ul>
<div class="tip-box">⚠️ <strong>Coenzymes ≠ inhibitors.</strong> Coenzymes HELP enzymes work; inhibitors BLOCK enzyme function.</div>
`,

<h3>Overview</h3>
<p>Three main enzymes manipulate DNA in biotechnology: <strong>endonucleases</strong> (cut), <strong>ligases</strong> (join), and <strong>polymerases</strong> (synthesise).</p>

<h3>1. Restriction Endonucleases ("Molecular Scissors")</h3>
<div class="def-box">
  <div class="def-term">Restriction endonuclease</div><div class="def-body">Enzymes that cut DNA at specific recognition sequences (4–6 nucleotides). They cleave the phosphodiester bonds in the sugar-phosphate backbone. Also called restriction enzymes.</div>
  <div class="def-term">Recognition site</div><div class="def-body">A specific palindromic DNA sequence (4–6 bp) where a restriction endonuclease binds and cuts. Palindromic = 5'→3' sequence on template strand equals 5'→3' sequence on complementary strand.</div>
</div>
<ul>
  <li>Naturally found in bacteria — defence against invading viral DNA</li>
  <li>Named after organism of origin (e.g. <em>Eco</em>RI from <em>E. coli</em>)</li>
  <li>Recognition sites are <strong>palindromic sequences</strong></li>
</ul>

<h4>Types of Cuts:</h4>
<ul>
  <li><strong>Sticky ends:</strong> staggered cut → leaves single-stranded overhanging nucleotides (can hydrogen bond with complementary sticky ends) — e.g. EcoRI, HindIII</li>
  <li><strong>Blunt ends:</strong> straight cut across both strands → no overhangs — e.g. AluI, HaeIII</li>
</ul>
<div class="tip-box">⚠️ <strong>Fragment counting rule:</strong><br>• <strong>Circular</strong> DNA (e.g. plasmid): fragments = number of recognition sites<br>• <strong>Linear</strong> DNA: fragments = number of recognition sites <strong>+ 1</strong></div>

<h3>2. Ligases ("Molecular Glue")</h3>
<div class="def-box">
  <div class="def-term">Ligase</div><div class="def-body">An enzyme that joins two DNA or RNA fragments by catalysing the formation of phosphodiester bonds between them.</div>
</div>
<ul>
  <li>DNA ligase: joins DNA fragments</li>
  <li>RNA ligase: joins RNA fragments</li>
  <li>Reverse of endonucleases — joins rather than cuts</li>
  <li><strong>Less specific</strong> than restriction endonucleases — can join any blunt or sticky ends</li>
  <li>Substrate: sugar and phosphate groups (not specific nitrogenous bases)</li>
</ul>

<h3>3. Polymerases ("DNA Synthesisers")</h3>
<div class="def-box">
  <div class="def-term">DNA polymerase</div><div class="def-body">Synthesises new DNA strands from a template using free DNA nucleotides. Requires a primer to initiate. Works 5'→3'.</div>
  <div class="def-term">RNA polymerase</div><div class="def-body">Synthesises RNA strands from a DNA template (transcription). Uses RNA nucleotides.</div>
  <div class="def-term">Primer</div><div class="def-body">A short, single-stranded nucleotide chain complementary to the template strand, required for polymerase to attach and begin synthesis.</div>
</div>
<ul>
  <li>Polymerases require a <strong>primer</strong> to start — cannot initiate de novo</li>
  <li>Synthesise in <strong>5'→3' direction</strong></li>
  <li>Taq polymerase: heat-stable DNA polymerase from <em>Thermus aquaticus</em> — used in PCR</li>
</ul>

<div class="summary-table">
  <table>
    <tr><th>Enzyme</th><th>Action</th><th>Bond affected</th></tr>
    <tr><td>Restriction endonuclease</td><td>Cuts DNA at recognition sites</td><td>Phosphodiester bonds (cleaved)</td></tr>
    <tr><td>Ligase</td><td>Joins DNA/RNA fragments</td><td>Phosphodiester bonds (formed)</td></tr>
    <tr><td>DNA polymerase</td><td>Synthesises new DNA strand</td><td>Phosphodiester bonds (formed)</td></tr>
    <tr><td>RNA polymerase</td><td>Synthesises new RNA strand</td><td>Phosphodiester bonds (formed)</td></tr>
  </table>
</div>
`,

          {id:'4a-1', q:'What do restriction endonucleases do?', a:'They cut DNA at specific palindromic recognition sequences (4–6 bp) by cleaving the phosphodiester bonds in the sugar-phosphate backbone. They act as "molecular scissors".'},
          {id:'4a-2', q:'What is a palindromic recognition site?', a:'A DNA sequence where the 5\'→3\' sequence on the template strand is the same as the 5\'→3\' sequence on the complementary strand. Restriction enzymes recognise and cut these sites.'},
          {id:'4a-3', q:'What is the difference between sticky ends and blunt ends?', a:'Sticky ends: staggered cut leaves single-stranded overhangs that can base-pair with complementary ends (e.g. EcoRI). Blunt ends: straight cut across both strands, no overhangs (e.g. AluI).'},
          {id:'4a-4', q:'How many fragments does a restriction enzyme create from circular vs linear DNA?', a:'Circular DNA (e.g. plasmid): fragments = number of recognition sites. Linear DNA: fragments = number of recognition sites + 1.'},
          {id:'4a-5', q:'What do ligases do and how are they different to restriction endonucleases?', a:'Ligases join DNA/RNA fragments by catalysing phosphodiester bond formation ("molecular glue"). Unlike restriction endonucleases, ligases are non-specific — they can join any compatible blunt or sticky ends.'},

          {id:'4a-8', q:'In which direction do polymerases synthesise new strands?', a:'5\' to 3\' direction — nucleotides are added to the 3\' end of the growing strand.'},
          {id:'4a-9', q:'Why are restriction endonucleases sourced from bacteria?', a:'Bacteria naturally produce them as a defence mechanism against invading viral (bacteriophage) DNA. They recognise and cut foreign viral DNA at specific palindromic sequences.'},

      {
        id: '4b',
        title: '4B — CRISPR-Cas9',
        content: `
<h3>CRISPR-Cas9 in Bacteria (Natural Role)</h3>
<div class="def-box">
  <div class="def-term">CRISPR</div><div class="def-body">Clustered Regularly Interspaced Short Palindromic Repeats — a region of bacterial DNA that acts as a primitive adaptive immune system.</div>
  <div class="def-term">Cas9</div><div class="def-body">A CRISPR-Associated endonuclease that uses guide RNA to find and cut complementary viral DNA. Creates blunt-end cuts on both strands using two active sites.</div>
  <div class="def-term">Guide RNA (gRNA)</div><div class="def-body">RNA transcribed from CRISPR spacer sequences that guides Cas9 to the target viral DNA sequence.</div>
  <div class="def-term">PAM sequence</div><div class="def-body">Protospacer Adjacent Motif — a short (2–6 nt) sequence recognised by Cas1/Cas2 to identify where to extract a protospacer from viral DNA. E.g. NGG in S. pyogenes. Not included in the final protospacer.</div>
</div>

<h3>3 Steps of Bacterial CRISPR Defence:</h3>
<ol>
  <li><strong>Acquisition:</strong> When a bacteriophage invades, Cas1+Cas2 proteins extract a short segment of viral DNA (protospacer) just before the PAM sequence. This "mugshot" is inserted between palindromic repeats in the CRISPR region of the bacterial genome.</li>
  <li><strong>Expression:</strong> The CRISPR spacers (including the viral mugshot) are transcribed into guide RNA (gRNA). The gRNA binds to Cas9 protein → forms the CRISPR-Cas9 complex. gRNA has a hairpin loop structure from the palindromic repeats on either side.</li>
  <li><strong>Extermination:</strong> The CRISPR-Cas9 complex scans the cell for DNA complementary to the gRNA (viral DNA). When found, Cas9 cleaves both strands (creating blunt ends) to inactivate the virus. If not inactivated, DNA repair mechanisms induce mutations that render the viral gene non-functional.</li>
</ol>
<div class="tip-box">⚠️ CRISPR-Cas9 = "primitive adaptive immune system in bacteria" — stores memory of past viral infections.</div>

<h3>CRISPR-Cas9 in Artificial Gene Editing</h3>
<p>Scientists adapted CRISPR-Cas9 to precisely edit any organism's genome:</p>
<ol>
  <li>Scientists design a synthetic <strong>single guide RNA (sgRNA)</strong> complementary to the target DNA sequence</li>
  <li>sgRNA + Cas9 are introduced into cells (injected)</li>
  <li>sgRNA guides Cas9 to the target sequence (Cas9 also needs PAM sequence nearby to bind)</li>
  <li>Cas9 cuts both strands at the target site (blunt end cut)</li>
  <li>Two possible outcomes after the cut:
    <ul>
      <li><strong>Gene knockout:</strong> The cell's DNA repair mechanisms (error-prone) cause mutations (insertions/deletions) → gene silenced</li>
      <li><strong>Gene knock-in:</strong> Introduce a corrected/new DNA sequence into the cell → repair machinery incorporates it</li>
    </ul>
  </li>
</ol>
<div class="def-box">
  <div class="def-term">Single guide RNA (sgRNA)</div><div class="def-body">A synthetic, single-stranded RNA molecule designed to guide Cas9 to a specific DNA sequence for gene editing. Functionally equivalent to gRNA in bacteria but made from one strand rather than two.</div>
</div>

<h3>Applications of CRISPR-Cas9</h3>
<ul>
  <li><strong>Research:</strong> identifying gene function by knocking out specific genes; attaching fluorescent proteins to locate genes</li>
  <li><strong>Medicine:</strong> replacing deleterious alleles; adding HIV resistance genes; modifying cancer-promoting genes</li>
  <li><strong>Agriculture:</strong> introducing pest/herbicide resistance; promoting growth rates</li>
</ul>

<h3>Limitations and Ethics</h3>
<ul>
  <li>Off-target cuts (lack of complete precision)</li>
  <li>Difficulty reliably inducing substitution mutations / knock-in (DNA repair not 100% controllable)</li>
  <li>Embryos must be treated before cell differentiation for all cells to be affected</li>
  <li>Currently illegal to implant GM embryos into humans</li>
  <li>Ethical concerns: equity of access, "designer babies", altering evolutionary pathways</li>
</ul>

<div class="summary-table">
  <table>
    <tr><th></th><th>In bacteria (natural)</th><th>In gene editing (artificial)</th></tr>
    <tr><td><strong>Purpose</strong></td><td>Destroy invading viral DNA</td><td>Induce mutations to alter genomic DNA</td></tr>
    <tr><td><strong>gRNA</strong></td><td>Naturally transcribed from CRISPR gene</td><td>Synthetically produced (sgRNA)</td></tr>
    <tr><td><strong>PAM</strong></td><td>Species-specific</td><td>Cas9 modified to suit target gene</td></tr>
    <tr><td><strong>After cut</strong></td><td>Repair mechanisms mutate viral gene → inactivation</td><td>Knock out, enhance, or change gene function</td></tr>
  </table>
</div>
`,

          {id:'4b-2', q:'What is the natural function of CRISPR-Cas9 in bacteria?', a:'It acts as a primitive adaptive immune system. Bacteria store segments of viral DNA (spacers) in CRISPR. When the same virus re-invades, gRNA guides Cas9 to cut and destroy it.'},

      {
        id: '4c',
        title: '4C — Polymerase Chain Reaction (PCR)',
        content: `
<h3>Purpose of PCR</h3>
<p>The polymerase chain reaction (PCR) is a laboratory technique that <strong>amplifies DNA</strong> — creates many identical copies from a very small initial sample.</p>
<div class="tip-box">⚠️ In VCAA exams, write "polymerase chain reaction (PCR)" in full first, then use the abbreviation. PCR alone without prior definition is not accepted.</div>

<h3>Applications</h3>
<ul>
  <li>Forensic analysis (bodily fluids, hair follicles, crime scenes)</li>
  <li>Paternity testing</li>
  <li>Genetic disease screening</li>
  <li>Medical diagnostics (e.g. detecting viral DNA)</li>
</ul>

<h3>Components Required</h3>
<ul>
  <li><strong>Template DNA</strong> — the target DNA to be amplified</li>
  <li><strong>Taq polymerase</strong> — heat-resistant DNA polymerase (from <em>Thermus aquaticus</em>); optimal temperature 72°C</li>
  <li><strong>Forward and reverse primers</strong> — short single-stranded DNA complementary to each end of the target region; define the region to be amplified</li>
  <li><strong>Free dNTPs (nucleotides)</strong> — building blocks for new DNA strands</li>
  <li><strong>Buffer solution</strong> — maintains appropriate pH/salt conditions</li>
</ul>

<h3>The 4-Step Cycle (Thermal Cycling)</h3>
<ol>
  <li><strong>Denaturation: 90–95°C</strong> — heat breaks hydrogen bonds between complementary base pairs → double-stranded DNA separates into two single strands (templates)</li>
  <li><strong>Annealing: 50–55°C</strong> — temperature lowered; forward and reverse primers bind (anneal) to their complementary sequences on each single-stranded template</li>
  <li><strong>Elongation: 72°C</strong> — Taq polymerase binds to primers and synthesises new complementary strand by adding nucleotides 5'→3'; 72°C is the optimal temperature for Taq polymerase</li>
  <li><strong>Repeat</strong> — cycle repeats from step 1, doubling DNA each time</li>
</ol>

<h3>Exponential Amplification</h3>
<p>Each cycle doubles the amount of DNA: <strong>x = 2ⁿ</strong> (where n = number of cycles, x = number of DNA molecules)</p>
<ul>
  <li>10 cycles → 1024 copies</li>
  <li>30 cycles → ~1 billion copies (2³⁰ ≈ 1.07 × 10⁹)</li>
</ul>
<div class="tip-box">⚠️ Must state elongation occurs at exactly <strong>72°C</strong> — this is the optimal temperature for Taq polymerase and is specifically required by VCAA.</div>
<div class="tip-box">⚠️ Two primers are needed (forward + reverse) because after denaturation there are two separate template strands, each requiring a different primer to define the target region.</div>

<h3>Forward vs Reverse Primers</h3>
<ul>
  <li><strong>Forward primer:</strong> binds to the 3' end of the template strand; points toward the target region</li>
  <li><strong>Reverse primer:</strong> binds to the 3' end of the non-template (coding) strand; points toward the target region from the other direction</li>
  <li>Together, they flank the target DNA sequence on both sides</li>
</ul>
`,

      {
        id: '4d',
        title: '4D — Gel Electrophoresis',
        content: `
<h3>Purpose</h3>
<p>Gel electrophoresis separates DNA fragments by size, allowing scientists to analyse and compare DNA samples. Used for DNA profiling, genetic screening, and paternity testing.</p>

<h3>Process — 4 Steps</h3>
<ol>
  <li><strong>Load samples:</strong> DNA samples (+ standard ladder) are loaded into wells at the negative end of an agarose gel using a micropipette</li>
  <li><strong>Apply electric current:</strong> negative electrode near wells; positive electrode at far end. DNA is negatively charged (phosphate backbone) → migrates toward the positive electrode</li>
  <li><strong>Separation by size:</strong> smaller fragments move faster and travel further through the gel pores; larger fragments move more slowly and travel less distance. After several hours, current is switched off — fragments form bands</li>
  <li><strong>Visualise:</strong> gel stained with fluorescent dye (e.g. ethidium bromide); bands visible under UV light</li>
</ol>

<h3>Key Terms</h3>
<div class="def-box">
  <div class="def-term">Standard ladder</div><div class="def-body">A sample with DNA fragments of known sizes (in bp or kb) run alongside test samples. Used to estimate the size of unknown fragments by comparison.</div>
  <div class="def-term">Base pair (bp)</div><div class="def-body">Unit of molecular size for nucleic acid sequences (1 bp = 1 nucleotide pair). Kilobase (kb) = 1000 bp.</div>
  <div class="def-term">Lane</div><div class="def-body">A column in the gel where one sample is loaded and migrates.</div>
</div>

<h3>Interpreting Gel Results</h3>
<ul>
  <li>Bands further from wells = smaller fragments (moved more)</li>
  <li>Bands closer to wells = larger fragments (moved less)</li>
  <li>Band position aligned with ladder band → estimate fragment size in bp</li>
  <li>Number of bands = number of different sized fragments in that sample</li>
  <li>Thickness of band = amount/volume of DNA (thicker = more DNA)</li>
  <li>Same band position in two lanes = same size fragment → possible match</li>
</ul>
<div class="tip-box">⚠️ Standard ladders are essential because the same sized fragment may travel different distances in different gels (due to voltage, gel density, buffer). Always compare to the ladder, never to another gel.</div>

<h3>DNA Profiling Applications</h3>
<ul>
  <li><strong>Forensics:</strong> matching crime scene DNA to suspects</li>
  <li><strong>Paternity testing:</strong> child should share bands with each biological parent</li>
  <li><strong>Genetic screening:</strong> detecting specific alleles (e.g. mutations causing disease)</li>
  <li><strong>Conservation biology:</strong> determining relatedness of species or individuals</li>
</ul>

<h3>Genotyping with Gel Electrophoresis</h3>
<ul>
  <li>If a restriction enzyme cuts at a mutation site: heterozygous individual shows bands from BOTH alleles (cut and uncut)</li>
  <li>Homozygous dominant (mutation): shows only the cut bands</li>
  <li>Homozygous recessive (no mutation): shows only the uncut band (larger)</li>
</ul>

<h3>Factors Affecting Results</h3>
<ul>
  <li>Voltage — higher voltage → faster migration</li>
  <li>Gel density — denser gel → slower migration, better resolution for small fragments</li>
  <li>Buffer concentration</li>
  <li>Time current is applied</li>
</ul>
`,

      {
        id: '4e',
        title: '4E — Recombination and Transformation',
        content: `
<h3>Why Transform Bacteria?</h3>
<p>Bacteria containing recombinant plasmids can produce large quantities of specific proteins cheaply and efficiently. Key proteins produced this way:</p>
<ul>
  <li>Insulin (diabetes management)</li>
  <li>Erythropoietin (treat anaemia)</li>
  <li>Chymosin (cheese production)</li>
  <li>Interferon (cancer treatment)</li>
  <li>Growth hormone (growth disorders)</li>
  <li>Hepatitis B surface antigen (vaccine)</li>
</ul>

<h3>Making a Recombinant Plasmid</h3>
<div class="def-box">
  <div class="def-term">Recombinant plasmid</div><div class="def-body">A plasmid that has been modified to incorporate a foreign gene of interest.</div>
  <div class="def-term">Plasmid vector</div><div class="def-body">A circular piece of bacterial DNA modified to be ideal for carrying genes into bacteria. Contains restriction sites, antibiotic resistance gene, reporter gene, and ORI.</div>
  <div class="def-term">cDNA (complementary DNA)</div><div class="def-body">DNA synthesised from mRNA using reverse transcriptase. Contains no introns — suitable for expression in bacteria (which lack splicing machinery).</div>
  <div class="def-term">Reverse transcriptase</div><div class="def-body">An enzyme that synthesises DNA from an mRNA template (mRNA → cDNA). Used to produce intron-free gene copies.</div>
</div>

<h3>Steps to Create Recombinant Plasmid</h3>
<ol>
  <li><strong>Isolate gene of interest</strong> — must exclude introns (bacteria can't splice them out). Use:
    <ul>
      <li>Synthetic DNA: made in lab without introns, OR</li>
      <li>cDNA: made from mRNA using reverse transcriptase (mRNA already has introns removed by splicing)</li>
    </ul>
  </li>
  <li><strong>Select plasmid vector</strong> containing: restriction sites, antibiotic resistance gene, reporter gene, ORI</li>
  <li><strong>Cut both plasmid AND gene of interest</strong> with the <em>same</em> restriction endonuclease → produces complementary sticky ends</li>
  <li><strong>Mix and ligate:</strong> gene of interest + cut plasmid mixed together → complementary sticky ends base-pair → DNA ligase catalyses phosphodiester bonds → recombinant plasmid</li>
</ol>

<h3>Plasmid Vector Components</h3>
<ul>
  <li><strong>Restriction endonuclease sites:</strong> where the plasmid is cut to insert the gene of interest</li>
  <li><strong>Antibiotic resistance gene:</strong> bacteria that took up the plasmid survive on antibiotic agar; others die</li>
  <li><strong>Reporter gene:</strong> (e.g. GFP — green fluorescent protein) inserted at restriction site; if gene of interest disrupts reporter → reporter gene is inactive → bacteria don't fluoresce → confirms gene of interest was inserted</li>
  <li><strong>Origin of replication (ORI):</strong> signals where DNA replication starts; ensures plasmid replicates when bacteria divides</li>
</ul>

<h3>Bacterial Transformation</h3>
<p>Introducing recombinant plasmids into bacteria:</p>
<div class="def-box">
  <div class="def-term">Heat shock method</div><div class="def-body">Bacteria + plasmid placed in CaCl₂ solution on ice (Ca²⁺ ions make membrane more permeable). Rapidly heated to 37–42°C for 25–45 seconds → returned to ice. Sudden temperature change increases membrane permeability → plasmid enters bacteria. Bacteria then spread on antibiotic agar.</div>
  <div class="def-term">Electroporation</div><div class="def-body">An electrical current is applied to bacterial cells, temporarily increasing membrane permeability to allow plasmid entry.</div>
</div>

<h3>Selecting Transformed Bacteria</h3>
<ol>
  <li>Plate all bacteria on antibiotic agar → only bacteria with the plasmid survive (antibiotic resistance gene)</li>
  <li>Check reporter gene expression → bacteria NOT expressing reporter = gene of interest inserted at reporter site = successful transformation</li>
</ol>

<h3>Insulin Production — Case Study</h3>
<ul>
  <li>Human insulin: quaternary structure with 2 chains (alpha and beta subunits)</li>
  <li>Requires <strong>2 recombinant plasmids</strong> → 2 different transformed bacteria (one per subunit)</li>
  <li>Subunits extracted separately, then combined</li>
  <li>Old method: pig/cow insulin (less effective, required killing animals)</li>
  <li>First produced in bacteria: late 1970s</li>
</ul>
`,
        flashcards: [
          {id:'4e-1', q:'Why must introns be removed from the gene of interest before inserting it into a bacterium?', a:'Bacteria lack the splicing machinery to remove introns. If introns remain, the bacteria cannot produce the correct protein. Introns are excluded by using synthetic DNA (made without introns) or cDNA (made from spliced mRNA using reverse transcriptase).'},
          {id:'4e-2', q:'What is cDNA and how is it made?', a:'Complementary DNA (cDNA) is made from mRNA using reverse transcriptase (an enzyme that synthesises DNA from an RNA template). Because mRNA has already had introns spliced out, cDNA contains no introns — suitable for expression in bacteria.'},
          {id:'4e-3', q:'What are the four components of a plasmid vector?', a:'1. Restriction endonuclease sites — for inserting gene of interest\n2. Antibiotic resistance gene — selects for transformed bacteria\n3. Reporter gene (e.g. GFP) — confirms gene of interest was inserted\n4. Origin of replication (ORI) — ensures plasmid replicates with bacteria'},
          {id:'4e-4', q:'Why must the same restriction endonuclease be used to cut both the plasmid and the gene of interest?', a:'Using the same enzyme produces complementary sticky ends on both fragments. These sticky ends can then base-pair together, allowing DNA ligase to join them into a recombinant plasmid.'},
          {id:'4e-5', q:'Describe the heat shock method for bacterial transformation.', a:'Bacteria + plasmid placed in CaCl₂ solution on ice (Ca²⁺ increases membrane permeability). Rapidly heated to 37–42°C for 25–45 seconds, then returned to ice. The sudden temperature change further increases membrane permeability, allowing plasmid to enter. Bacteria are spread on antibiotic agar.'},
          {id:'4e-6', q:'How is the antibiotic resistance gene used to select transformed bacteria?', a:'After transformation, bacteria are plated on agar containing the antibiotic. Only bacteria that took up the plasmid (containing the antibiotic resistance gene) survive. Bacteria without the plasmid die.'},
          {id:'4e-7', q:'How is the reporter gene used to confirm a gene of interest has been inserted?', a:'The gene of interest is inserted at the restriction site within the reporter gene, disrupting it. Bacteria with successful insertions cannot express the reporter gene (e.g. don\'t fluoresce with GFP). Bacteria with intact reporter = plasmid taken up but gene NOT inserted.'},
          {id:'4e-8', q:'Why does human insulin production require two recombinant plasmids?', a:'Human insulin has a quaternary structure with two polypeptide chains (alpha and beta subunits). Each chain is encoded by a different gene, so two separate recombinant plasmids (and two transformed bacteria cultures) are needed — one for each subunit.'},
          {id:'4e-9', q:'What is electroporation?', a:'A transformation method that uses an electric current to temporarily increase bacterial membrane permeability, allowing plasmids to enter the bacterial cell.'},
          {id:'4e-10', q:'Name three proteins produced by transformed bacteria and their uses.', a:'1. Insulin — regulates blood glucose (diabetes)\n2. Erythropoietin — stimulates red blood cell production (anaemia)\n3. Growth hormone — manages growth disorders\n(Also: chymosin for cheese, interferon for cancer, hepatitis B antigen for vaccine)'},

<h3>Key Definitions</h3>
<div class="def-box">
  <div class="def-term">Genetically modified organism (GMO)</div><div class="def-body">Any organism whose genome has been altered using genetic engineering technology. Includes organisms where genes are silenced, inserted, removed, or altered.</div>
  <div class="def-term">Cisgenic organism</div><div class="def-body">A GMO that has genes from the <strong>same species</strong> inserted into its genome (cisgenesis — genes could have been transferred by conventional breeding).</div>
  <div class="def-term">Transgenic organism</div><div class="def-body">A GMO that has genes from a <strong>different species</strong> inserted into its genome (transgenesis — foreign DNA from a separate species).</div>
</div>
<div class="tip-box">⚠️ Transgenic organisms are a type of GMO. GMO is the umbrella term; transgenic is a specific subset (foreign species DNA). Cisgenic is another subset (same species).</div>

<h3>Producing Transgenic Plants — 3 Stages</h3>
<ol>
  <li><strong>Gene identification:</strong> Identify and isolate the gene of interest (usually from another species) that confers a desirable characteristic (e.g. drought tolerance, pest resistance, nutritional improvement)</li>
  <li><strong>Gene delivery:</strong> Insert the gene into host organism cells via:
    <ul>
      <li>Direct insertion into the plant's genomic DNA, OR</li>
      <li>Bacterial plasmid vector (e.g. <em>Agrobacterium tumefaciens</em> naturally transfers DNA to plants)</li>
    </ul>
  </li>
  <li><strong>Gene expression:</strong> Transformed cells cultured under sterile conditions (plant tissue culture), regenerated into full plants, then applied in the field. Host organism expresses the new transgene as a functional protein.</li>
</ol>

<h3>Agricultural Uses of GMOs</h3>
<h4>1. Increasing Crop Productivity</h4>
<ul>
  <li>More efficient photosynthesis genes</li>
  <li>Improved drought/salt tolerance</li>
  <li>More efficient nutrient uptake (less fertiliser needed)</li>
  <li>Improved nutritional content (e.g. Golden Rice — produces beta-carotene/vitamin A)</li>

</ul>

<h4>2. Increasing Disease Resistance</h4>
<ul>
  <li>Genes conferring resistance to fungal/bacterial/viral pathogens</li>
  <li>Herbicide tolerance (e.g. glyphosate-resistant crops → targeted weed control)</li>
  <li>Pest resistance — Bt crops contain gene from <em>Bacillus thuringiensis</em> producing insecticidal proteins → reduces pesticide use</li>
  <li>Importance: ~30% of global crop yield lost to pathogens/pests annually; need to increase food production by 60% by 2050</li>
</ul>

<h3>Issues Surrounding GMOs</h3>

      <td><strong>Social</strong></td>

      <td><strong>Ethical</strong></td>

      <td>• "Playing God" concerns<br>• Altering evolutionary pathways of species<br>• Unknown long-term health effects</td>
    </tr>
  </table>
</div>
`,

// ── SPACED REPETITION (SM-2) ──────────────────────────────────────────────────
const SR_KEY = 'bio_notes_sr';
function srLoad(){try{return JSON.parse(localStorage.getItem(SR_KEY)||'{}')}catch{return{}}}
function srSave(d){localStorage.setItem(SR_KEY,JSON.stringify(d))}

function srGetCard(id){
  const d=srLoad();
  return d[id]||{interval:0,ease:2.5,due:0,reps:0};
}
function srReview(id,rating){
  // rating: 0=again,1=hard,2=good,3=easy
  const d=srLoad();
  let c=d[id]||{interval:0,ease:2.5,due:0,reps:0};
  const now=Date.now();
  if(rating===0){c.interval=1;c.reps=0;}
  else if(rating===1){c.interval=Math.max(1,Math.round(c.interval*1.2));c.ease=Math.max(1.3,c.ease-0.15);}
  else if(rating===2){c.interval=c.reps===0?1:c.reps===1?4:Math.round(c.interval*c.ease);c.reps++;c.ease=Math.max(1.3,c.ease-0.05);}
  else{c.interval=c.reps===0?1:c.reps===1?4:Math.round(c.interval*c.ease*1.3);c.reps++;c.ease=Math.min(3.5,c.ease+0.1);}
  c.due=now+c.interval*86400000;
  c.lastRating=rating;
  d[id]=c;
  srSave(d);
}
function isDue(id){const c=srGetCard(id);return c.due<=Date.now();}
function dueCount(){
  let n=0;
  CHAPTERS.forEach(ch=>ch.topics.forEach(t=>t.flashcards.forEach(fc=>{if(isDue(fc.id))n++;})));
  return n;
}
function allCards(){const all=[];CHAPTERS.forEach(ch=>ch.topics.forEach(t=>t.flashcards.forEach(fc=>all.push({...fc,topicTitle:t.title}))));return all;}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
let curTopic=null;
function buildNav(){
  const tree=document.getElementById('nav-tree');
  tree.innerHTML='';
  CHAPTERS.forEach(ch=>{
    const cl=document.createElement('div');
    cl.className='ch-label';cl.textContent=ch.title;tree.appendChild(cl);
    ch.topics.forEach(t=>{
      const d=document.createElement('div');
      d.className='nav-item';d.textContent=t.title;
      d.onclick=()=>showTopic(t.id);
      d.id='nav-'+t.id;
      tree.appendChild(d);
    });
  });
}
function showTopic(id){
  curTopic=id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl=document.getElementById('nav-'+id);
  if(navEl)navEl.classList.add('active');
  let topic=null,chTitle='';
  CHAPTERS.forEach(ch=>ch.topics.forEach(t=>{if(t.id===id){topic=t;chTitle=ch.title;}}));
  if(!topic)return;
  const due=topic.flashcards.filter(fc=>isDue(fc.id)).length;
  document.getElementById('main-content').innerHTML=`
    <div class="topic-header">
      <div>
        <div style="font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">${chTitle}</div>
        <h2>${topic.title}</h2>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${due>0?`<span class="badge due-badge">📅 ${due} due</span>`:'<span class="badge" style="background:var(--def-bg);color:var(--correct)">✅ Up to date</span>'}
        <button class="btn btn-sm" onclick="startFlashcards('${id}')">🃏 ${topic.flashcards.length} flashcards</button>
      </div>
    </div>
    <div class="topic-body">${topic.content}</div>
  `;
}
function showHome(){
  curTopic=null;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const due=dueCount();
  document.getElementById('main-content').innerHTML=`
    <div style="padding:40px 0;text-align:center;color:var(--muted)">
      <div style="font-size:2.5rem;margin-bottom:12px">🧬</div>
      <div style="font-weight:700;font-size:1.1rem;margin-bottom:6px;color:var(--text)">VCE Biology Study Notes</div>
      <div style="font-size:.88rem">Select a topic from the sidebar to start studying.</div>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${due>0?`<span class="badge due-badge" style="font-size:.85rem;padding:6px 14px">📅 ${due} flashcards due for review</span>`:'<span class="badge" style="background:var(--def-bg);color:var(--correct);font-size:.85rem;padding:6px 14px">✅ All flashcards up to date</span>'}
        <button class="btn btn-primary btn-sm" onclick="startFlashcards()">🃏 Study All Flashcards</button>
      </div>
    </div>
  `;
}

// ── FLASHCARDS ────────────────────────────────────────────────────────────────
let _fcDeck=[],_fcIdx=0,_fcAnswerShown=false;
function startFlashcards(filter){
  let deck;
  if(!filter||filter==='all'){
    deck=allCards();
  } else if(filter==='due'){
    deck=allCards().filter(fc=>isDue(fc.id));
    if(!deck.length){alert('No flashcards due for review today! 🎉');return;}
  } else {
    // topic id
    let topic=null;
    CHAPTERS.forEach(ch=>ch.topics.forEach(t=>{if(t.id===filter)topic=t;}));
    if(!topic)return;
    deck=topic.flashcards.map(fc=>({...fc,topicTitle:topic.title}));
  }
  // Shuffle
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  _fcDeck=deck;_fcIdx=0;_fcAnswerShown=false;
  document.getElementById('fc-overlay').classList.remove('hidden');
  renderFC();
}
function closeFlashcards(){document.getElementById('fc-overlay').classList.add('hidden');}
function renderFC(){
  if(_fcIdx>=_fcDeck.length){showFCDone();return;}
  const fc=_fcDeck[_fcIdx];
  const pct=Math.round(_fcIdx/_fcDeck.length*100);
  document.getElementById('fc-prog').style.width=pct+'%';
  document.getElementById('fc-counter').textContent=`${_fcIdx+1} / ${_fcDeck.length}`;
  document.getElementById('fc-topic-label').textContent=fc.topicTitle||'';
  _fcAnswerShown=false;
  document.getElementById('fc-body').innerHTML=`
    <div class="fc-card" onclick="showFCAnswer()" id="fc-card">
      <div class="fc-q">${fc.q}</div>
      <div class="fc-a" id="fc-ans">${fc.a.replace(/\n/g,'<br>')}</div>
      <div class="fc-hint" id="fc-hint">Tap to reveal answer</div>
    </div>
    <div class="fc-btns hidden" id="fc-rate-btns">
      <button class="fc-rate rate-again" onclick="rateFC(0)">😵 Again</button>
      <button class="fc-rate rate-hard" onclick="rateFC(1)">😬 Hard</button>
      <button class="fc-rate rate-good" onclick="rateFC(2)">🙂 Good</button>
      <button class="fc-rate rate-easy" onclick="rateFC(3)">😄 Easy</button>
    </div>
  `;
}
function showFCAnswer(){
  if(_fcAnswerShown)return;
  _fcAnswerShown=true;
  document.getElementById('fc-ans').classList.add('show');
  document.getElementById('fc-hint').style.display='none';
  document.getElementById('fc-rate-btns').classList.remove('hidden');
}
function rateFC(rating){
  const fc=_fcDeck[_fcIdx];
  srReview(fc.id,rating);
  _fcIdx++;
  renderFC();
}
function showFCDone(){
  document.getElementById('fc-prog').style.width='100%';
  document.getElementById('fc-counter').textContent='Done!';
  document.getElementById('fc-body').innerHTML=`
    <div class="fc-done">
      <div style="font-size:3rem;margin-bottom:16px">🎉</div>
      <h3>Session Complete!</h3>
      <p style="color:var(--muted);margin-top:8px">You reviewed ${_fcDeck.length} card${_fcDeck.length!==1?'s':''}. Keep it up!</p>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="startFlashcards('all')">🔄 Study Again</button>
        <button class="btn" onclick="startFlashcards('due')">📅 Review Due</button>
        <button class="btn" onclick="closeFlashcards()">✕ Exit</button>
      </div>
    </div>
  `;
}

// ── THEME ─────────────────────────────────────────────────────────────────────
function toggleTheme(){
  const root=document.documentElement;
  const cur=root.getAttribute('data-theme');
  if(cur==='dark')root.setAttribute('data-theme','light');
  else root.setAttribute('data-theme','dark');
  try{localStorage.setItem('bio_notes_theme',root.getAttribute('data-theme'))}catch{}
}
try{const th=localStorage.getItem('bio_notes_theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch{}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildNav();
showHome();
// auto-show first topic if URL hash set
if(location.hash){const id=location.hash.slice(1);setTimeout(()=>showTopic(id),50);}
</script>
