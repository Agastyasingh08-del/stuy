. Which of the following correctly provides an example of a cellular pathogen, non-cellular pathogen and allergen? Cellular pathogen Non-cellular pathogen Allergen","marks":1,"options":[{"label":"A","text":"virus fungus prion"},{"label":"B","text":"bacterium virus dog hair"},{"label":"C","text":"fungus bacterium virus"},{"label":"D","text":"prion dog hair pollen"}],"correctAnswer":"B","examinerReport":"Option B is correct; cellular pathogens include bacteria and fungi, while viruses and prions are non-cellular pathogens and allergens including substances such as dog hair and pollen.","reportStats":{"A":5.0,"B":88.0,"C":2.0,"D":6.0},"images":[],"reportImages":[],"preloaded":true,"examPage":14},{"id":"vcabio2025_25","year":"2025","examName":"VCE Biology","number":"25","topic":"Immune Response","type":"mcq","text":"A student was feeling unwell and had a sore throat. She touched her neck area and could feel many small swollen lymph nodes. In the swollen lymph nodes","marks":1,"options":[{"label":"A","text":"swelling is caused by an accumulation of red blood cells."},{"label":"B","text":"some of the lymphocytes undergo clonal selection and expansion."},{"label":"C","text":"macrophages present antigens to dendritic cells."},{"label":"D","text":"lymph fluid is filtered and lymphocytes are removed."}],"correctAnswer":"B","examinerReport":"Swelling of the lymph nodes would be due to an accumulation of fluid or white blood cells in the area. This eliminates option A. Macrophages and dendritic cells present antigens on their MHC-II markers to T helper cells, making option C incorrect. In the lymph nodes, lymph fluid is screened and pathogens are removed, making option D incorrect. When a pathogen is detected, clonal selection and expansion of lymphocytes (specific T and B cells) occurs, therefore option B is correct.","reportStats":{"A":19.0,"B":64.0,"C":9.0,"D":8.0},"images":[],"reportImages":[],"preloaded":true,"examPage":14},{"id":"vcabio2025_26","year":"2025","examName":"VCE Biology","number":"26","topic":"Immune Response","type":"mcq","text":"In an inflammatory response","marks":1,"options":[{"label":"A","text":"pathogens are engulfed by natural killer cells."},{"label":"B","text":"the number of white blood cells circulating in the blood is reduced."},{"label":"C","text":"the activation of the immune system is prevented to avoid internal damage."},{"label":"D","text":"blood flow is increased to the infection site, allowing more immune cells to reach the area."}],"correctAnswer":"D","examinerReport":"Inflammatory responses lead to vasodilation (increased blood flow) and increased capillary permeability, which result in more white blood cells reaching the site of infection. This makes option D correct.","reportStats":{"A":3.0,"B":1.0,"C":1.0,"D":94.0},"images":[],"reportImages":[],"preloaded":true,"examPage":15},{"id":"vcabio2025_27","year":"2025","examName":"VCE Biology","number":"27","topic":"Proteins & Enzymes","type":"mcq","text":"Many molecules are involved in an innate immune response. Which of the following correctly matches the molecule with its characteristic and function? Molecule Characteristic Function","marks":1,"options":[{"label":"A","text":"histamine acts as an enzyme causes vasodilation"},{"label":"B","text":"interferon produced by viral infected cells breaks down bacterial cell walls"},{"label":"C","text":"complement protein circulates in an inactive form in the blood once activated, can result in cell lysis"},{"label":"D","text":"lysozyme produced by mast cells signals to help protect adjacent cells"}],"correctAnswer":"C","examinerReport":"Students need to be familiar with the roles of the different molecules involved in the innate immune response. Histamines are released by mast cells and are involved in triggering the inflammatory response. Option A is incorrect as they do not act as enzymes. Option B is incorrect as interferons are produced by virally infected cells, but act to prevent the infection of other nearby uninfected cells. Option D is incorrect as lysozymes are produced by phagocytic cells to help in the destruction of pathogens. Option C is correct as complement proteins are usually inactive in the blood, and when activated they cause lysis of cells.","reportStats":{"A":26.0,"B":10.0,"C":58.0,"D":5.0},"images":[],"reportImages":[],"preloaded":true,"examPage":15},{"id":"vcabio2025_28","year":"2025","examName":"VCE Biology","number":"28","topic":"Immune Response","type":"mcq","text":"The primary function of plasma cells is to","marks":1,"options":[{"label":"A","text":"produce antibodies that bind to specific antigens on the surfaces of pathogens."},{"label":"B","text":"destroy virally infected cells through phagocytosis."},{"label":"C","text":"secrete cytokines to communicate with other immune cells."},{"label":"D","text":"present antigens to helper T cells. Use the following information to answer Questions 29 and 30. The following graph shows antibody concentration during two exposures a person had to the same antigen. 7 6 5 4 3 2 1 0 0 10 20 30 40 50 antibody concentration (arbitrary units) time (day) <https://pressbooks-dev.oer.hawaii.edu/anatomyandphysiology2021> licensed CC-BY 4.0"}],"correctAnswer":"A","examinerReport":"Plasma cells are a part of the adaptive humoral immune response. They secrete specific antibodies that bind to the antigens on extracellular pathogens. Therefore, option A is correct.","reportStats":{"A":82.0,"B":4.0,"C":9.0,"D":4.0},"images":[],"reportImages":[],"preloaded":true,"examPage":15},{"id":"vcabio2025_29","year":"2025","examName":"VCE Biology","number":"29","topic":"Immune Response","type":"mcq","text":"On what day was the person most likely first exposed to the antigen?","marks":1,"options":[{"label":"A","text":"2"},{"label":"B","text":"13"},{"label":"C","text":"22"},{"label":"D","text":"30"}],"correctAnswer":"A","examinerReport":"Antibodies are produced by plasma cells as part of the adaptive humoral immune response. When an individual is first exposed to an antigen, no existing antibodies or memory cells exist, and this third line of defence takes time to come into effect to produce antibodies. As the antibody concentration only begins to increase on day 13, the individual could not have been exposed on that day and must have been exposed earlier. Therefore, day 2 (option A) is the only correct answer.","reportStats":{"A":27.0,"B":69.0,"C":4.0,"D":1.0},"images":[],"reportImages":[],"preloaded":true,"examPage":16},{"id":"vcabio2025_30","year":"2025","examName":"VCE Biology","number":"30","topic":"Immune Response","type":"mcq","text":"Which one of the following statements is correct?","marks":1,"options":[{"label":"A","text":"On day 0, there is an absence of antibodies because cytotoxic T cells are inactive."},{"label":"B","text":"On day 10, T cells quickly differentiate into plasma cells."},{"label":"C","text":"On day 15, the antibody concentration is half that of day 35."},{"label":"D","text":"On day 33, activation of memory cells leads to the highest concentration of antibodies."}],"correctAnswer":"D","examinerReport":"Option A is incorrect because the individual has not been exposed to the antigen and cytotoxic T cells do not produce antibodies. Option B is incorrect, as plasma cells are formed from the differentiation of B cells, not T cells. After the first exposure to the antigen, memory cells are formed and upon subsequent antigenic exposure, these memory cells are reactivated leading to a faster and larger production of antibodies. This increase begins to be visible from day 35, therefore the activation could have taken place just prior to this (day 33) resulting in the faster antibody production, making option D correct.","reportStats":{"A":25.0,"B":8.0,"C":4.0,"D":63.0},"images":[],"reportImages":[],"preloaded":true,"examPage":16},{"id":"vcabio2025_31","year":"2025","examName":"VCE Biology","number":"31","topic":"Immune Response","type":"mcq","text":"In human populations, high vaccination rates","marks":1,"options":[{"label":"A","text":"reduce the spread of pathogens between members of the population, protecting susceptible people."},{"label":"B","text":"create herd immunity by increasing transmission of the pathogen between vaccinated individuals."},{"label":"C","text":"create passive artificial immunity through exposure to the specific antigen."},{"label":"D","text":"prevent antigenic shift by removing all human hosts."}],"correctAnswer":"A","examinerReport":"A large proportion of the population vaccinated results in herd immunity. This reduces the number of available hosts and subsequently the transmission of the pathogen between individuals, supporting option A.","reportStats":{"A":90.0,"B":6.0,"C":4.0,"D":0.0},"images":[],"reportImages":[],"preloaded":true,"examPage":16},{"id":"vcabio2025_32","year":"2025","examName":"VCE Biology","number":"32","topic":"Pathogens & Disease","type":"mcq","text":"In a particular human population, over a short period, there was a big increase in the number of people with symptoms caused by an infectious pathogen. The health authorities examined several factors associated with the population. Which of the following correctly identifies the factor that influences whether the pathogen is new or re-emerging? Factor associated with the population New pathogen or re-emerging pathogen","marks":1,"options":[{"label":"A","text":"increased access to medical treatment re-emergence of a known pathogen in the population"},{"label":"B","text":"a decline in immunisation rates in the population emergence of a new pathogen in the population"},{"label":"C","text":"members of the human population travelling the world and returning home emergence of a new pathogen in the population"},{"label":"D","text":"improved sanitation and living conditions for people in the population re-emergence of a known pathogen in the population"}],"correctAnswer":"C","examinerReport":"Option C is correct because if individuals in a population travel, they may encounter new pathogens in other locations and bring these back to their own population, resulting in the emergence of this pathogen within their own population.","reportStats":{"A":5.0,"B":7.0,"C":84.0,"D":4.0},"images":[],"reportImages":[],"preloaded":true,"examPage":17},{"id":"vcabio2025_33","year":"2025","examName":"VCE Biology","number":"33","topic":"Immune Response","type":"mcq","text":"A particular pathogenic change requires the immediate development of a new vaccine. This change most likely involves","marks":1,"options":[{"label":"A","text":"antigenic drift, leading to minimal structural change to the pathogen."},{"label":"B","text":"bacterial mutations, which can provide antibiotic resistance."},{"label":"C","text":"antigen mutations, with no change in antigen shape."},{"label":"D","text":"an antigenic shift, producing a new viral strain."}],"correctAnswer":"D","examinerReport":"Bacterial mutations that result in antibiotic resistance do not often affect antigen structure, so new vaccines would not need to be developed, eliminating option B. Antigenic drift is the result of minor alterations in viral antigens that may still allow existing antibodies and memory cells to recognise the virus, so a new vaccine would not be required, eliminating option A. Antigenic shift results in the combination of genetic material from multiple viruses, leading to new antigens which would not be recognised by existing antibodies and memory cells. As such, a new vaccine would need to be developed in this situation, making option D correct.","reportStats":{"A":6.0,"B":13.0,"C":2.0,"D":79.0},"images":[],"reportImages":[],"preloaded":true,"examPage":18},{"id":"vcabio2025_34","year":"2025","examName":"VCE Biology","number":"34","topic":"Scientific Investigation","type":"mcq","text":"An investigation compared the dingo genome with that of wolves and five breeds of domestic dogs (Great Dane, Boxer, German Shepherd, Basenji and Labrador). A phylogenetic tree showing these relationships was drawn. wolf dingo German Shepherd Basenji Labrador Great Dane Boxer Science Advances, vol. 8, no. 16, 22 April 2022 This phylogenetic tree suggests that","marks":1,"options":[{"label":"A","text":"dingoes are not related to wolves or German Shepherds."},{"label":"B","text":"the differences in DNA sequences between Great Danes and Boxers are less than they are between Great Danes and dingoes."},{"label":"C","text":"the wolves, dingoes and five breeds of domestic dogs have no common ancestor."},{"label":"D","text":"Labradors are more closely related to Basenjis than to German Shepherds."}],"correctAnswer":"B","examinerReport":"Typically, phylogenetic trees are used to compare the relatedness of species or populations based on molecular homology. When interpreting phylogenetic trees, the most recent node you can trace back to when comparing two species is when they share the most recent common ancestor. Therefore, Labradors are equally related to German Shepherds and Basenjis, so option D is not correct. Option B is correct because species that are more closely related will have fewer differences in their molecular homology (DNA or amino acids).","reportStats":{"A":2.0,"B":86.0,"C":2.0,"D":10.0},"images":[],"reportImages":[],"preloaded":true,"examPage":18},{"id":"vcabio2025_35","year":"2025","examName":"VCE Biology","number":"35","topic":"General Biology","type":"mcq","text":"Consider the image of the lemur below. Which characteristic seen in the image allows the lemur to be classified as a primate?","marks":1,"options":[{"label":"A","text":"the presence of a tail"},{"label":"B","text":"the presence of an opposable thumb"},{"label":"C","text":"the presence of fur covering the body"},{"label":"D","text":"the presence of side-facing eyes"}],"correctAnswer":"B","examinerReport":"The presence of a tail and fur covering the body would not help distinguish this lemur as a primate from other mammals who also possess a tail. However, not all mammals have an opposable thumb, so this classifies the lemur as a primate, making option B correct.","reportStats":{"A":16.0,"B":75.0,"C":7.0,"D":2.0},"images":[],"reportImages":[],"preloaded":true,"examPage":19},{"id":"vcabio2025_36","year":"2025","examName":"VCE Biology","number":"36","topic":"Evolution","type":"mcq","text":"Scientists investigated the evolution of both reptiles and mammals. The fossil record indicates that reptiles were present before mammals. A fossil has been found that shows characteristics of both reptiles and mammals. This fossil could be used to","marks":1,"options":[{"label":"A","text":"determine the absolute age of the first mammal."},{"label":"B","text":"compare all characteristics of reptiles with those of mammals."},{"label":"C","text":"support the hypothesis that reptiles and mammals share a common ancestor."},{"label":"D","text":"show that reptiles were the most common animal living before the appearance of mammals."}],"correctAnswer":"C","examinerReport":"Fossils that contain characteristics of two different types of organisms, such as reptiles and mammals in this example, are called transitional fossils. These fossils indicate that the two share a common ancestor at some point in the evolutionary journey, so option C is the correct answer. These fossils are not always complete, so cannot show all characteristics of the organisms, making option B incorrect.","reportStats":{"A":7.0,"B":9.0,"C":79.0,"D":6.0},"images":[],"reportImages":[],"preloaded":true,"examPage":19},{"id":"vcabio2025_37","year":"2025","examName":"VCE Biology","number":"37","topic":"Evolution","type":"mcq","text":"The following fossils have been located in rock layers, as shown below. The age of some of the layers has been determined. Layer P Key mya – million years ago fossil X fossil Y fossil Z Layer Q 120 mya Layer R 145 mya Layer S Layer T 165 mya Which one of the following can be inferred using the information in the diagram?","marks":1,"options":[{"label":"A","text":"Fossil Z is an organism that went extinct 165 mya."},{"label":"B","text":"Fossil X is dated between 145 mya and 165 mya."},{"label":"C","text":"Fossil Z can be used as an index fossil."},{"label":"D","text":"Fossil Y is older than Fossil X."}],"correctAnswer":"B","examinerReport":"The image shows the time periods (age) of some layers. The younger the age, the higher the layer is, and vice versa. Therefore, fossil X, which is only present in layer S, must be between the ages of 145 and 165 mya. Thus, option B is correct. Students should note that index fossils are useful when abundant and present in many locations, and exist only in one time period, thus making option C incorrect.","reportStats":{"A":1.0,"B":80.0,"C":16.0,"D":2.0},"images":[],"reportImages":[],"preloaded":true,"examPage":20},{"id":"vcabio2025_38","year":"2025","examName":"VCE Biology","number":"38","topic":"Evolution","type":"mcq","text":"The pig-nosed turtle, Carettochelys insculpta, is a freshwater turtle. In Australia, the turtle is found only in the Northern Territory. Scientists hypothesised that the pig-nosed turtle recently arrived in Australia from nearby countries. They are now reconsidering their hypothesis based on new evidence. Which piece of evidence could the scientists now have that refutes their original hypothesis?","marks":1,"options":[{"label":"A","text":"finding five-million-year-old fossilised remains of the pig-nosed turtle in Melbourne, Australia"},{"label":"B","text":"noticing vestigial structures within the digestive system of the pig-nosed turtle"},{"label":"C","text":"observing differences in mtDNA between individual pig-nosed turtles"},{"label":"D","text":"recording homologous structures in a number of turtle species End of Section A Use the following information to answer Questions 39 and 40. A Year 12 student conducts an investigation into the effects of different amounts of water on the growth of lettuce plants. The following table outlines some aspects of the investigation. Lettuce plant Amount of water (mL/day) Temperature (°C) Light wavelength (nm) Percentage increase in mass of lettuce (%) 1 150 10 660 5 2 200 15 660 10 3 250 20 660 15 4 300 25 660 13"}],"correctAnswer":"A","examinerReport":"Students must remember to use all the information provided in the question; in this case it was stated the pig-nosed turtle was found only in the Northern Territory and was hypothesised to have recently arrived in Australia. This specific hypothesis, which related to time of arrival, can only be disputed by evidence that would indicate it was not a recent arrival, such as finding five-million-year-old fossilised remains, as referred to in option A. Evidence of vestigial or homologous structures and molecular homology would not dispute this specific hypothesis of when the pig-nosed turtle arrived in Australia.","reportStats":{"A":69.0,"B":5.0,"C":13.0,"D":13.0},"images":[],"reportImages":[],"preloaded":true,"examPage":21},{"id":"vcabio2025_39","year":"2025","examName":"VCE Biology","number":"39","topic":"Scientific Investigation","type":"mcq","text":"The investigation is not considered valid because","marks":1,"options":[{"label":"A","text":"it contains more than one dependent variable."},{"label":"B","text":"only lettuce is used in the investigation."},{"label":"C","text":"the light wavelength is set at 660 nm."},{"label":"D","text":"the temperature is different for each plant."}],"correctAnswer":"D","examinerReport":"The Year 12 student experiment was investigating the effects of different amounts of water (independent variable, what is being changed) on the growth of lettuce plants (dependent variable, what is being measured). The experiment would be valid if there was only one independent and one dependent variable, with all other variables controlled. However, from the table of results, temperature has not been controlled for each lettuce plant, making option D correct. As temperature is an additional independent variable, not a dependent variable, option A is incorrect.","reportStats":{"A":15.0,"B":2.0,"C":3.0,"D":80.0},"images":[],"reportImages":[],"preloaded":true,"examPage":22},{"id":"vcabio2025_40","year":"2025","examName":"VCE Biology","number":"40","topic":"Photosynthesis","type":"mcq","text":"Which one of the following would be the most likely qualitative data for this investigation?","marks":1,"options":[{"label":"A","text":"the concentration of carbon dioxide in the air surrounding each plant"},{"label":"B","text":"the number of chlorophyll molecules in each lettuce leaf"},{"label":"C","text":"the shape of the lettuce leaves"},{"label":"D","text":"the mass of minerals in the water This page is blank. Examination continues on the next page. 2025 VCE Biology"}],"correctAnswer":"C","examinerReport":"Qualitative data is observational and can be subjective, compared to quantitative data which is numerical, objective and can be measured. All of concentration, number and mass are measurable units of data, making these quantitative. Therefore, the shape of the lettuce leaves in option C is the only qualitative data present. Section B","reportStats":{"A":9.0,"B":6.0,"C":81.0,"D":3.0},"images":[],"reportImages":[],"preloaded":true,"examPage":22},{"id":"vcabio2025_1a","year":"2025","examName":"VCE Biology","number":"1a","topic":"DNA & Gene Expression","type":"extended","text":"Construct a diagram of an mRNA molecule in the space provided below to show the result of mRNA processing of the insulin gene. Label three modifications as a result of mRNA processing on the diagram.","marks":3,"options":[],"correctAnswer":null,"examinerReport":"The diagram should be replicated with an indication that either introns had been removed OR exons spliced together, as shown in the sample answer below:\n\nTwo additional modifications that could have been drawn and labelled included:\nmethyl/modified guanine cap\npoly-A tail\nalternative splicing (or a specific example such as intron retention or exon juggling).\nThe thin lines connecting exons 1 and 2, and exons 2 and 3 in the original diagram were introns. Students were required to recognise that these non-protein coding regions are removed as a result of mRNA processing (post-transcription modification).\nStudents were required to recognise that the modified guanine cap (methyl cap) and the poly-A tail should be added to opposite ends of the final mRNA strand. However, they were not required to recall that these are added to the 5’ and 3’ end, respectively.\nStudents are encouraged to write in blue or black pen, even when drawing diagrams, to ensure answers scan clearly.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":24},{"id":"vcabio2025_1b","year":"2025","examName":"VCE Biology","number":"1b","topic":"Biotechnology","type":"short","text":"Recombinant DNA technologies are used to produce large quantities of human insulin to treat diabetes. Shown below are some of the steps involved in one method used in the production of human insulin. Two steps are incomplete. Complete step 4 and step 8 in the spaces provided below. Step 1 – Obtain genes coding for the two insulin amino acid chains A and B. Step 2 – Isolate the plasmids, each of which contains an antibiotic resistance gene. Step 3 – \u0007Some of these plasmids are mixed with genes coding for amino acid chain A. Remaining plasmids are mixed with genes coding for amino acid chain B. Step 4 – DNA ligase Step 5 – \u0007All bacteria are exposed to heat shock to take up the recombinant plasmids. Step 6 – \u0007Bacteria are grown on nutrient plates containing antibiotics. Transformed bacteria will survive and express genes. Step 7 – Isolate amino acid chains A and B from the bacteria. Step 8 – Amino acid chains A and B","marks":2,"options":[],"correctAnswer":null,"examinerReport":"In Step 4, DNA ligase joins the phosphodiester bonds between the human insulin gene A or B and their respective plasmid.\nIn Step 8, amino acid chains A and B are combined to produce a functional insulin protein or quaternary structure.\nStudents commonly misunderstood that each of the insulin genes are inserted separately into their respective plasmid and are not inserted together into the same plasmid.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":24},{"id":"vcabio2025_2a","year":"2025","examName":"VCE Biology","number":"2a","topic":"DNA & Gene Expression","type":"short","text":"Explain how enzymes such as those coded by the genes within the trp operon catalyse biochemical reactions. Use the following information to answer part b and part c on page 27. The graph below shows the activity of the enzymes coded by the genes within the trp operon. At 20 minutes, the bacteria were shifted from an environment containing trp to an environment without trp. The solid line represents a model simulation of enzyme activity, while the triangles and squares represent two sets of experimental data. 1.2 1.0 0.8 0.6 0.4 0.2 0.0 0 20 40 60 80 100 120 140 160 180 200 enzyme activity (arbitrary units) time (minutes) A modeling study and comparison with experimental data’, PNAS, vol. 98, no. 4, 13 February 2001","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Enzymes have an active site complementary to specific substrate(s), which bind to that active site. Enzymes lower the activation energy required to convert substrates into products.\nAs the question required students to explain how enzymes catalyse biochemical reactions, marks were not awarded for only stating that enzymes catalyse or speed up reactions.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":26},{"id":"vcabio2025_2b","year":"2025","examName":"VCE Biology","number":"2b","topic":"DNA & Gene Expression","type":"extended","text":"Referring to the graph, explain why enzyme activity remains low between 0 and 20 minutes and why it remains steady after approximately 60 minutes. As part of your response, explain how the repression and attenuation mechanisms work together to regulate the production of enzymes coded by genes within the trp operon.","marks":5,"options":[],"correctAnswer":null,"examinerReport":"Students were required to make reference to both timeframes referred to in the question, recognising that between 0 and 20 minutes, trp was present in the cell and therefore enzyme activity was low as represented by the graph. After 60 minutes, trp was absent and therefore enzyme activity was steadily high as represented by the graph.\nResponses could have included:\nBetween 0 and 20 minutes when trp is present:\nrepression and/or attenuation are occurring\nthe rate of transcription is low because the trp repressor periodically detaches from the operator\nAfter 60 minutes when trp is absent and enzyme activity is constant:\nrepression and/or attenuation are not occurring\nattenuation prevents more enzymes from being synthesised\nenzymes already produced for trp synthesis are saturated or other limiting factors were present.\nRepression and attenuation work together to regulate the production of enzymes:\nwhen trp levels are high\nto prevent transcription and/or translation\nto prevent trp being synthesised\nthrough attenuation occurring when repression fails.\nIn many cases, students provided detailed knowledge of the mechanisms of repression and attenuation in both scenarios where trp was present and absent. However, accurate knowledge of these regulation mechanisms is required for the responses to be awarded full marks. Common mistakes included stating the repressor binds to the promoter or RNA polymerase was not able to translate genes, or confusing the terminator and anti-terminator hairpin loop.\nStudents are also reminded to read the axis labels carefully. In this question, students often confused the y-axis as representing trp concentration as opposed to enzyme activity.\nAnswering in dot points is acceptable and can help students to ensure they are addressing all parts of a question. Students should use the number of marks as an indication of the level of detail required in their response.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":26},{"id":"vcabio2025_2c","year":"2025","examName":"VCE Biology","number":"2c","topic":"Proteins & Enzymes","type":"short","text":"The model simulation captures the general trend of enzyme activity but does not accurately replicate the experimental data, especially when the bacteria are first moved to a trp-free environment. State two possible limitations of the model simulation that could account for the differences in the data from the simulation and the two experiments.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Examples of limitations for the model simulation could have included that the simulation:\nis overly simplified\ndoes not account for what occurs in real time or in all prokaryotes\nassumes ideal conditions or does not consider other factors that may have changed, such as temperature or pH\nrepresents a general trend that excludes outliers\ndoes not represent the results observed in the two sets of experimental data or enzyme activity above 1.0 (which is seen in the experimental data)\nonly accounted for when trp concentration was present or absent, rather than when this concentration would vary.\nThis question was commonly misinterpreted by students who provided limitations of the two sets of experimental data (shown by triangles and squares) as opposed to the limitations of the model simulation.\nExample of a high-scoring student response:\nThe model was overly simplified and did not replicate real world random variations in trp levels in the cell.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":26},{"id":"vcabio2025_2d","year":"2025","examName":"VCE Biology","number":"2d","topic":"DNA & Gene Expression","type":"short","text":"In the past, bacteria had four stop codons, including UGG, and no codon for trp. The UGG codon in bacteria now codes for trp. Identify a consequence for the bacteria of the UGG codon now coding for trp. Justify your response.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"In this response, students were required to identify a consequence for the bacteria now containing a codon for trp (as opposed to an additional stop codon) and justify their response. Students needed to associate this different codon with an impact on protein formation, structure and/or function and a consequence for the bacteria as a result.\nExamples of impacts on protein formation, structure and/or function could have included:\npolypeptide sequence is longer or contains additional trp amino acids\npolypeptide chains will fold differently\ndifferent proteins/enzymes produced\npreviously produced proteins may no longer be functional.\nExamples of appropriate consequences, either positive or negative, for the bacteria could have included:\nadditional amino acids were required to be synthesised or obtained from the environment\nattenuation (or mechanisms of this process) would now be required or tRNA exists carrying trp\nadditional energy was required by the cell\nless chance of nonsense mutations occurring\nincreased or decreased bacterial survival.\nExample of a high-scoring student response:\nPrevious genes with the UGG codon at the end would now code for a longer primary structure of the protein as the UGG codon now codes for trp, rather than signalling termination of translation.\nChanges in primary structure may alter proteins in these bacteria.\nLack of functional proteins disadvantageous for survival of bacteria.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":26},{"id":"vcabio2025_3a","year":"2025","examName":"VCE Biology","number":"3a","topic":"Photosynthesis","type":"extended","text":"C3 , C4 and CAM plants all use Rubisco in photosynthesis. Place a cross (X) in the correct boxes in the following table to indicate the location of Rubisco activity for each plant type. Place another cross (X) in the correct boxes to indicate the time of day when Rubisco activity is greatest for each plant type. Location of Rubisco activity Time of day when Rubisco activity is greatest Mesophyll cells Bundle sheath cells Daytime Night-time C3 C4 CAM Use the following information to answer part b and part c below. The student read the following statement in their Biology textbook: ‘The rate of photorespiration increases with an increase in temperature in C3 plants.’","marks":3,"options":[],"correctAnswer":null,"examinerReport":"Location of Rubisco activity\nTime of day when Rubisco activity is greatest\n\nMesophyll cells\nBundle sheath cells\nDaytime\nNight-time\nC3\nX\n\nX\n\nC4\n\nX\nX\n\nCAM\nX\n\nX\n\nStudents were awarded 1 mark for every two boxes correct. No mark was awarded when students put a cross in both cell locations or both times of day for a specific plant type.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":28},{"id":"vcabio2025_3b","year":"2025","examName":"VCE Biology","number":"3b","topic":"Photosynthesis","type":"short","text":"Explain why the rate of photorespiration increases with an increase in temperature in C3 plants.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"With increasing temperature, C3 plants do not have any adaptations to reduce photorespiration or may close their stomata. Oxygen is more likely to bind with Rubisco as opposed to carbon dioxide.\nIn their response, students needed to indicate that it is specifically Rubisco which fixes oxygen and carbon dioxide (not carbon), rather than just the plant/cell in general. Statements about denaturation were not awarded marks. Students should also recognise that if denaturation occurred at higher temperatures, it would cause a permanent irreversible alteration of Rubisco’s active site, meaning neither oxygen nor carbon dioxide would bind successfully.\nSpelling is not penalised in written responses in Biology exams, unless the misspelled word is a different correct word (e.g. if students misspelled ‘stoma’ as ‘stroma’ in this question).","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":28},{"id":"vcabio2025_3c","year":"2025","examName":"VCE Biology","number":"3c","topic":"Scientific Investigation","type":"short","text":"The student wanted to test the statement by conducting a controlled experiment. The student proposed that they would need to control the amount of sunlight and water that each plant received.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":28},{"id":"vcabio2025_3iii","year":"2025","examName":"VCE Biology","number":"3iii","topic":"Scientific Investigation","type":"short","text":"The student proposed using the amount of glucose in the plant as the dependent variable. Their teacher suggested that this would not be an appropriate dependent variable for their experiment. Describe two reasons why this would not be an appropriate dependent variable for their experiment.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":28},{"id":"vcabio2025_4a","year":"2025","examName":"VCE Biology","number":"4a","topic":"Biotechnology","type":"short","text":"Complete the table below, using the information provided, to determine whether each crop is transgenic, genetically modified or both. Justify each response. Crop Transgenic, genetically modified or both Justification rice maize","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Crop\n\nTransgenic, genetically modified or both\nJustification\nrice\n\nGenetically modified\n\nThe (OsHXK1) gene in rice has been edited without inserting a gene from a different species\nmaize\n\nBoth\nThe maize genome was edited by inserting genes from a different species (Bacillus thuringiensis) into it and all transgenic organisms are genetically modified","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":30},{"id":"vcabio2025_4b","year":"2025","examName":"VCE Biology","number":"4b","topic":"General Biology","type":"short","text":"Explain how the editing of the OsHXK1 gene in rice could result in an increased crop yield.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Explanation of how editing of the OsHXK1 gene in rice could result in an increased crop yield could have included:\nmore light energy absorbed\nincreased rate of photosynthesis\ngreater production of glucose.\nSome responses simply restated that chlorophyll levels in the leaves were increased, rather than connecting increased chlorophyll levels to the ability of the leaves to absorb more light energy or to carry out more photosynthesis. These responses were not awarded a mark. Other responses about increased growth rate were also not awarded a mark, as they needed to be connected to how this would occur (e.g. by producing more glucose).","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":30},{"id":"vcabio2025_5a","year":"2025","examName":"VCE Biology","number":"5a","topic":"Immune Response","type":"short","text":"State two roles of neutrophils in an immune response to N. meningitidis.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Roles of neutrophils in an immune response to Neisseria meningitidis could have included:\nmigration to the site of infection\nrelease of cytokines to attract other immune cells\nphagocytosis of bacterium\nrelease of toxins/defensins that are toxic to bacterium.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":31},{"id":"vcabio2025_5b","year":"2025","examName":"VCE Biology","number":"5b","topic":"Immune Response","type":"extended","text":"Contrast how the adaptive immune system responds to an extracellular pathogen, like N. meningitidis, and an intracellular pathogen, like the influenza virus.","marks":4,"options":[],"correctAnswer":null,"examinerReport":"Contrasts between how the adaptive immune system response to an extracellular pathogen, like N. meningitidis, and an intracellular pathogen, like the influenza virus, could have included:\nthe type of immunity involved in each response differs: humoral immunity is involved in a response to an extracellular pathogen, whereas cell-mediated immunity is involved in a response to an intracellular pathogen\nthe type of cells involved in each response differs: plasma B cells respond to extracellular pathogens, while cytotoxic T cells respond to intracellular pathogens\nthe molecules and mechanisms involved in targeting each type of pathogen are different: antibodies agglutinate/neutralise/opsonise extracellular pathogens, whilst cytotoxic granules (perforin/protease) induce death of cells infected by intracellular pathogens\nthe type of memory cells involved in each response is different: B memory cells are produced in response to extracellular pathogens, whereas T memory cells are produced in response to intracellular pathogens.\nExample of a high-scoring student response:\nImmune system utilises the humoral response to respond to extracellular pathogens whereas the cell-mediated response responds to intracellular pathogens.\nHumoral response results in the production of plasma cells to produce antibodies whereas the cell-mediated response produces cytotoxic T cells.\nAntibodies make it easier for the immune system to recognise and destroy pathogens via opsonisation whereas cytotoxic T cells induce apoptosis in virally infected cells.\nCell-mediated response produces T memory cells whereas humoral response produces B memory cells.\nIt was evident that many students did not understand how the adaptive immune response differed towards extracellular versus intracellular pathogens. Some students confused extracellular pathogens with pathogens that had not yet entered the body and incorrectly made contrasts between first, second and third lines of defence.\nSome students included similarities between the two responses. Students need to be familiar with the various command terms that appear in VCE Biology examinations; ‘contrast’ requires a student to outline differences, not similarities. Refer to the VCAA Glossary of command terms for more detail.\nWhere available, students are advised to write in the empty space underneath a question, such as the space on p. 31 of the exam booklet below the prescribed lines, rather than continuing their answer on the ‘Extra space for responses’ pages at the back of the exam paper. This extra space at the back of the exam booklet should only be used where there is insufficient space to finish a response directly under the question.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":31},{"id":"vcabio2025_6a","year":"2025","examName":"VCE Biology","number":"6a","topic":"Immune Response","type":"short","text":"Identify the type of immunity given to the babies of mothers who have had this vaccination. Justify your response.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"The correct answer was natural passive immunity:\npassive because babies receive antibodies OR do not produce their own antibodies and/or memory cells\nnatural because these antibodies are provided from the mother (through the placenta/breastmilk) OR the baby obtained the antibodies through no further medical intervention.\nStudents must ensure they understand that active and passive are different strategies and contradict each other. Likewise for natural and artificial/induced immunity.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":32},{"id":"vcabio2025_6b","year":"2025","examName":"VCE Biology","number":"6b","topic":"General Biology","type":"short","text":"Suggest one reason why pregnant women would be advised to receive a booster vaccine for RSV if they become pregnant again.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Reasons why a booster vaccine is advised if the mother became pregnant again could have included:\nantibodies and/or memory cells decline over time\nfaster and/or larger antibody and/or memory cell production is required\nto ensure the baby receives sufficient antibodies\nto protect the baby/mother from RSV.\nResponses often incorrectly discussed memory cells being passed down from mother to child, which is incorrect. Additionally, many students did not make reference to either the baby or the mother in their response, instead providing pre-planned, generic responses about booster vaccines.\nResponses referring to antigenic drift were not awarded marks, as this may change the RSV antigens, rendering the booster vaccine ineffective. A new vaccine would be required.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":32},{"id":"vcabio2025_6c","year":"2025","examName":"VCE Biology","number":"6c","topic":"Immune Response","type":"short","text":"Explain one economic benefit relevant to the vaccination of pregnant women.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"The economic benefit from the vaccination of pregnant women is that the relevant stakeholder either saves money (e.g. hospital, government, society) or makes money (e.g. pharmaceutical companies).\nExamples of explanations that could lead to economic benefit could have included:\nreduced hospitalisations or emergency care or paediatric treatment\ncheaper to vaccinate compared to treating preventable diseases\nlowered risk of RSV or other infections/illness\nreduced strain on government-funded healthcare programs or reduced burden on public health system\nincreased herd immunity preventing community spread of RSV\nreduced maternal sick leave or less carer/partner absences from workplaces\nimproved long-term child health or reduction in child health/education support later in life.\nGeneric responses such as ’children survived so they could contribute to the economy‘ were not accepted as a valid economic benefit. Many responses referred to saving costs by vaccinating two individuals with the one vaccine. Whilst this is true prior to birth, it was not awarded marks when the responses continued on to state that the child would then not require vaccination after being born, as this is biologically incorrect.\nFor this type of question, students are encouraged to apply their knowledge and skills of ethical understanding (see page 12 of the study design). Specifically, students should be able to apply the VCE Biology Units 1–4 key science skill regarding ‘… the influence of social, economic, legal and political factors relevant to the selected issue’, including how these factors may affect decision-making and consequences of these decisions.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":32},{"id":"vcabio2025_6d","year":"2025","examName":"VCE Biology","number":"6d","topic":"Immune Response","type":"short","text":"Nirsevimab is a monoclonal antibody that can be used to help prevent severe RSV infections. Injections containing these antibodies are given to infants born during high-risk RSV periods to unvaccinated mothers. Explain how monoclonal antibodies work to reduce the severity of RSV in these infants.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Explanations of how monoclonal antibodies work could have included:\nbinding to (RSV) antigen (not binding to pathogen/protein)\nagglutination of virus\nneutralisation of virus or prevention of virus spread\nopsonisation or attraction of phagocytes to RSV\nactivation of complement proteins\nactivation of natural killer or cytotoxic T cells (which could occur through bispecific monoclonal antibodies, mAbs)\ndelivery of drugs/treatment directly to pathogen-infected cells (conjugated mAbs)\nreduction of symptoms/number of RSV/number of infected cells.\nThis question was challenging for students as it required them to apply their knowledge of the use of mAbs to an immune response against a pathogen such as RSV, rather than demonstrate their understanding in the more familiar contexts of the use of mAbs in the treatment of cancer and autoimmune diseases. The question required students to recognise that mAbs can function like any other antibody. Therefore, two suitable actions of antibodies were required.\nThere were misconceptions by some students that antibodies kill pathogens or attach to antigens on pathogen-infected cells, whereas they actually attach to antigens of extracellular pathogens and trigger other responses to occur to eliminate the pathogen. Responses outlining how mAbs were produced were not awarded marks.\nExample of a high-scoring student response:\nMonoclonal antibodies have complementary variable regions to antigens on the RSV virus.\nThus they can bind to viruses and mark them for phagocytosis, or clump them together to immobilise the pathogen, enhancing the speed and strength of the immune response especially for infants without fully developed adaptive immune systems, thus reducing the severity of symptoms.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":32},{"id":"vcabio2025_6e","year":"2025","examName":"VCE Biology","number":"6e","topic":"Immune Response","type":"short","text":"Other than administering vaccination and nirsevimab, identify one way in which the spread of RSV could be reduced in the infants of unvaccinated mothers. Justify your response.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Aside from administering a vaccination (and the herd immunity that arises from this) or monoclonal antibody, ways to reduce the spread of RSV, with suitable justifications, could have included:\nIdentify one way to reduce spread in infants\nJustification\nwear masks (nurses, infants, mothers, visitors, doctors, etc.)\nmothers avoid large gatherings\nquarantine/isolate infected infants\nBlocks/reduces respiratory droplets.\nOR\nPrevents person-to-person transmission\ndisinfect surfaces\nwash hands with soap\nimprove hygiene practices\ndo not share equipment/rooms/beds\nStops virus being transferred from one surface to another.\nOR\nPrevents person-to-person transmission.\neducation (on how the virus is spread)\nSo doctors/nurses/mothers/visitors take precautions to prevent transmission.\nOR\nEncourages people to apply relevant strategy (e.g. from the ‘identify’ column, such as wearing masks and disinfecting surfaces).\nStudents needed to think carefully about their choice of strategy. For example, it would not be appropriate or ethical to isolate or quarantine the child from the mother. Some students identified an action and then justified this by simply stating ‘reduces the spread’ – such a response was simply restating the stem of the question instead of providing a justification and was not awarded a mark.\nStudents needed to use the context provided, remembering that information at the beginning of Question 6 still applies to part e.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":32},{"id":"vcabio2025_7a","year":"2025","examName":"VCE Biology","number":"7a","topic":"Evolution","type":"short","text":"Scientists believe the introduction of the Asian honey bee into Australia is an example of the founder effect. Referring to genetic changes, state what the founder effect is and why the scientists are correct.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"The founder effect:\noccurs when a small group of individuals establishes a new population with reduced genetic variation compared to the original population.\nThe scientists are correct because:\nonly a single colony of Asian honey bees were introduced to Australia\nonly the genetic material of the queen and the sperm she had stored from her native environment were introduced to the new colony.\nMany responses did not make reference to genetic change, as was required by the question. Some students wrote about a smaller/unrepresentative population being produced, without explaining how this occurred, or without linking it to a smaller gene pool or unrepresentative allele frequencies. Some responses incorrectly described the bottleneck effect instead of the founder effect.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":34},{"id":"vcabio2025_7b","year":"2025","examName":"VCE Biology","number":"7b","topic":"General Biology","type":"extended","text":"Compared to the initial colony, the bees in the new colonies showed an improved ability to gather food and organise their colonies. Scientists investigated their DNA and discovered 481 differences from the original colony of Asian honey bees that had been introduced into Australia. Identify the process responsible for these DNA differences and explain how this process contributed to the successful expansion of the colonies.","marks":3,"options":[],"correctAnswer":null,"examinerReport":"The process responsible for the DNA differences is mutations.\nExplanations of how this process contributed to the successful expansion of the colonies could have included:\nnew alleles arose, increasing genetic diversity\nindividual bees with alleles that resulted in traits which increased their chances of survival were selected for\nover time, this led to an increased proportion of individual bees with favourable alleles.\nExample of a high-scoring student response:\nMutations.\nMutations cause the formation of new alleles in the honeybee genome by altering the base sequence of DNA.\nSome of these alleles are highly beneficial, providing a selective advantage to individuals that have them, causing those with the alleles to have an increased likelihood of survival and reproduction, passing on favourable alleles to offspring, over generations producing entire colonies with the advantageous alleles which aids in successful expansion.\nMany responses did not directly answer the ‘identify the process responsible for these DNA differences’ part of the question. If they did, natural selection or genetic drift were common incorrect answers. These would change the frequency of alleles rather than actually producing the DNA differences that led to the new alleles.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":34},{"id":"vcabio2025_7c","year":"2025","examName":"VCE Biology","number":"7c","topic":"General Biology","type":"extended","text":"The introduction of the Asian honey bee has had serious ecological effects. The bees compete with native species for resources, take over important nesting sites and pose a threat to native honey bee colonies that are managed for agriculture. The introduction of the Asian honey bee could be an environmental selection pressure for the native bee population. Explain the potential genetic change in the native bee population.","marks":3,"options":[],"correctAnswer":null,"examinerReport":"Explanations of potential genetic change in the native bee population could have included:\nthe genetic diversity in the native bee population may decline as alleles may be lost\nthe native bee population may reduce in numbers, reducing its gene pool\nindividual native bees that cannot compete with the Asian honey bees are selected against and do not survive (or vice versa)\nthese native bees do not reproduce, so less advantageous alleles are not passed on and decrease in frequency.\nExample of a high-scoring student response:\nNative bees may see a reduction in genetic diversity as only those bees able to survive and compete with Asian bees (selection pressure) for food and colony space will be able to reproduce and pass on these traits.\nHence some alleles may see a decrease in frequency or be removed altogether as only advantageous traits increase in allele frequency with disadvantageous traits (worse food collection etc.) reduce in frequency or are erased from the gene pool altogether hence decreasing genetic diversity.\nResponses should avoid Lamarckian statements, such as suggesting the native bees adapted in order to survive competition from Asian honey bee species. Students should understand that genetic variants must be present for the species or population to survive threats from other species.\nStudents are encouraged to relate their answers to the context of the question, rather than simply regurgitating pre-planned responses.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":34},{"id":"vcabio2025_8a","year":"2025","examName":"VCE Biology","number":"8a","topic":"Scientific Investigation","type":"short","text":"Using information from the article, propose two reasons why tadpoles were chosen for this experiment.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Reasons why tadpoles were chosen for this experiment could have included:\ntadpoles are laid in large groups, making it easier to obtain a large sample size for the experiment\ntadpoles have transparent skin, meaning that light could easily pass through and be absorbed by the cyanobacteria\ntadpoles have gills and live in water, therefore they can absorb dissolved oxygen\ntadpoles are small animals, so they are easy/cheap to look after\ntadpoles have a fast growth/reproduction rate, therefore the time to collect results is short\nuse of tadpoles received ethical approval as they are less complex animals.\nLower-scoring responses simply listed information from the article, without proposing a connection between this information and why tadpoles were chosen for this experiment.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":36},{"id":"vcabio2025_8iii","year":"2025","examName":"VCE Biology","number":"8iii","topic":"General Biology","type":"short","text":"Describe the role of each of the molecules named in part b.i in the production of oxygen.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":36},{"id":"vcabio2025_8c","year":"2025","examName":"VCE Biology","number":"8c","topic":"General Biology","type":"short","text":"Explain why the tadpoles’ brain activity stopped when their neurons were exposed to a hypoxic environment for extended periods of time.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Explanations of why the tadpoles’ brain activity stopped could have included:\ntadpoles could not carry out aerobic respiration as oxygen is required as an input\ntadpoles carried out anaerobic respiration, which produces less ATP than aerobic respiration\ncells were unable to produce sufficient ATP/energy.\nMany students identified that the dark, hypoxic environment meant photosynthesis was not occurring and therefore oxygen was not being produced, however they were unable to connect this to aerobic/anaerobic respiration and how it would affect the tadpole’s brain activity. Some responses stated that low oxygen led to denaturation of enzymes or death of cells, however this was incorrect as brain activity was able to be restarted.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":36},{"id":"vcabio2025_8d","year":"2025","examName":"VCE Biology","number":"8d","topic":"General Biology","type":"short","text":"Referring to a biochemical pathway, explain one reason for the delay in the restart of the tadpoles’ brain activity.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Reasons for the delay in the restart of the tadpoles’ brain activity could have included:\nit takes time for oxygen to be produced\nit takes time for photosynthesis to occur\nit takes time for oxygen to be used\nIt takes time for aerobic/cellular respiration to occur\nit takes time for ATP to be produced\noxygen/ATP is required for brain activity.\nExample of a high-scoring student response:\nAfter cyanobacteria were exposed to light, time was taken for the photolysis of water to occur and oxygen (O2) levels to reach sufficient amounts for cellular respiration to occur (which is also time consuming and slow) in order to produce sufficient ATP for the brain to start functioning again.\nStudents needed to refer to a biochemical pathway in their response, connecting the pathway to the production of oxygen or ATP. Low-scoring responses simply identified a biochemical pathway or outlined steps in photosynthesis or cellular respiration without connecting it to the tadpoles’ brain activity.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":36},{"id":"vcabio2025_8e","year":"2025","examName":"VCE Biology","number":"8e","topic":"Cellular Respiration","type":"short","text":"The electron transport chain occurs within the mitochondria. Outline two events that occur along this chain.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Events that occur along the electron transport chain could have included:\ncoenzymes/NADH/FADH2 transfer/unload electrons/energy/hydrogen ions\nwater is formed\noxygen is used as an input\n26 or 28 ATP molecules are produced.\nAs outlined in the study design, students need to be familiar with the inputs and outputs of the various stages of cellular respiration, including ATP yield (details of biochemical pathway mechanisms are not required).","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":36},{"id":"vcabio2025_8f","year":"2025","examName":"VCE Biology","number":"8f","topic":"Scientific Investigation","type":"short","text":"Two students noted that this research had been approved by the researchers’ ethical standards committee: • Student X thought this experiment was ethical as it met the principle of beneficence. • Student Y thought this experiment was unethical as it did not meet the principle of non‑maleficence. State which student you agree with and justify your response using information from the article.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Justifications using information from the article to support agreement with Student X could have included:\nbeneficence relates to maximising benefits and reducing harm/risk\nbenefit is being maximised as the research could save human lives in future by increasing oxygen levels in medical emergencies\nharm is being minimised as while tadpole brain activity was stopped, it was restarted again.\nExample of a high-scoring student response:\nStudent X.\nBeneficence involves maximising positive outcomes (or ensuring if harm is inevitable, that it is outweighed).\nPositive outcomes such as the potential of increasing oxygen levels in humans during medical emergencies were maximised, saving lives, rendering it ethical in the long term despite minimal harm to tadpole.\nOR\nJustifications using information from the article to support agreement with Student Y could have included:\nnon-maleficence relates to avoiding harm OR ensuring harm is not disproportionate to benefits\nbenefits are disproportionate as the potential positive outcome of improving treatment for humans during medical emergencies does not outweigh the harm being caused to the tadpoles\nharm is not being minimised as tadpoles are being harmed by having cyanobacteria injected into their hearts.\nExample of a high-scoring student response:\nI agree with student Y. Treating tadpoles as test subjects and intentionally placing them in hypoxic conditions may cause stress and pain. This violates non-maleficence (the minimisation of preventable harm) as the tadpoles are intentionally placed in distress from hypoxic conditions.\nSome responses included justifications that did not match the student (X or Y) they were agreeing with. Students need to be able to demonstrate and apply ethical understanding using the ethical concepts outlined on pages 15 and 16 of the study design.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":36},{"id":"vcabio2025_9a","year":"2025","examName":"VCE Biology","number":"9a","topic":"General Biology","type":"short","text":"Scientists studied the different woodpecker finch populations using molecular homology. Use one example to describe how molecular homology can be interpreted to determine the relatedness between the populations.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Examples of molecular homology comparisons could have included:\nnucleic acid (nucleotides, DNA, RNA) sequences\namino acid sequences.\nA description of how molecular homology can be interpreted could be:\nthe more similar these sequences are between two populations or the less time for mutations to occur between them, the more closely related they are (or vice versa).\nAs this question was about different populations of woodpecker finches rather than different species, students should be careful about using standard responses that discuss how molecular homology can be used to compare species, as opposed to populations.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":39},{"id":"vcabio2025_9b","year":"2025","examName":"VCE Biology","number":"9b","topic":"Evolution","type":"extended","text":"Scientists concluded that the woodpecker finch populations on San Cristobal island may be considered to be a different species from the woodpecker finch populations on the three other islands shown on the map above. Referring to the map, explain the type of speciation that has occurred.","marks":3,"options":[],"correctAnswer":null,"examinerReport":"The type of speciation could have included:\nallopatric\ngeographic isolation\nfinches on San Cristobal may not be able to fly the distance to other islands.\nExplanations of how speciation occurred could have included:\nno gene flow/interbreeding between populations\ndifferent mutations accumulating in each population\neach population experiencing different selection pressures and certain individuals having a selective advantage.\nStudents did not need to use the term ‘allopatric speciation’ in their response; instead they could indicate their understanding of the type of speciation by referring to the population as geographically isolated. As students were required to explain the type of speciation that occurred, they needed to state more than just ‘different selection pressures were acting’. Making reference to a survival/selective/reproductive advantage or individuals containing certain alleles/phenotypes/traits conferring an advantage was important.\nThis was not sympatric speciation as there was no evidence of different mating times of the finches or other temporal isolations. and the woodpecker finches on San Cristobal island were not living in the same location as the other woodpecker finch populations.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":39},{"id":"vcabio2025_10a","year":"2025","examName":"VCE Biology","number":"10a","topic":"Genetics & Inheritance","type":"short","text":"Describe the evidence that would support each conclusion. Conclusion 1 Conclusion 2 Use the following information to answer part b below and part c on page 41. One species of hominins, Homo neanderthalensis, lived in Europe and west Asia for hundreds of thousands of years before disappearing about 40 000 years ago. Modern-day non-African Homo sapiens have inherited 1–2% of their DNA from H. neanderthalensis. Evidence for interbreeding between H. sapiens and H. neanderthalensis has been obtained from two recent studies and is summarised in the table below. Each study analysed the genomes belonging to H. sapiens individuals of different ages. Number of genomes studied Individuals studied and age Conclusion made Study 1 7 7 ancient individuals dated at approximately 45 000 years ago interbreeding occurred between 49 000 to 45 000 years ago Study 2 334 275 present-day individuals and 59 ancient individuals dated from 45 000 to 2200 years ago interbreeding occurred between 50 500 to 43 500 years ago","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Evidence that would support Conclusion 1 needed to relate to a feature of the footprints that would demonstrate bipedalism. This could have included:\nnon-opposable big toe\narched foot\nmore pronounced heel bone.\nEvidence that would support Conclusion 2 needed to relate to a feature that differs between different bipedal footprints. This could have included:\nangle of the big toe compared to other toes is different\ndifferent size of arch in foot\ndifferent distribution of weight from heel to toe.\nFor Conclusion 2, students needed to identify a structural difference between the footprints rather than simply stating that the footprints would be different or that they would be different sizes, as this could indicate the footprints were from the same species but of different ages (child/adult size) rather than from different species.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":40},{"id":"vcabio2025_10b","year":"2025","examName":"VCE Biology","number":"10b","topic":"Scientific Investigation","type":"short","text":"Give one reason for the difference in the conclusion made in each study. Justify your response using information from the table above. End of examination questions","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Reasons for the difference in the interbreeding conclusions made, with a suitable justification using information from the table, could have included:\nthere were different numbers of genomes studied, as Study 1 involved 7 genomes while Study 2 involved 334 genomes\nthe individuals studied were from different time periods, as Study 1 involved individuals dated 45 000 years ago while Study 2 involved individuals dated from both 45 000 to 2200 years ago and from present day\nthe two studies had different levels of accuracy, as Study 2 had a larger sample size than Study 1 and/or Study 2 involved both ancient and present-day individuals whereas Study 1 only involved ancient individuals\nresearchers can interpret data differently as demonstrated by the different ranges of interbreeding found in the two conclusions, with Study 1 concluding that the range of interbreeding was from 49 000 years ago to 45 000 years ago while Study 2 concluded that the range of interbreeding was from 50 500 years ago to 43 500 years ago.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":40},{"id":"vcabio2025_10c","year":"2025","examName":"VCE Biology","number":"10c","topic":"General Biology","type":"short","text":"Study 2 also compared the percentage of Neanderthal DNA in the 59 ancient human individuals to the 275 present-day individuals. The diagram below summarises the findings. > 40 000 years ago > 20 000 years ago present day 59 ancient humans 275 diverse present-day individuals time Key Neanderthal DNA genomes of ancient and present-day humans’, Science, vol. 386, issue 6727, 13 December 2024 Account for the change in the percentage of Neanderthal DNA found in ancient human individuals compared to present-day individuals.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Explanations for the change in the percentage of Neanderthal DNA found in ancient human individuals compared to present-day individuals could have included:\nthere has been a decrease in the percentage of Neanderthal DNA in the genomes of present-day humans\nmore time has passed since Homo sapiens and Homo neanderthalensis shared a common ancestor OR more time for mutations to accumulate in the DNA of present-day individuals compared to ancient humans\nin present-day individuals there has been more time for interbreeding between H. sapiens OR between H. sapiens and other species of the genus Homo\nH. sapiens and H. neanderthalensis can no longer interbreed as H. neanderthalensis is extinct\npresent-day individuals may not be descended from ancestors with high levels of Neanderthal DNA\nover time, different selection pressures have favoured different alleles, resulting in alleles that were prominent in ancient humans being lost.\nWhen discussing interbreeding, students needed to provide specific details, such as which species were interbreeding, when they were interbreeding or to what extent they were likely to interbreed.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":40},{"id":"vcabio2025_10d","year":"2025","examName":"VCE Biology","number":"10d","topic":"Evolution","type":"short","text":"Fossils have been used to indicate where and at what time certain hominin species lived in the world. mtDNA has been used to provide evidence of how hominin species may have migrated across the world. Outline two benefits of using mtDNA to help determine pathways hominin species may have taken. Extra space for responses Clearly number all responses in this space. 2025 VCE Biology If you use any additional Question and Answer Books to complete your responses, write your student number on the front cover. At the end of the examination, place the additional Question and Answer Books inside the front cover of the first Question and Answer Book. 2025 VCE Biology © Victorian Curriculum and Assessment Authority 2025","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Benefits of using mtDNA to help determine the pathways hominin species may have taken could have included:\nmtDNA is passed down the maternal line or mtDNA is not subject to recombination\nmtDNA has a known/high mutation rate\nmtDNA’s only source of variation is mutation\nmtDNA is more abundant or has a higher copy number than nuclear DNA.\nResponses that described how mtDNA can determine migratory pathways rather than outlining the benefits of using mtDNA were not awarded marks.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":40}];

<script>
// ── STATE ──
const STORE_KEY = 'ep_' + (location.search.replace('?','') || 'default');
let S = { subject:'', questions:[], sessions:[], settings:{apiKey:'',accent:'#f5a623',dark:null} };
// In-memory PDF store per year: { '2022': 'base64...', ... } — not persisted to localStorage
const _examPdfs = {};
// PDF pages for the current session's year (rendered once, reused across questions)
let _sessPdfPages = null;
let _sessPdfYear = null;
// Page cache: { '2022_5': 'data:image/png;base64,...' }
const _pageCache = {};
let curView = 'dashboard';

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({...S, questions: S.questions.map(q=>({...q,images:[],reportImages:[]}))})); } catch(e){} }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); S = {...S,...d}; }
  } catch(e){}
}
function uid() { return Math.random().toString(36).slice(2)+Date.now().toString(36); }

function finishSetup() {
  const subj = document.getElementById('setup-subj').value.trim();
  const key = document.getElementById('setup-key').value.trim();
  if (!subj) { toast('❌ Enter a subject name'); return; }
  S.subject = subj;
  S.settings.apiKey = key;
  save();
  document.getElementById('setup').classList.add('hidden');
  bootApp();
}

function hideLoader() {
  const l = document.getElementById('page-loader');
  if (l) l.style.display = 'none';
}

function bootApp() {
  // Merge pre-loaded VCE Biology questions if not already present
  if (typeof VCE_BIO_PRELOAD !== 'undefined') {
    const existingIds = new Set(S.questions.map(q=>q.id));
    const toAdd = VCE_BIO_PRELOAD.filter(q=>!existingIds.has(q.id));
    if (toAdd.length) {
      S.questions.push(...toAdd);
      save();
    }
  }
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('sb-subject-lbl').textContent = S.subject.toUpperCase();
  document.getElementById('sb-title-lbl').textContent = 'Exam Practice';
  document.title = S.subject + ' — Exam Practice';
  if (S.settings.dark === true) document.documentElement.setAttribute('data-theme','dark');
  if (S.settings.dark === false) document.documentElement.setAttribute('data-theme','light');
  hideLoader();
  nav('dashboard');
}

// ── NAVIGATION ──
function nav(view) {
  curView = view;
  document.querySelectorAll('.sb-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  const titles = {dashboard:'Dashboard', bank:'Question Bank', upload:'Upload Exam', practice:'Practice', history:'History'};
  document.getElementById('topbar-title').textContent = titles[view] || view;
  document.getElementById('topbar-actions').innerHTML = '';
  const fn = {dashboard:renderDashboard, bank:renderBank, upload:renderUpload, practice:renderPractice, history:renderHistory}[view];
  if (fn) fn();
}

// ── TOAST ──
let _toastTimer;
function toast(msg, dur=2800) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove('show'), dur);
}

function qTypeTag(type) {
  const labels = {mcq:'MCQ', short:'Short Answer', extended:'Extended Response'};
  return `<span class="tag ${type}">${labels[type]||type}</span>`;
}
function topics() {
  return [...new Set(S.questions.map(q=>q.topic).filter(Boolean))].sort();
}
function years() {
  return [...new Set(S.questions.map(q=>q.year).filter(Boolean))].sort((a,b)=>b-a);
}
function markValues() {
  return [...new Set(S.questions.map(q=>q.marks).filter(Boolean))].sort((a,b)=>a-b);
}

function renderDashboard() {
  const pc = document.getElementById('page-content');

  const shortAll = qs.filter(q=>q.type!=='mcq');

  done.forEach(s=>{

  });

  pc.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val">${qs.length}</div><div class="stat-lbl">Questions</div></div>

      <div style="font-weight:800;font-size:.92rem;margin-bottom:14px;letter-spacing:-.01em">Quick Practice</div>

        ${modeCard('🔵','MCQ Quiz','Random multiple-choice questions','mcq-quiz')}
        ${modeCard('📄','Mock Exam','Full exam paper by year','mock-exam')}
        ${modeCard('✏️','Short Answer','Extended response questions','short-string')}
        ${modeCard('⭐','Skills Trainer','Practice by marks allocated','skills')}
      </div>
    </div>

    ${done.length ? `<div class="card" style="margin-top:14px">
      <div style="font-weight:800;font-size:.92rem;margin-bottom:14px;letter-spacing:-.01em">Recent Sessions</div>
      ${done.slice(-5).reverse().map(s=>{
        const qc = s.qIds?.length||0;
        const ac = Object.keys(s.answers||{}).length;

function renderBankList() {

  let qs = S.questions.filter(q=>{
    if (bankFilters.type && q.type !== bankFilters.type) return false;
    if (bankFilters.topic && q.topic !== bankFilters.topic) return false;
    if (bankFilters.year && q.year != bankFilters.year) return false;
    if (bankFilters.marks && q.marks != bankFilters.marks) return false;
    if (search && !q.text?.toLowerCase().includes(search) && !q.topic?.toLowerCase().includes(search)) return false;
    return true;

  const el = document.getElementById('bank-list');
  if (!el) return;

async function handleUpFiles(rawFiles, key) {
  const files = [...rawFiles];
  for (const f of files) {
    const isDocx = f.name.endsWith('.docx');
    const data = await new Promise(res=>{
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      if (isDocx) r.readAsArrayBuffer(f); else r.readAsDataURL(f);
    });
    _uploadFiles[key].push({name:f.name, type: isDocx?'application/docx':f.type, data, size:f.size});
  }
  const listEl = document.getElementById(`fi-${key}-list`);
  if (listEl) listEl.textContent = _uploadFiles[key].map(f=>'📎 '+f.name).join(' · ');
}

async function pdfPageImages(base64, scale=1.5) {
  if (typeof pdfjsLib==='undefined') return [];
  const bytes = Uint8Array.from(atob(base64), c=>c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({data:bytes}).promise;
  const imgs = [];
  for (let p=1;p<=pdf.numPages;p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    imgs.push(canvas.toDataURL('image/png'));
  }
  return imgs;
}

async function fileToBlocks(files) {
  const blocks = []; let hasPdf=false;
  for (const f of files) {
    const base64 = typeof f.data==='string' ? f.data.split(',')[1]||f.data : '';
    if (f.type==='application/docx') {
      try {
        const zip = await JSZip.loadAsync(f.data);
        const xml = await zip.file('word/document.xml').async('string');
        const text = xml.replace(/<w:p[ >][^>]*>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
        blocks.push({type:'text',text:`[DOCX: ${f.name}]\n${text.slice(0,20000)}`});
      } catch{}
    } else if (f.type==='application/pdf') {
      const imgs = await pdfPageImages(base64);
      for (const img of imgs) {
        const b64 = img.split(',')[1];
        blocks.push({type:'image',source:{type:'base64',media_type:'image/png',data:b64}});
      }
      hasPdf=true;
    } else if (f.type.startsWith('image/')) {
      blocks.push({type:'image',source:{type:'base64',media_type:f.type,data:base64}});
    }
  }
  return {blocks,hasPdf};
}

async function callAI(system, messages, extraHeaders={}) {
