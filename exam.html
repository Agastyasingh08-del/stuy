}

// Parse VCE examiner report DOCX text — handles 2022–2025 format variations
function parseVCEReport(docxText) {
  const reportData = {};
  const lines = docxText.split('\n').map(l => l.trim());

  // ── Section A ──
  // Find the header row: look for "Question" then "Correct answer" pattern
  let tableStart = -1;
  for (let i = 0; i < lines.length - 5; i++) {
    if (lines[i] === 'Question' && lines[i+1] === 'Correct answer' && lines[i+2].startsWith('% A')) {
      tableStart = i + 7; // skip 7 header rows: Q, Correct, %A, %B, %C, %D, Comments
      break;
    }
  }

  // Also try alternate header with no separate Comments column
  if (tableStart === -1) {
    for (let i = 0; i < lines.length - 3; i++) {
      if (lines[i] === 'Question' && (lines[i+1] === 'Correct answer' || lines[i+1] === 'Correct Answer')) {
        tableStart = i + 5; break;
      }
    }
  }

  if (tableStart > -1) {
    let i = tableStart;
    // Find where Section B questions start
    const secBStart = lines.findIndex((l,idx) => idx > tableStart && /^Question \d/.test(l));
    const tableEnd = secBStart > -1 ? secBStart : lines.length;

    while (i < tableEnd) {
      const num = parseInt(lines[i]);
      if (!isNaN(num) && num >= 1 && num <= 40 && /^\d+$/.test(lines[i])) {
        const correct = lines[i+1];
        const pA = parseFloat(lines[i+2]);
        const pB = parseFloat(lines[i+3]);
        const pC = parseFloat(lines[i+4]);
        const pD = parseFloat(lines[i+5]);
        i += 6;
        // Accumulate comment lines until next question number
        const commentLines = [];
        while (i < tableEnd) {
          const peek = lines[i];
          const peekNum = parseInt(peek);
          if (!isNaN(peekNum) && /^\d+$/.test(peek) && peekNum > num && peekNum <= 40) break;
          if (['A','B','C','D'].includes(peek)) break; // next row's correct answer
          if (peek) commentLines.push(peek);
          i++;
        }
        if (['A','B','C','D'].includes(correct) && !isNaN(pA)) {
          reportData[String(num)] = {
            correctAnswer: correct,
            reportStats: {A: pA, B: pB, C: pC, D: pD},
            examinerReport: commentLines.join(' ').trim()
          };
        }
      } else { i++; }
    }
  }

  // ── Section B ──
  // Split on "Question N..." blocks — handles "1a.", "1a.i", "2b.ii" etc.
  // Normalise: remove all dots, spaces → "1a", "1ai", "2bii"
  const normNum = n => n.replace(/[\s.]/g, '');

  // Find all Section B question positions
  const qRegex = /^Question (\d+[a-z]*(?:\.[ivx]+)?\.?)\s*$/i;
  const qPositions = [];
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(qRegex);
    if (m) qPositions.push({line: i, rawNum: m[1]});
  }

  for (let qi = 0; qi < qPositions.length; qi++) {
    const {line: start, rawNum} = qPositions[qi];
    const end = qi + 1 < qPositions.length ? qPositions[qi+1].line : lines.length;
    const block = lines.slice(start, end);

    // Find max mark from distribution table
    const markIdx = block.findIndex(l => l === 'Mark');
    const avgIdx = block.findIndex(l => l === 'Average');
    let maxMarks = 1;
    if (markIdx > -1 && avgIdx > markIdx) {
      const markNums = block.slice(markIdx+1, avgIdx).map(Number).filter(n => !isNaN(n) && n > 0);
      if (markNums.length) maxMarks = Math.max(...markNums);
    }

    // Sample answer: after the % distribution numbers
    const pctIdx = block.findIndex(l => l === '%');
    let sampleAnswer = '';
    if (pctIdx > -1) {
      // Skip number/decimal lines after %
      let textStart = pctIdx + 1;
      while (textStart < block.length && /^[\d.]+$/.test(block[textStart])) textStart++;
      sampleAnswer = block.slice(textStart).join('\n').trim();
    }

    const key = normNum(rawNum);
    reportData[key] = {examinerReport: sampleAnswer, marks: maxMarks};
  }

  return reportData;
}

async function runExtraction() {
  const year = document.getElementById('up-year').value.trim();
  const examName = document.getElementById('up-name').value.trim();
  if (!_uploadFiles.paper.length) { toast('❌ Upload the exam paper first'); return; }
  if (!S.settings.apiKey) { toast('❌ Add an API key in Settings'); return; }

  openModal(`<div class="modal-title">✨ Extracting Questions…</div>
    <div style="text-align:center;padding:30px">
      <div class="spin" style="font-size:2rem">⚙️</div>
      <p id="ext-status" style="color:var(--muted);margin-top:14px;font-size:.88rem">Rendering document pages…</p>
    </div>`);
  const setStatus = t => { const el=document.getElementById('ext-status'); if(el) el.textContent=t; };

  try {
    // ── Step 1: Extract report data (DOCX is structured — parse it directly) ──
    let reportData = {};
    let reportDocxText = '';
    for (const f of _uploadFiles.report) {
      if (f.type === 'application/docx') {
        setStatus('Parsing examiner report…');
        try {
          const zip = await JSZip.loadAsync(f.data);
          const xml = await zip.file('word/document.xml').async('string');
          reportDocxText = xml.replace(/<w:p[ >][^>]*>/g,'\n').replace(/<[^>]+>/g,'')
            .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\r/g,'')
            .replace(/\n{3,}/g,'\n\n').trim();
          reportData = parseVCEReport(reportDocxText);
        } catch(e) { console.warn('DOCX parse error', e); }
      }
    }
    // If report is PDF/image, fall back to AI extraction
    const hasDocxReport = Object.keys(reportData).length > 0;
    if (!hasDocxReport && _uploadFiles.report.length) {
      setStatus('Extracting report with AI (non-DOCX format)…');
      const {blocks: rBlocks} = await fileToBlocks(_uploadFiles.report);
      if (rBlocks.length) {
        const rRaw = await callAI(
          'Extract VCE examiner report data. Return ONLY valid JSON, no markdown.',
          [{role:'user',content:[...rBlocks,{type:'text',text:`Extract data for every question from this VCE ${S.subject} examiner report.
Section A: for each MCQ question 1-40 extract correct answer letter and % for A,B,C,D.
Section B: for each question (e.g. "1a", "2b", "3ai") extract the sample answer / examiner commentary and max marks awarded.
Return ONLY: {"report":{"1":{"correctAnswer":"B","reportStats":{"A":15,"B":60,"C":20,"D":5},"examinerReport":"comment"},"1a":{"examinerReport":"sample answer...","marks":3}}}`}]}]);
        try { reportData = JSON.parse(rRaw.replace(/```json|```/g,'')).report||{}; } catch{}
      }
    }

    // ── Step 2: Extract questions from exam paper (PDF rendered as images) ──
    setStatus('Rendering exam paper pages…');
    const {blocks: paperBlocks} = await fileToBlocks(_uploadFiles.paper);

    setStatus(`Extracting questions from ${_uploadFiles.paper.length} file(s)…`);

    // Use larger context model for question extraction since papers can be long
    const qSystem = `You are extracting questions from a VCE ${S.subject} exam paper. This is a Victorian Certificate of Education exam. Return ONLY valid JSON, no markdown fences.`;
    const qPrompt = `Extract EVERY question from this VCE ${S.subject} exam paper.

SECTION A — Multiple Choice (Questions 1–40, each 1 mark):
- number: "1", "2", … "40" (plain integer as string)
- type: "mcq"
- marks: 1
- Include ALL 4 options A, B, C, D with their full text

SECTION B — Short/Extended Answer:
Questions have sub-parts like "a.", "b.", "c." and further sub-sub-parts "i.", "ii.", "iii."
- number: remove all dots and spaces → "1a", "1b", "2ai", "2aii", "3bii", "5aii" etc.
- type: "short" if 1–2 marks, "extended" if 3+ marks
- marks: number shown in brackets next to the question, e.g. (3 marks) → 3

Topic categories for VCE Biology: "DNA & Gene Expression", "Protein Synthesis", "Biotechnology", "Cellular Respiration", "Photosynthesis", "Immune Response", "Pathogens & Disease", "Evolution", "Heredity & Genetics", "Cell Biology", "Scientific Investigation"

Return ONLY valid JSON (no markdown fences):
{"questions":[
  {"number":"1","type":"mcq","text":"Full question stem text including any scenario/stimulus text before the options","marks":1,"topic":"Topic name","options":[{"label":"A","text":"option text"},{"label":"B","text":"..."},{"label":"C","text":"..."},{"label":"D","text":"..."}]},
  {"number":"1a","type":"short","text":"Full question text for part a","marks":1,"topic":"Topic name"},
  {"number":"1b","type":"extended","text":"Full question text for part b","marks":4,"topic":"Topic name"}
]}`;

    const qMsg = [{role:'user',content:[...paperBlocks,{type:'text',text:qPrompt}]}];
    // Use sonnet for better extraction quality on long exam papers
    const qRes = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:8192,system:qSystem,messages:qMsg})
    });
    const qData = await qRes.json();
    if (qData.error) throw new Error(qData.error.message);
    let extracted = [];
    try { extracted = JSON.parse(qData.content[0].text.replace(/```json|```/g,'')).questions||[]; }
    catch { throw new Error('AI returned invalid JSON. Try again.'); }

    // ── Step 3: Merge questions with report data ──
    const newQs = extracted.map(q => {
      // Try exact match first, then fuzzy (e.g. "1a" vs "1a.")
      const rep = reportData[q.number]
        || reportData[q.number.replace(/\./g,'')]
        || reportData[q.number+'a']
        || {};
      return {
        id: uid(),
        year: year || null,
        examName: examName || null,
        number: q.number,
        topic: q.topic || '',
        type: q.type || 'short',
        text: q.text || '',
        marks: rep.marks || q.marks || 1,
        options: q.options || [],
        correctAnswer: rep.correctAnswer || null,
        examinerReport: rep.examinerReport || '',
        reportStats: rep.reportStats || {},
        images: [], reportImages: []
      };
    });

    const matched = newQs.filter(q=>q.examinerReport||q.correctAnswer).length;
    closeModal();
    setTimeout(()=>reviewExtractedModal(newQs, year, examName, matched), 50);
  } catch(e) {
    closeModal();
    setTimeout(()=>openModal(`<div class="modal-title">❌ Extraction Failed</div><p style="color:var(--muted);margin-bottom:8px">${e.message}</p><div class="mactions"><button class="btn btn-primary" onclick="closeModal()">OK</button></div>`),50);
  }
}

function launchSession(mode) {
  const topic = document.getElementById('pm-topic')?.value||'';
  const year  = document.getElementById('pm-year')?.value||'';
  const marks = document.getElementById('pm-marks')?.value||'';
  const countEl = document.getElementById('pm-count');
  const count = countEl ? (+countEl.value||0) : 0;

  let pool = S.questions.filter(q=>{
    if (mode==='mcq-quiz' && q.type!=='mcq') return false;
    if (mode==='short-string' && q.type==='mcq') return false;
    if (mode==='skills' && marks && q.marks!=marks) return false;
    if (topic && q.topic!==topic) return false;
    if (year && q.year!=year) return false;
    return true;
  });

  if (!pool.length) { toast('❌ No questions match those filters'); return; }

  if (mode === 'mock-exam') {
    // Sort by question number in exam order: MCQ 1-40 first, then section B by number string
    pool = pool.sort((a, b) => {
      const aIsNum = /^\d+$/.test(a.number);
      const bIsNum = /^\d+$/.test(b.number);
      if (aIsNum && bIsNum) return +a.number - +b.number;
      if (aIsNum) return -1;
      if (bIsNum) return 1;
      return a.number.localeCompare(b.number, undefined, {numeric: true});
    });
  } else {
    pool = pool.sort(()=>Math.random()-.5);
    if (count && count < pool.length) pool = pool.slice(0, count);
  }

  const session = {
    id:uid(), mode,
    filters:{topic, year, marks: marks?+marks:null},
    qIds: pool.map(q=>q.id),
    answers:{},
    startedAt: Date.now(),
    completedAt: null
  };
  S.sessions.push(session);
  save();
  closeModal();
  runSession(session, pool);
}

let _sess = null, _sessPool = [], _sessIdx = 0;

// ── IndexedDB PDF cache keyed by "${STORE_KEY}-${year}" ──
const _pdfCache = {};   // in-memory: year → rendered page array
const _pdfPanelOpen = {v: true};

function _idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('exam_pdfs', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('pdfs');
    req.onsuccess = e => res(e.target.result);
    req.onerror = () => rej(req.error);
  });
}
async function _idbGet(key) {
  try { const db = await _idbOpen(); return new Promise(res => { const t = db.transaction('pdfs','readonly'); t.objectStore('pdfs').get(key).onsuccess = e => res(e.target.result); }); } catch { return null; }
}
async function _idbSet(key, val) {
  try { const db = await _idbOpen(); return new Promise(res => { const t = db.transaction('pdfs','readwrite'); t.objectStore('pdfs').put(val, key).onsuccess = () => res(); }); } catch {}
}
async function _idbDel(key) {
  try { const db = await _idbOpen(); return new Promise(res => { const t = db.transaction('pdfs','readwrite'); t.objectStore('pdfs').delete(key).onsuccess = () => res(); }); } catch {}
}
async function _idbKeys() {
  try { const db = await _idbOpen(); return new Promise(res => { const t = db.transaction('pdfs','readonly'); t.objectStore('pdfs').getAllKeys().onsuccess = e => res(e.target.result||[]); }); } catch { return []; }
}

function _pdfKey(year) { return STORE_KEY + '-' + year; }

async function getPdfForYear(year) {
  if (_pdfCache[year]) return _pdfCache[year];
  const stored = await _idbGet(_pdfKey(year));
  if (stored) { _pdfCache[year] = stored; return stored; }
  return null;
}

function runSession(session, pool) {
  _sess = session; _sessPool = pool; _sessIdx = 0;
  document.getElementById('session-overlay').classList.remove('hidden');
  showSessionQ();
}

async function showSessionQ() {

      </button>
    </div>
    <div class="sess-main">
      <div class="sess-body" id="sess-body">
        ${renderQView(q, isDone)}
      </div>
      <div class="sess-pdf-panel ${panelVisible ? '' : 'hidden'}" id="sess-pdf-panel"
        ondragover="event.preventDefault();document.getElementById('pdf-drop-zone')?.classList.add('drag')"
        ondragleave="document.getElementById('pdf-drop-zone')?.classList.remove('drag')"

        <div class="pdf-panel-head" style="gap:6px;flex-wrap:wrap">
          <span style="font-weight:700">📄 ${q.year || ''} Exam</span>
          ${pdfLoaded ? `<span style="font-size:.72rem;color:var(--muted)">${_sessPdfPages.length} pages cached ✓</span>` : ''}
          <button class="btn btn-ghost btn-sm" onclick="attachSessionPdf(${q.year})" title="Load & save PDF for ${q.year}" style="font-size:.75rem">
            ${pdfLoaded ? '🔄 Replace' : '+ Load PDF for '+q.year}
          </button>
          ${cachedYears.filter(y=>y!=q.year).map(y=>`<button class="btn btn-ghost btn-sm" onclick="switchPdfYear(${y})" style="font-size:.72rem">📄 ${y}</button>`).join('')}

            : `<div id="pdf-drop-zone" onclick="attachSessionPdf(${q.year})"
                ondragover="event.preventDefault();this.classList.add('drag')"
                ondragleave="this.classList.remove('drag')"
                ondrop="event.preventDefault();this.classList.remove('drag');handlePdfDrop(event.dataTransfer.files[0])"
                style="margin:16px;border:2px dashed var(--border);border-radius:12px;padding:36px 20px;text-align:center;cursor:pointer;transition:.15s"

                onmouseout="this.style.borderColor='var(--border)';this.style.background='transparent'">

          }
        </div>

    </div>`;
}

function togglePdfPanel() {
  _pdfPanelOpen.v = !_pdfPanelOpen.v;
  const panel = document.getElementById('sess-pdf-panel');
  const btn = document.getElementById('pdf-toggle-btn');
  if (panel) panel.classList.toggle('hidden', !_pdfPanelOpen.v);
  if (btn) btn.textContent = _pdfPanelOpen.v ? '📄 Hide PDF' : '📄 Show PDF';
}

function switchPdfYear(year) {
  if (_pdfCache[year]) {
    _sessPdfPages = _pdfCache[year];
    _sessPdfYear = year;
    showSessionQ();

}

async function loadPdfFile(file, year) {
  if (!file || file.type !== 'application/pdf') { toast('❌ Drop a PDF file'); return; }
  const btn = document.getElementById('pdf-toggle-btn');
  const dz = document.getElementById('pdf-drop-zone');
  if (dz) dz.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:.84rem"><div class="spin" style="display:inline-block;font-size:1.4rem">⏳</div><div style="margin-top:8px">Rendering pages… (saved for future sessions)</div></div>';
  if (btn) { btn.textContent = '⏳ Loading…'; btn.disabled = true; }
  const targetYear = year || _sessPool[_sessIdx]?.year;
  const base64 = await new Promise(res => {
    const r = new FileReader(); r.onload = e => res(e.target.result.split(',')[1]); r.readAsDataURL(file);
  });
  const pages = await pdfPageImages(base64, 1.4);
  _pdfCache[targetYear] = pages;
  _sessPdfPages = pages;
  _sessPdfYear = targetYear;
  // Save to IndexedDB so it persists across sessions
  await _idbSet(_pdfKey(targetYear), pages);
  toast('✅ PDF saved for ' + targetYear + ' — won\'t need to reload');
  showSessionQ();
}

function handlePdfDrop(file) { loadPdfFile(file); }

function attachSessionPdf(year) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.pdf';
  inp.onchange = () => loadPdfFile(inp.files[0], year);
  inp.click();
}



// ── PDF YEAR ATTACHMENT + AI IMAGE EXTRACTION ──
// After attaching a PDF, Claude Vision identifies which page each image-referencing
// question's visual is on, crops it, and stores it directly in q.images (memory only).

async function pdfToImagesSmall(base64) {
  if (typeof pdfjsLib === 'undefined') return [];
  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
  const imgs = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({scale: 1.2});
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
    imgs.push({dataUrl: canvas.toDataURL('image/jpeg', 0.82), w: vp.width, h: vp.height});
  }
  return imgs;
}

function cropImageRegion(dataUrl, w, h, x, y, cw, ch) {
  const img = new Image();
  img.src = dataUrl;
  const canvas = document.createElement('canvas');
  const pw = Math.round(cw * w), ph = Math.round(ch * h);
  canvas.width = pw; canvas.height = ph;
  canvas.getContext('2d').drawImage(img, x*w, y*h, pw, ph, 0, 0, pw, ph);
  return canvas.toDataURL('image/jpeg', 0.9);
}

async function loadPdfForYear(year, qid) {
  // If images already extracted for this year, just refresh the slot
  const alreadyDone = S.questions.some(q => q.year == year && q.images?.some(Boolean));
  if (alreadyDone) { refreshImageSlot(qid); return; }

  if (!S.settings.apiKey) { toast('❌ Add API key in Settings to auto-extract images'); return; }

  // File picker
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.pdf';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const slot = document.getElementById('img-slot-'+qid);
    if (slot) slot.innerHTML = '<div style="color:var(--muted);font-size:.84rem;padding:12px;text-align:center"><div class="spin" style="font-size:1.2rem;display:inline-block">⏳</div> Rendering PDF pages…</div>';

    const base64 = await new Promise(res => {
      const r = new FileReader(); r.onload = e => res(e.target.result.split(',')[1]); r.readAsDataURL(f);
    });

    if (slot) slot.innerHTML = '<div style="color:var(--muted);font-size:.84rem;padding:12px;text-align:center"><div class="spin" style="font-size:1.2rem;display:inline-block">🔍</div> Analysing pages with AI…</div>';

    await extractImagesFromPdf(base64, year);
    refreshImageSlot(qid);
  };
  inp.click();
}

async function extractImagesFromPdf(base64, year) {
  const pages = await pdfToImagesSmall(base64);
  // Get all image-referencing question numbers for this year
  const imgQs = S.questions.filter(q => q.year == year && questionHasImage(q));
  if (!imgQs.length) { toast('No image questions found for '+year); return; }

  // Send pages in batches of 6 to Claude Vision
  const BATCH = 6;
  const pageAssignments = {}; // { qNumber: {page, x, y, w, h} }

  for (let i = 0; i < pages.length; i += BATCH) {
    const batch = pages.slice(i, i+BATCH);
    const imgBlocks = batch.map((pg, bi) => ({
      type: 'image',
      source: {type: 'base64', media_type: 'image/jpeg', data: pg.dataUrl.split(',')[1]}
    }));
    const qNums = imgQs.map(q => q.number).join(', ');
    const pageNums = batch.map((_, bi) => `Image ${bi+1} = page ${i+bi+1}`).join(', ');

    try {
      const resp = await callAI(
        'You are analysing VCE Biology exam PDF pages. Identify visual elements (diagrams, graphs, micrographs, images, tables) and which question number each belongs to. Return ONLY valid JSON.',
        [{role:'user', content: [
          ...imgBlocks,
          {type:'text', text:`Pages shown: ${pageNums}. Questions needing images: ${qNums}. For each image/diagram/graph/table you can see, identify the question number and its bounding box as fractions (0-1) of that page. Return ONLY JSON: {"found":[{"qNumber":"5","pageIndex":0,"x":0.0,"y":0.3,"w":1.0,"h":0.45},...]}`}
        ]}]
      );
      const parsed = JSON.parse(resp.replace(/\`\`\`json|\`\`\`/g, ''));
      for (const item of (parsed.found || [])) {
        if (!pageAssignments[item.qNumber]) {
          pageAssignments[item.qNumber] = {
            pageDataUrl: pages[i + item.pageIndex]?.dataUrl,
            pw: pages[i + item.pageIndex]?.w,
            ph: pages[i + item.pageIndex]?.h,
            x: item.x, y: item.y, w: item.w, h: item.h
          };
        }
      }
    } catch(e) { console.warn('Batch image extract error:', e); }
  }

  // Crop and assign images to questions
  let assigned = 0;
  for (const q of imgQs) {
    const pa = pageAssignments[q.number];
    if (pa?.pageDataUrl) {
      const cropped = cropImageRegion(pa.pageDataUrl, pa.pw, pa.ph, pa.x, pa.y, pa.w, pa.h);
      q.images = [cropped];
      assigned++;
    }
  }
  toast('✅ ' + assigned + ' images extracted for ' + year);
  // Don't save to localStorage (images too large) — in memory only
}

function refreshImageSlot(qid) {
  const q = S.questions.find(x => x.id === qid);
  if (!q) return;
  const slot = document.getElementById('img-slot-'+qid);
  if (!slot) return;
  if (q.images?.some(Boolean)) {
    slot.innerHTML = q.images.filter(Boolean).map(img =>
      `<img src="${img}" style="max-width:100%;border-radius:10px;margin-bottom:8px;display:block;border:1px solid var(--border)">`
    ).join('');
  } else {
    const yr = q.year, qi = q.id;
    slot.innerHTML = `<div onclick="loadPdfForYear('${yr}','${qi}')" style="border:2px dashed var(--border);border-radius:10px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--surface2)" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'"><span style="font-size:1.4rem">🖼️</span><div><div style="font-weight:700;font-size:.85rem">Image not extracted yet</div><div style="font-size:.76rem;color:var(--muted);margin-top:2px">Tap to attach the ${yr} exam PDF — AI extracts all images automatically</div></div></div>`;
  }
}

function toggleExamPage(qid) {

}

function chooseMCQ(qid, choice) {
  const q = _sessPool.find(x=>x.id===qid); if(!q) return;
  const correct = q.correctAnswer ? choice===q.correctAnswer : null;
  _sess.answers[qid] = {choice, correct, ts:Date.now()};
  save();
  document.getElementById('sess-body').innerHTML = renderQView(q, true);
}

async function submitShort(qid) {
  const q = _sessPool.find(x=>x.id===qid); if(!q) return;
  const ans = document.getElementById('short-ans')?.value?.trim();
  if (!ans) { toast('❌ Write an answer first'); return; }
  const btn = document.getElementById('submit-btn');
  if (btn) { btn.textContent='Grading…'; btn.disabled=true; }
  _sess.answers[qid] = {text:ans, aiScore:null, aiFeedback:null, ts:Date.now()};

  try {
    const reportCtx = q.examinerReport ? `\n\nEXAMINER'S REPORT FOR THIS QUESTION:\n${q.examinerReport}` : '';
    // Detect if question involves drawing/diagrams
    const needsDiagram = /draw|diagram|sketch|label|annotate|graph|table|flowchart|cycle|pathway|structure/i.test(q.text);
    const diagramInstruction = needsDiagram
      ? ' If a diagram, labelled structure, cycle, graph, or flowchart would help illustrate the correct answer, include one as valid inline SVG in the "diagram" field (viewBox="0 0 500 350", white bg, clear labels, biology-accurate). Otherwise set "diagram":null.'
      : ' Set "diagram":null.';
    const feedback = await callAI(
      'You are a strict VCE Biology exam marker. Grade the student answer and return ONLY valid JSON (no markdown). Score: 0=incorrect/irrelevant, 1=partially correct, 2=mostly correct minor gaps, 3=full marks.' + diagramInstruction,
      [{role:'user',content:`QUESTION: ${q.text}\nMARKS: ${q.marks}${reportCtx}\n\nSTUDENT ANSWER: ${ans}\n\nReturn ONLY JSON: {"score":0,"feedback":"Detailed feedback explaining what was missing and what a full-marks answer needs, referencing the examiner report where available.","diagram":null}`}]
    );
    const parsed = JSON.parse(feedback.replace(/```json|```/g,''));
    _sess.answers[qid].aiScore = Math.min(3,Math.max(0,parsed.score));
    _sess.answers[qid].aiFeedback = parsed.feedback||'';
    _sess.answers[qid].aiDiagram = parsed.diagram||null;
  } catch(e) {
    _sess.answers[qid].aiScore = -1;
    _sess.answers[qid].aiFeedback = 'Could not grade — check your API key.';
    _sess.answers[qid].aiDiagram = null;
  }
  save();
  document.getElementById('sess-body').innerHTML = renderQView(q, true);
}

function nextSessionQ() {

function prevSessionQ() {

function retrySession() {

    id:uid(), mode:_sess.mode, filters:_sess.filters,
    qIds:[..._sess.qIds], answers:{},

  };

async function learnContent(qid) {

      <span class="pill">${q.topic||'Biology'}</span>
      ${q.year?`<span class="pill">${q.year}</span>`:''}
    </div>
    <div style="font-size:.88rem;color:var(--muted);margin-bottom:16px;line-height:1.5">${q.text.slice(0,200)}${q.text.length>200?'…':''}</div>
    <div id="learn-body" style="text-align:center;padding:20px">
      <div class="spin" style="font-size:1.8rem">🧬</div>
      <div style="color:var(--muted);margin-top:10px;font-size:.85rem">Generating explanation…</div>
    </div>
    <div class="mactions" style="margin-top:0">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>`);

  try {
    const reportCtx = q.examinerReport ? `

EXAMINER'S REPORT: ${q.examinerReport}` : '';
    const correctCtx = q.correctAnswer ? `

CORRECT ANSWER: ${q.correctAnswer}` : '';
    const needsDiagram = /draw|diagram|sketch|label|annotate|graph|table|flowchart|cycle|pathway|structure|process|stage|phase/i.test(q.text + (q.topic||''));
    const raw = await callAI(
      'You are a VCE Biology teacher. Return ONLY valid JSON (no markdown). Explain the biological concept tested by this question.' + (needsDiagram ? ' Also produce a clear, accurate inline SVG diagram (viewBox="0 0 520 360", white background, labelled, biology-accurate) illustrating the key concept — put it in the "diagram" field. If no diagram adds value, set "diagram":null.' : ' Set "diagram":null.'),
      [{role:'user', content: 'QUESTION: '+q.text+correctCtx+reportCtx+'\n\nReturn ONLY JSON: {"concept":"What biological topic this tests","facts":["fact1","fact2","fact3"],"struggles":"Common mistakes","tip":"Exam approach tip","diagram":null}'}]
    );
    let parsed2 = {};
    try { parsed2 = JSON.parse(raw.replace(/```json|```/g,'')); } catch(e) { parsed2 = {concept:'', facts:[], struggles:'', tip:'', diagram:null}; }
    const text = `**The Core Concept**\n${parsed2.concept||''}\n\n**Key Facts to Know**\n${(parsed2.facts||[]).map(f=>'- '+f).join('\n')}\n\n**Why Students Struggle**\n${parsed2.struggles||''}\n\n**Exam Tip**\n${parsed2.tip||''}`;
    const diagramSvg = parsed2.diagram||null;

    const el = document.getElementById('learn-body');
    if (!el) return;
    // Convert markdown-like formatting to HTML
    const formatted = text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^- (.+)/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\s*)+/gs, m => '<ul style="padding-left:18px;margin:6px 0">'+m+'</ul>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    el.innerHTML = '<div style="text-align:left;font-size:.88rem;line-height:1.7;color:var(--text)"><p>'+formatted+'</p></div>'
      + (diagramSvg ? '<div style="margin-top:14px;background:white;border-radius:10px;padding:12px;overflow-x:auto;border:1px solid var(--border)"><div style="font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;text-transform:uppercase">📊 Concept Diagram</div>'+diagramSvg+'</div>' : '');
  } catch(e) {
    const el = document.getElementById('learn-body');
    if (el) el.innerHTML = '<div style="color:var(--wrong);font-size:.85rem">Could not load explanation: '+e.message+'</div>';
  }
}

// ══════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════
function openSettings() {
  openModal(`
    <div class="modal-title">⚙️ Settings</div>
    <div class="fg"><label class="fl">Subject Name</label>
      <input class="fi" id="set-subj" value="${S.subject||''}"></div>
    <div class="fg"><label class="fl">Anthropic API Key</label>
      <input class="fi" id="set-key" type="password" value="${S.settings.apiKey||''}" placeholder="sk-ant-…"></div>
    <div class="fg"><label class="fl">Theme</label>
      <select class="fi" id="set-theme">
        <option value="">System default</option>
        <option value="dark" ${S.settings.dark===true?'selected':''}>Dark</option>
        <option value="light" ${S.settings.dark===false?'selected':''}>Light</option>
      </select></div>
    <hr class="divider">
    <div style="font-size:.82rem;color:var(--wrong);cursor:pointer;font-weight:600" onclick="resetAll()">⚠️ Reset all data (clears everything)</div>
    <div class="mactions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>`);
}

function saveSettings() {
  S.subject = document.getElementById('set-subj').value.trim()||S.subject;
  S.settings.apiKey = document.getElementById('set-key').value.trim();
  const th = document.getElementById('set-theme').value;
  S.settings.dark = th===''?null:th==='dark';
  if(th==='dark') document.documentElement.setAttribute('data-theme','dark');
  else if(th==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('sb-subject-lbl').textContent = S.subject.toUpperCase();
  document.title = S.subject + ' — Exam Practice';
  save(); closeModal(); toast('✅ Settings saved');
}

function resetAll() {
  if (!confirm('Delete ALL questions, sessions, and settings? This cannot be undone.')) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
}
</script>
