<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Practice</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<style>
/* ── TOKENS ── */
:root {
  --bg:        #f7f6f3;
  --surface:   #ffffff;
  --surface2:  #f0ede8;
  --border:    #e0dbd3;
  --text:      #1a1824;
  --muted:     #7a7490;
  --accent:    #c8850a;
  --accent-bg: #fef3e2;
  --correct:   #16a34a;
  --wrong:     #dc2626;
  --partial:   #d97706;
  --sidebar-w: 220px;
  --radius:    10px;
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --bg:        #0d1117;
    --surface:   #161b2c;
    --surface2:  #1c2340;
    --border:    #252d4a;
    --text:      #e4e8f7;
    --muted:     #6b7599;
    --accent:    #f5a823;
    --accent-bg: #2a1f06;
  }
}
:root[data-theme=dark] {
  --bg:        #0d1117;
  --surface:   #161b2c;
  --surface2:  #1c2340;
  --border:    #252d4a;
  --text:      #e4e8f7;
  --muted:     #6b7599;
  --accent:    #f5a823;
  --accent-bg: #2a1f06;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,-apple-system,sans-serif;font-size:15px;background:var(--bg);color:var(--text);line-height:1.5}

/* ── LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;padding:0 0 12px}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ── SIDEBAR ── */
.sb-header{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
.sb-subject{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.sb-title{font-size:1rem;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.sb-nav{padding:10px 8px;flex:1}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--muted);font-weight:500;transition:.12s;user-select:none}
.sb-item:hover{background:var(--surface2);color:var(--text)}
.sb-item.active{background:var(--accent-bg);color:var(--accent);font-weight:700}
.sb-item .ico{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.sb-bottom{padding:8px}
.sb-settings{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.82rem;color:var(--muted);transition:.12s}
.sb-settings:hover{background:var(--surface2);color:var(--text)}

/* ── TOPBAR ── */
#topbar{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;flex-shrink:0}
#topbar h1{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;flex:1}
#page-content{padding:24px;flex:1}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card+.card,.card+.stats-row,.stats-row+.card{margin-top:14px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-val{font-size:1.8rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat-lbl{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid transparent;font-size:.85rem;font-weight:600;cursor:pointer;transition:.12s;font-family:inherit;line-height:1}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 11px;font-size:.78rem}
.btn-danger{background:transparent;color:var(--wrong);border-color:var(--wrong)}
.btn-danger:hover{background:var(--wrong);color:#fff}

/* ── FORMS ── */
.fi{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.88rem;outline:none;transition:.12s}
.fi:focus{border-color:var(--accent)}
.fl{display:block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fg{margin-bottom:14px}
select.fi option{background:var(--surface)}

/* ── DROP ZONE ── */
.drop-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;transition:.15s;color:var(--muted)}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:var(--accent-bg);color:var(--text)}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th{text-align:left;padding:8px 12px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface2)}
.tbl tr{cursor:pointer}

/* ── TAGS ── */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.tag.mcq{background:#dbeafe;color:#1e40af}
.tag.short{background:#dcfce7;color:#166534}
.tag.extended{background:#fce7f3;color:#9d174d}
:root[data-theme=dark] .tag.mcq,:root:not([data-theme=light]) .tag.mcq{background:#1e3a5f;color:#93c5fd}
:root[data-theme=dark] .tag.short,:root:not([data-theme=light]) .tag.short{background:#14532d;color:#86efac}
:root[data-theme=dark] .tag.extended,:root:not([data-theme=light]) .tag.extended{background:#500724;color:#f9a8d4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.mcq{background:#1e3a5f;color:#93c5fd}:root:not([data-theme=light]) .tag.short{background:#14532d;color:#86efac}:root:not([data-theme=light]) .tag.extended{background:#500724;color:#f9a8d4}}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:fadeIn .15s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:540px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-title{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
.mactions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── PRACTICE SESSION ── */
#session-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;overflow:hidden}
.sess-topbar{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:16px;flex-shrink:0}
.sess-prog-wrap{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.sess-prog-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .35s}
.sess-main{flex:1;display:flex;overflow:hidden}
.sess-body{flex:1;overflow-y:auto;padding:28px 24px;max-width:760px;margin:0 auto;width:100%}
.sess-pdf-panel{width:420px;flex-shrink:0;border-left:1px solid var(--border);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column}
.sess-pdf-panel.hidden{display:none}
.pdf-panel-head{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface)}
.pdf-pages-wrap{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
#pdf-drop-zone.drag{border-color:var(--accent)!important;background:var(--accent-bg)!important}
@media(max-width:700px){.sess-pdf-panel{width:100%;height:45vh;border-left:none;border-top:1px solid var(--border)}.sess-main{flex-direction:column}}
.q-label{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.q-text{font-size:1rem;line-height:1.7;margin-bottom:16px;font-weight:500}
.q-num{font-family:ui-monospace,monospace;font-size:.85rem;font-weight:700;color:var(--accent);background:var(--accent-bg);padding:2px 8px;border-radius:5px}
.mcq-options{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.mcq-opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;transition:.12s;background:var(--surface)}
.mcq-opt:hover{border-color:var(--accent);background:var(--accent-bg)}
.mcq-opt.selected{border-color:var(--accent);background:var(--accent-bg)}
.mcq-opt.correct{border-color:var(--correct);background:#dcfce7}
.mcq-opt.wrong{border-color:var(--wrong);background:#fee2e2}
:root[data-theme=dark] .mcq-opt.correct,:root:not([data-theme=light]) .mcq-opt.correct{background:#14532d}
:root[data-theme=dark] .mcq-opt.wrong,:root:not([data-theme=light]) .mcq-opt.wrong{background:#450a0a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .mcq-opt.correct{background:#14532d}:root:not([data-theme=light]) .mcq-opt.wrong{background:#450a0a}}
.mcq-label{font-family:ui-monospace,monospace;font-weight:700;font-size:.9rem;color:var(--accent);width:20px;flex-shrink:0}
.short-area{width:100%;min-height:130px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem;padding:13px;resize:vertical;line-height:1.6;outline:none;transition:.12s}
.short-area:focus{border-color:var(--accent)}
.report-box{margin-top:20px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.report-header{padding:10px 14px;background:var(--surface2);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.report-body{padding:14px;font-size:.88rem;line-height:1.7;color:var(--text)}
.ai-result{margin-top:14px;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
.ai-score-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.score-badge{padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:800;letter-spacing:.02em}
.score-0{background:#fee2e2;color:var(--wrong)}
.score-1{background:#fef3c7;color:var(--partial)}
.score-2{background:#dcfce7;color:var(--correct)}
.score-3{background:#dcfce7;color:var(--correct)}
:root[data-theme=dark] .score-0,:root:not([data-theme=light]) .score-0{background:#450a0a}
:root[data-theme=dark] .score-1,:root:not([data-theme=light]) .score-1{background:#422006}
:root[data-theme=dark] .score-2,:root:not([data-theme=light]) .score-2,.score-3,:root[data-theme=dark] .score-3,:root:not([data-theme=light]) .score-3{background:#14532d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .score-0{background:#450a0a}:root:not([data-theme=light]) .score-1{background:#422006}:root:not([data-theme=light]) .score-2{background:#14532d}:root:not([data-theme=light]) .score-3{background:#14532d}}
.stat-bar-row{display:flex;align-items:center;gap:8px;font-size:.78rem;margin-top:4px}
.stat-bar{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:3px;background:var(--muted);transition:width .5s}
.stat-bar-fill.correct-opt{background:var(--correct)}

/* ── RESULTS ── */
.result-q-row{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.result-q-row:last-child{border-bottom:none}
.result-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}

/* ── SETUP ── */
#setup{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center}
.setup-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;width:420px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.setup-icon{font-size:2.4rem;margin-bottom:12px}
.setup-box h1{font-size:1.4rem;font-weight:900;letter-spacing:-.03em;margin-bottom:6px}
.setup-box p{color:var(--muted);font-size:.88rem;margin-bottom:22px}

/* ── TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:.83rem;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}

/* ── MISC ── */
.hidden{display:none!important}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.empty{text-align:center;padding:48px 16px;color:var(--muted);font-size:.88rem}
.empty .emi{font-size:2.5rem;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;background:var(--surface2);color:var(--muted)}
</style>
</head>
<body>

<div id="toast"></div>
<div id="page-loader" style="position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <div style="font-size:2rem;animation:spin .9s linear infinite">🧬</div>
  <div style="font-size:.9rem;color:var(--muted);font-weight:600">Loading VCE Biology…</div>
</div>
<div id="setup" class="hidden">
  <div class="setup-box">
    <div class="setup-icon">📋</div>
    <h1>Exam Practice</h1>
    <p>Set this site up for one subject. Each subject gets its own separate instance.</p>
    <div class="fg"><label class="fl">Subject Name</label>
      <input class="fi" id="setup-subj" placeholder="e.g. Business Management" autocomplete="off"></div>
    <div class="fg"><label class="fl">Anthropic API Key <span style="font-weight:400;text-transform:none;color:var(--muted)">(for AI features)</span></label>
      <input class="fi" id="setup-key" type="password" placeholder="sk-ant-…"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" onclick="finishSetup()">Get Started →</button>
  </div>
</div>

<div id="session-overlay" class="hidden"></div>

<div id="overlay-root"></div>

<div id="app" class="hidden">
  <div id="sidebar">
    <div class="sb-header">
      <div class="sb-subject" id="sb-subject-lbl">Subject</div>
      <div class="sb-title" id="sb-title-lbl">Exam Practice</div>
    </div>
    <div class="sb-nav">
      <div class="sb-item active" onclick="nav('dashboard')" data-view="dashboard"><span class="ico">📊</span> Dashboard</div>
      <div class="sb-item" onclick="nav('bank')" data-view="bank"><span class="ico">🗂</span> Question Bank</div>
      <div class="sb-item" onclick="nav('upload')" data-view="upload"><span class="ico">📤</span> Upload Exam</div>
      <div class="sb-item" onclick="nav('practice')" data-view="practice"><span class="ico">🎯</span> Practice</div>
      <div class="sb-item" onclick="nav('history')" data-view="history"><span class="ico">📈</span> History</div>
    </div>
    <div class="sb-bottom">
      <div class="sb-settings" onclick="openSettings()"><span style="font-size:1rem">⚙️</span> Settings</div>
    </div>
  </div>

  <div id="main">
    <div id="topbar">
      <h1 id="topbar-title">Dashboard</h1>
      <div id="topbar-actions"></div>
    </div>
    <div id="page-content"></div>
  </div>
</div>

s":{"A":1.0,"B":5.0,"C":90.0,"D":4.0},"images":[],"reportImages":[],"preloaded":true,"examPage":12},{"id":"vcabio2023_31","year":"2023","examName":"VCE Biology","number":"31","topic":"General Biology","type":"mcq","text":"The diphtheria vaccine contains an inactivated form of the diphtheria toxin. Which type of immunity will be acquired by individuals who receive this vaccine?","marks":1,"options":[{"label":"A","text":"artificial active"},{"label":"B","text":"natural active"},{"label":"C","text":"natural passive"},{"label":"D","text":"artificial passive"}],"correctAnswer":"A","examinerReport":"","reportStats":{"A":78.0,"B":3.0,"C":3.0,"D":15.0},"images":[],"reportImages":[],"preloaded":true,"examPage":13},{"id":"vcabio2023_32","year":"2023","examName":"VCE Biology","number":"32","topic":"Immune Response","type":"mcq","text":"Outbreaks of diphtheria occasionally occur. Which statement is the most likely explanation for outbreaks of diphtheria?","marks":1,"options":[{"label":"A","text":"Mutations produce a new strain, which means the bacteria are less able to enter cells in the nose and throat."},{"label":"B","text":"Herd immunity is lost due to parents choosing not to vaccinate their children."},{"label":"C","text":"Free genetic testing to identify individuals who are at risk is not provided."},{"label":"D","text":"There was a failure to use antiviral medication to treat individuals quickly. 2023 BIOLOGY EXAM 14 SECTION A – continued d o n o t w r i t e i n t h i s a r e a Use the following information to answer Questions 33 and 34. Zika virus is an emerging infectious disease that was first identified in Uganda in 1947. The virus is mainly transmitted when mosquitoes bite an infected person. The mosquitoes then go on to bite other people, infecting them. Most infected people develop no symptoms. Those that do generally have mild symptoms including a rash, fever, and muscle and joint pain that usually lasts two to seven days. There is currently no treatment or vaccination available. The map below shows the geographical distribution of Zika virus cases during various outbreaks between 1947 and 2018. Zika Forest, Uganda Key before 2007 2007–2014 2015–2016 2017–2018 ‘Zika virus: an emerging challenge to public health worldwide’, Canadian Journal of Microbiology, vol 66, No 2, <https://cdnsciencepub.com/doi/10.1139/cjm-2019-0331>"}],"correctAnswer":"B","examinerReport":"","reportStats":{"A":7.0,"B":83.0,"C":3.0,"D":8.0},"images":[],"reportImages":[],"preloaded":true,"examPage":13},{"id":"vcabio2023_33","year":"2023","examName":"VCE Biology","number":"33","topic":"Immune Response","type":"mcq","text":"The World Health Organization declared that the outbreak of Zika virus in 2015 and 2016 was an epidemic rather than a pandemic because","marks":1,"options":[{"label":"A","text":"the cases were confined to specific geographic regions."},{"label":"B","text":"no vaccination was available for the pathogen."},{"label":"C","text":"cases were confirmed in different countries."},{"label":"D","text":"people of all ages were affected. 15 2023 BIOLOGY EXAM SECTION A – continued TURN OVER d o n o t w r i t e i n t h i s a r e a"}],"correctAnswer":"A","examinerReport":"","reportStats":{"A":89.0,"B":2.0,"C":9.0,"D":0.0},"images":[],"reportImages":[],"preloaded":true,"examPage":14},{"id":"vcabio2023_34","year":"2023","examName":"VCE Biology","number":"34","topic":"Pathogens & Disease","type":"mcq","text":"Which one of the following measures would be least effective in controlling the spread of Zika virus?","marks":1,"options":[{"label":"A","text":"using television and radio advertisements to educate people on how Zika virus spreads"},{"label":"B","text":"providing free face masks and encouraging people to wear them in public"},{"label":"C","text":"quarantining infected individuals inside their homes"},{"label":"D","text":"wearing clothing that covers arms and legs"}],"correctAnswer":"B","examinerReport":"","reportStats":{"A":7.0,"B":71.0,"C":6.0,"D": cluding Homo sapiens. Both the body mass (kg) and brain mass (g) of each species have been plotted using a logarithmic scale. 0.1 1 10 100 1000 10000 0.01 0.1 1 10 100 1000 Species 1 Species 3 Species 4 Species 2 body mass (kg) brain mass (g) Average mammal Key Annual Review of Anthropology 35(1), <https://www.researchgate.net/publication/228173421> Based on the information in the above graph, which species is most likely to represent Homo sapiens?","marks":1,"options":[{"label":"A","text":"Species 1"},{"label":"B","text":"Species 2"},{"label":"C","text":"Species 3"},{"label":"D","text":"Species 4 19 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a END OF SECTION A TURN OVER"}],"correctAnswer":"B","examinerReport":"","reportStats":{"A":2.0,"B":77.0,"C":5.0,"D":16.0},"images":[],"reportImages":[],"preloaded":true,"examPage":18},{"id":"vcabio2023_40","year":"2023","examName":"VCE Biology","number":"40","topic":"General Biology","type":"mcq","text":"The diagram below shows the position of the pelvis and leg bones of Homo sapiens, Australopithecines and chimpanzees (Pan troglodytes). The carrying angle for each is shown. carrying angle Homo sapiens Australopithecines Pan troglodytes Bone, 2002, vol. 30 Which one of the following statements is correct?","marks":1,"options":[{"label":"A","text":"Homo sapiens have the smallest carrying angle of the skeletons shown."},{"label":"B","text":"The carrying angle in Australopithecines allows their centre of gravity to be shifted forward."},{"label":"C","text":"The carrying angle of the Pan troglodytes suggests that, of the three species, it is the best suited to bipedalism."},{"label":"D","text":"The large carrying angle of Australopithecines supports bipedalism. 2023 BIOLOGY EXAM 20 d o n o t w r i t e i n t h i s a r e a SECTION B – Question 1 – continued Question 1 (8 marks) The diagram below shows the structure of tryptophan. a. To what group of biological monomers does tryptophan belong? Use information in the diagram to justify your response. 2 marks SECTION B Instructions for"}],"correctAnswer":"D","examinerReport":"Section B","reportStats":{"A":2.0,"B":17.0,"C":9.0,"D":72.0},"images":[],"reportImages":[],"preloaded":true,"examPage":19},{"id":"vcabio2023_2a","year":"2023","examName":"VCE Biology","number":"2a","topic":"Photosynthesis","type":"extended","text":"To which plant group (C3, C4 or CAM) would this unusual plant species most likely belong? Justify your answer. 23 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a SECTION B – continued TURN OVER","marks":3,"options":[],"correctAnswer":null,"examinerReport":"The most likely type of plant is C4 as it has high starch formation at 40 °C and at high humidity.\nCAM was also acceptable if students made the link that they are suited to high temperature levels and low humidity, having higher starch formation in these.\nNo marks were awarded for choosing C3.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":22},{"id":"vcabio2023_2b","year":"2023","examName":"VCE Biology","number":"2b","topic":"General Biology","type":"extended","text":"Why does exposing the plants to green or blue light as opposed to white light affect the formation of starch? Justify your answer. 2023 BIOLOGY EXAM 24 d o n o t w r i t e i n t h i s a r e a SECTION B – Question 3 – continued","marks":4,"options":[],"correctAnswer":null,"examinerReport":"Four valid points were required, such as:\nWhite light is made up of different colours, e.g. green and blue light, or different wavelengths.\nGreen light is reflected / not absorbed.\nBlue light is absorbed.\nLight is absorbed in photosynthesis which produces glucose and then starch.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":22},{"id":"vcabio2023_3a","year":"2023","examName":"VCE Biology","number":"3a","topic":"Pathogens & Disease","type":"extended","text":"Describe the functions of these specific antibodies during an S. pyogenes infection and how this leads to recovery. In 2021, researchers from Melbourne’s Nucleus Network were involved in the early stages of developing a vaccine against S. pyogenes. Part of their investigation involved determining the bacterial concentration needed to cause a sore throat in at least 60% of people whose throats were deliberately infected with S. pyogenes.","marks":3,"options":[],"correctAnswer":null,"examinerReport":"Antibodies bind to antigens, leading to agglutination OR neutralisation OR opsonisation OR activation of complement proteins. This triggers an increase in phagocytosis which reduces the number of pathogens OR the duration or severity of their effects on the body.\nStudents did not need to use the specific terms agglutination, neutralisation or opsonisation; instead, they could provide a description of the term.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":24},{"id":"vcabio2023_3b","year":"2023","examName":"VCE Biology","number":"3b","topic":"Immune Response","type":"short","text":"Some scientists suggest that this study may have violated a principle of bioethics. Suggest which principle this may be and explain why. Principle violated: Explanation: 25 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a SECTION B – Question 3 – continued TURN OVER In a follow-up study, the participants were divided into two groups (A and B) of equal size and put through a three-stage trial, as shown below. after 14 days Stage 2 All participants have blood taken to measure memory cell concentrations. Their throats are then swabbed with S. pyogenes. Stage 3 Blood is taken from all participants to measure antibody and white blood cell concentrations. Stage 1 Group A – receives a newly developed vaccine against S. pyogenes. Group B – receives a placebo injection consisting of salt solution. after 10 days Participants also indicated whether they suffered from a sore throat at any point during the study. The data in the table below shows the results from four participants at the end of the study. Participant 1 2 3 4 Sore throat during study? yes no no yes Blood memory cell concentration at stage 2 low high medium high Blood memory cell concentration at stage 3 medium high high high Blood antibody concentration at stage 3 medium high high high Blood cytotoxic T cell concentration at stage 3 low low low high","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Students could answer this question by referring to any ethical concept or approach with an appropriate and congruent explanation as to how this was violated in this study.\nA common response was:\nPrinciple violated: non-maleficence\nExplanation: the scientists intentionally caused a sore throat in participants.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":24},{"id":"vcabio2023_3c","year":"2023","examName":"VCE Biology","number":"3c","topic":"General Biology","type":"extended","text":"Explain which participant is the most likely to have received the placebo injection. 2023 BIOLOGY EXAM 26 d o n o t w r i t e i n t h i s a r e a SECTION B – continued","marks":3,"options":[],"correctAnswer":null,"examinerReport":"Participant 1.\nSuitable justifications for Participant 1 included:\nThis participant demonstrated a sore throat during the study.\nThis participant had the lowest antibody (medium at stage 3) and lowest memory cell concentration (low at stage 2 and/or medium at stage 3) compared to all other participants in these stages.\nThey had no prior immune response to the S. pyogenes, which would have occurred if they had been exposed to the vaccine or antigen OR antibody and/or memory cell concentration would have been higher if they were exposed to a vaccine.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":24},{"id":"vcabio2023_3d","year":"2023","examName":"VCE Biology","number":"3d","topic":"Pathogens & Disease","type":"short","text":"Another example of a pathogenic bacteria is Mycobacterium tuberculosis. This bacterium causes the disease tuberculosis (TB). Some strains of this bacterium have become resistant to many of the common drugs used in the treatment of TB. Outline two ongoing challenges for treatment strategies as a result of this resistance. 27 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a SECTION B – continued TURN OVER","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Two valid points were required, such as:\nnot enough research or development into new drugs or vaccines\nmore time or money required to develop new drugs or vaccines\ndoctors overprescribing new drugs or patients not completing the full course of treatment\nepidemics or pandemics more likely, making herd immunity difficult to achieve.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":24},{"id":"vcabio2023_4a","year":"2023","examName":"VCE Biology","number":"4a","topic":"Proteins & Enzymes","type":"extended","text":"Describe the roles of coenzymes in the formation of ATP. A student measured the effect of oxygen on the metabolism of glucose in red blood cells at 37 °C and observed the results shown in the table below. Effect of oxygen availability on the metabolism of glucose by red blood cells Oxygen Glucose consumed (nmoles/107 cells/hour) Lactate produced (nmoles/107 cells/hour) absent 1.6 3.2 present 1.6 3.2","marks":3,"options":[],"correctAnswer":null,"examinerReport":"Coenzymes, such as NAD and FAD, carry hydrogen ions and/or electrons to the electron transport chain in aerobic cellular respiration. This enables ADP and Pi to join, forming ATP.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":27},{"id":"vcabio2023_4b","year":"2023","examName":"VCE Biology","number":"4b","topic":"General Biology","type":"extended","text":"Why are the results the same irrespective of the presence of oxygen? Explain your answer. 2023 BIOLOGY EXAM 28 d o n o t w r i t e i n t h i s a r e a SECTION B – Question 5 – continued","marks":3,"options":[],"correctAnswer":null,"examinerReport":"Red blood cells lack membrane-bound organelles such as mitochondria. As such, these cells only undergo anaerobic fermentation where glucose/pyruvate is converted to lactate at the same rate.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":27},{"id":"vcabio2023_5a","year":"2023","examName":"VCE Biology","number":"5a","topic":"Biotechnology","type":"extended","text":"Using the information in the flow chart above, explain how CRISPR-Cas9 technology could be used to produce citrus-canker-resistant plants. 29 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a SECTION B – continued TURN OVER During outbreaks of citrus canker, the infected trees and fruit are removed and burned. Recently it has been proposed that instead of being burned, the trees could be used to produce biofuel. The first stage in the production of biofuel from infected trees could involve a technique known as steam explosion. This involves using very hot steam at high pressures inside a pressure chamber to break open the cells from the trees. An investigation was conducted to determine the relationship between temperature and the percentage of cells broken open during the steam explosion technique. The results are shown below. Temperature inside pressure chamber (°C) Percentage of cells broken open 20 36 80 47 150 57 200 85 250 94","marks":4,"options":[],"correctAnswer":null,"examinerReport":"The following key points were required:\nsgRNA is designed to be complementary to CsWRKY22 OR CsLOB1.\nsgRNA is combined with Cas9 OR guides Cas9.\nCas9 binds to PAM and cuts the gene. As a consequence, CsWRKY22 protein is not produced or can’t bind to the CsLOB1 gene OR CsLOB1 gene is not transcribed, so proteins that cause citrus canker are not produced.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":28},{"id":"vcabio2023_5b","year":"2023","examName":"VCE Biology","number":"5b","topic":"General Biology","type":"short","text":"Scientists decided to use the steam explosion technique at 250 °C. The temperature was then lowered to 35 °C and yeast was added to the ruptured cell mixture. Why did the scientists decide to do each of the following?","marks":2,"options":[],"correctAnswer":null,"examinerReport":"","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":28},{"id":"vcabio2023_5iii","year":"2023","examName":"VCE Biology","number":"5iii","topic":"General Biology","type":"short","text":"Lower to 35 °C and add yeast 2023 BIOLOGY EXAM 30 d o n o t w r i t e i n t h i s a r e a SECTION B – Question 6 – continued","marks":1,"options":[],"correctAnswer":null,"examinerReport":"","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":28},{"id":"vcabio2023_6a","year":"2023","examName":"VCE Biology","number":"6a","topic":"Biotechnology","type":"extended","text":"Outline how human insulin is made using recombinant plasmids. 31 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a SECTION B – continued TURN OVER There are different types of insulin available for use. The activity profile of each of these insulins is shown in the graph below. lispro regular NPH glargine Key relative insulin activity (arbitrary units) 7 6 5 4 3 2 1 0 3 6 9 12 15 18 21 24 time (hours) Activity profiles of different types of insulin treatment-of-type-2-diabetes/medications-and-therapies/type-2-insulin-rx/types-of-insulin/>, Copyright © 2009 The Regents of the University of California, all rights reserved, www.deo.ucsf.edu","marks":5,"options":[],"correctAnswer":null,"examinerReport":"Students were required to identify that human insulin genes for chains A and B are isolated and that Insulin A gene is placed in one plasmid and Insulin B gene is placed in a different plasmid.\nOther key steps students may have identified included:\nRestriction endonucleases are used to cut, e.g. the plasmid or human DNA.\nDNA ligase joins the DNA sequences into the plasmid.\nThe plasmid is inserted by heat shock into the bacteria which is transformed OR each plasmid is inserted into separate bacteria.\nAntibiotic selection or another suitable method (e.g. insulin genes inserted next to a gene coding for beta-galactosidase protein) is used to determine success.\nProcessing of the protein such as joining insulin polypeptide chains A and B occurs to create functional insulin.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":30},{"id":"vcabio2023_6b","year":"2023","examName":"VCE Biology","number":"6b","topic":"Proteins & Enzymes","type":"extended","text":"Identify which type of insulin is rapid acting compared to regular insulin. Use data from the graph to justify your response. Insulin contains 2 polypeptide chains.","marks":3,"options":[],"correctAnswer":null,"examinerReport":"Lispro\nCompared to regular insulin, lispro acts immediately / it peaks quickly at 2 hours instead of 5 / at 7 arbitrary units instead of 6.\nIts duration is shorter / 5 hours compared to 12 hours.\nThe correct name was given by nearly every student and most gave one valid reason for their choice. Those who correctly interpreted the graph gained the third mark available.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":30},{"id":"vcabio2023_6iii","year":"2023","examName":"VCE Biology","number":"6iii","topic":"Proteins & Enzymes","type":"short","text":"What should scientists consider when altering the primary structure of insulin? Justify your response. 2023 BIOLOGY EXAM 32 d o n o t w r i t e i n t h i s a r e a SECTION B – continued","marks":2,"options":[],"correctAnswer":null,"examinerReport":"","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":30},{"id":"vcabio2023_7a","year":"2023","examName":"VCE Biology","number":"7a","topic":"General Biology","type":"extended","text":"Explain how the genetic diversity of helmeted honeyeaters may change over time as a result of genetic drift.","marks":3,"options":[],"correctAnswer":null,"examinerReport":"Genetic drift causes a decrease in genetic diversity.\nSuitable explanations included:\nIt is a random change in allele frequency and is more pronounced in small, isolated populations.\nGenetic drift may cause an allele of a particular gene to disappear altogether purely by chance OR may lead to a bottleneck in future populations.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":32},{"id":"vcabio2023_7b","year":"2023","examName":"VCE Biology","number":"7b","topic":"General Biology","type":"short","text":"Since 1989, Zoos Victoria has run a captive-breeding program for the helmeted honeyeater. More than 250 helmeted honeyeaters have been released into the wild and the total number of birds in the wild has tripled since 1989. Each year, eggs are swapped between the wild populations and the captive-bred population. How is genetic diversity within the wild populations being maintained?","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Genetic diversity is maintained as birds bred in captivity have different genetic diversity. When gene flow occurs between the populations, these differences enter the wild population.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":32},{"id":"vcabio2023_7c","year":"2023","examName":"VCE Biology","number":"7c","topic":"General Biology","type":"extended","text":"Define a consequence-based approach to bioethics and outline how this relates to the work by Zoos Victoria to prevent extinction of the helmeted honeyeater. 33 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a SECTION B – continued TURN OVER","marks":3,"options":[],"correctAnswer":null,"examinerReport":"A consequences-based approach places central importance on the consideration of the consequences of an action, with the aim to maximise the positive outcomes and minimise the negative effects.\nAs part of their response, students were required to consider possible positive outcomes and negative effects of the work by Zoos Victoria in preventing the extinction of the helmeted honeyeater.\nPositive outcomes Zoos Victoria may have sought to maximise included an increase in the total number of birds OR an increase in genetic diversity in the wild which may prevent extinction.\nNegative effects Zoos Victoria may have sought to minimise included not having a negative effect on the bird’s health OR not enough food available OR space for nesting.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":32},{"id":"vcabio2023_8a","year":"2023","examName":"VCE Biology","number":"8a","topic":"General Biology","type":"short","text":"Suggest two possible ways in which people with African ancestry could have some Neanderthal DNA in their genomes.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Possible ways that people with African ancestry could have Neanderthal DNA in their genomes included:\nAncestors of modern Africans could have interbred with Neanderthals before migrating from Africa.\nAncestors of modern Africans left Africa and interbred with Neanderthals already in Europe and Asia, before returning to Africa.\nModern-day Africans still carry Neanderthal DNA that was shared DNA from their common ancestor.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":33},{"id":"vcabio2023_8b","year":"2023","examName":"VCE Biology","number":"8b","topic":"General Biology","type":"short","text":"Suggest why it is reasonable that modern Europeans and Asians show greater percentages of Neanderthal DNA than people who originated in Africa. 2023 BIOLOGY EXAM 34 d o n o t w r i t e i n t h i s a r e a SECTION B – Question 9 – continued","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Possible reasons why modern Europeans and Asians show a greater percentage of Neanderthal DNA included:\nHomo sapiens coexisted with Neanderthals for a longer period of time in Europe and Asia, so more opportunities existed for interbreeding.\nHomo sapiens who originated in Africa did not coexist or interbreed with Neanderthals, as Neanderthals did not live in Africa.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":33},{"id":"vcabio2023_9a","year":"2023","examName":"VCE Biology","number":"9a","topic":"Evolution","type":"short","text":"Using the information in the table, identify two factors that may have contributed to speciation in these two palms. 35 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a SECTION B – continued TURN OVER Scientists also recorded the pH of the soil in which the palm species were growing and the altitude where the plants could be found. 60 40 20 0 60 40 20 0 9 8 7 6 5 palm abundance palm abundance 0–30 31–60 61–90 91–120 >121 altitude (m) mean pH Key H. forsteriana H. belmoreana M Norup, M Powell, D Springate, N Salamin, & W Baker, Nature, 2006, <https://www.researchgate.net/publication/7306249>","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Two factors contributed to speciation in the Howea palms:\nH. forsteriana and H. belmoreana palm species have different flowering times.\nBetween the opposite genders of different species, their peak flowering frequency is different.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":34},{"id":"vcabio2023_9iii","year":"2023","examName":"VCE Biology","number":"9iii","topic":"Evolution","type":"short","text":"Evidence suggests that a common ancestor of the two palm species colonised acidic (pH below 7) volcanic soils on the island around 6 million years ago. Much more recently (2 million to 500 000 years ago), H. forsteriana diverged from the common ancestor. Explain how these differences between pH and altitude could have led to speciation. 2023 BIOLOGY EXAM 36 d o n o t w r i t e i n t h i s a r e a SECTION B – Question 10 – continued","marks":2,"options":[],"correctAnswer":null,"examinerReport":"","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":34},{"id":"vcabio2023_10a","year":"2023","examName":"VCE Biology","number":"10a","topic":"General Biology","type":"short","text":"Give two examples of possible sources of eDNA from the platypus.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Two of: fur, skin, saliva, venom, urine, faeces.\nSome students incorrectly gave a location instead of a source, which was not acceptable.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":36},{"id":"vcabio2023_10b","year":"2023","examName":"VCE Biology","number":"10b","topic":"General Biology","type":"short","text":"Explain two factors to consider when sampling the water to reduce sources of error.","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Two possible factors included:\nprevent contamination of DNA from other sources by using gloves\nlabel the samples with date, time and location to ensure the correct sample details are recorded / equipment calibrated\nuse consistent sampling conditions, e.g. water temperature, and consistent sampling methods such as collecting a suitable number of samples and volume of water to increase reliability and validity.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":36},{"id":"vcabio2023_10c","year":"2023","examName":"VCE Biology","number":"10c","topic":"Biotechnology","type":"short","text":"State why PCR was used in the test of the water samples. 2023 BIOLOGY EXAM 38 d o n o t w r i t e i n t h i s a r e a SECTION B – continued Prior to the project, state-wide data on the occurrence of platypuses across Victorian rivers was collated. Refer to the shading on the map below for predicted platypus occurrences. The project detected platypuses at 19–25% of sampled Victorian rivers. Refer to the icons on the map below for the results from eDNA surveys for detection of platypus occurrence at a range of sampling sites. 0 mples of factors that were controlled in this experiment included:\nthe volume (10 mL) of bacterial growth medium\nthe sample volume (0.1 mL) of each population transferred to next growth medium\nincubation time (24 hours)\nincubation temperature\nspecies of E. coli\ninitial amount of citrate and/or glucose in growth medium.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":39},{"id":"vcabio2023_11b","year":"2023","examName":"VCE Biology","number":"11b","topic":"Evolution","type":"short","text":"At about 30 000 generations, a mutation was seen that allowed the mutant bacteria to use citrate as an energy source. What effect would you expect this mutation to have on subsequent generations of this group of bacteria and why?","marks":2,"options":[],"correctAnswer":null,"examinerReport":"Effect of mutation on subsequent generations: Bacteria carrying the mutation had an increased rate of reproduction OR an increased frequency of the allele for citrate metabolism was present in future generations.\nReason why: E. coli now have an additional food source OR greater energy availability.\nStudents could also have answered this question from the perspective of a negative effect on the E. coli population which would not survive due to a disadvantage in using citrate or no longer being able to use glucose as an energy source.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":39},{"id":"vcabio2023_11c","year":"2023","examName":"VCE Biology","number":"11c","topic":"Genetics & Inheritance","type":"extended","text":"Assume that you are a scientist looking to further this research and you have access to the bacteria from a generation after 30 000. Describe how you would conduct an experiment to investigate the effect of different glucose concentrations on the frequency of the mutant citrate phenotype. END OF QUESTION AND ANSWER BOOK 41 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a TURN OVER Extra space for responses Clearly number all responses in this space. 2023 BIOLOGY EXAM 42 d o n o t w r i t e i n t h i s a r e a 43 2023 BIOLOGY EXAM d o n o t w r i t e i n t h i s a r e a","marks":3,"options":[],"correctAnswer":null,"examinerReport":"In conducting an experiment, students needed to include one point from each of the following:\nExamples of appropriate controlled variables:\nvolume of nutrient broth or sample added to different flasks\nincubation time or incubation temperature\nvolume of citrate added\nExamples of an appropriate control group:\nE. coli provided 0% glucose\nE. coli provided only citrate\nRepeatability:\nlarge sample size\nincubate E. coli over many generations\nAs both the independent and dependent variables were provided in the question stem, students who referred to either one of these correctly could receive a maximum of one mark for either of these variables. They then only required any appropriate answer from two of the above listed points.","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":39},{"id":"vcabio2024_12","year":"2024","examName":"VCE Biology","number":"12","topic":"Immune Response","type":"mcq","text":"Which one of the following is a reasonable conclusion to draw from the graph?","marks":1,"options":[{"label":"A","text":"For all light conditions, the cell densities continually increased over nine days."},{"label":"B","text":"Under green light conditions, the cell densities decreased from day 3 to day 9."},{"label":"C","text":"Blue light conditions resulted in the highest cell densities by day 9 compared to the other light conditions."},{"label":"D","text":"Under white light conditions, the cell densities increased on each day measurements were taken."}],"correctAnswer":"D","examinerReport":"Option D was the only correct response, as when microalgae were exposed to white light conditions, there was an increase in cell density on each day measurements were recorded.","reportStats":{"A":9.0,"B":2.0,"C":2.0,"D":86.0},"images":[],"reportImages":[],"preloaded":true,"examPage":10},{"id":"vcabio2024_13","year":"2024","examName":"VCE Biology","number":"13","topic":"Photosynthesis","type":"mcq","text":"A controlled variable in this experiment should be the","marks":1,"options":[{"label":"A","text":"amount of glucose produced by the microalgae."},{"label":"B","text":"amount of oxygen produced by the microalgae."},{"label":"C","text":"light intensity of all the different lights."},{"label":"D","text":"molecules of chlorophyll present."}],"correctAnswer":"C","examinerReport":"The correct controlled variable was the light intensity of all the different lights (option C). The microalgae under investigation in this experiment would all have slight variations in the relative amount of chlorophyll molecules present in each algal cell, due to natural variation between cells. Therefore, option D is incorrect.","reportStats":{"A":2.0,"B":2.0,"C":84.0,"D":12.0},"images":[],"reportImages":[],"preloaded":true,"examPage":10},{"id":"vcabio2024_14","year":"2024","examName":"VCE Biology","number":"14","topic":"Photosynthesis","type":"mcq","text":"The light energy absorbed by the microalgae cells is immediately used in a significant stage of photosynthesis to split water molecules. In which part of the microalgae’s cell would you expect this process to occur?","marks":1,"options":[{"label":"A","text":"grana"},{"label":"B","text":"stroma"},{"label":"C","text":"Golgi apparatus"},{"label":"D","text":"plasma membrane"}],"correctAnswer":"A","examinerReport":"The light-dependent stage of photosynthesis occurs at the thylakoid membrane, or grana (option A). This is the stage where reactant water molecules are split into oxygen and hydrogen ions and electrons (both collected by NADP+ to form NADPH). The stroma is where the light-independent stage occurs, which does not directly rely on light energy; therefore, option B was incorrect. Students are required to know the locations, inputs and outputs of the various stages of both photosynthesis and cellular respiration.","reportStats":{"A":77.0,"B":20.0,"C":1.0,"D":2.0},"images":[],"reportImages":[],"preloaded":true,"examPage":11},{"id":"vcabio2024_15","year":"2024","examName":"VCE Biology","number":"15","topic":"Proteins & Enzymes","type":"mcq","text":"During photosynthesis, carbon dioxide (CO2) enters chloroplasts. One method CO2 uses to enter chloroplasts is to dissolve in water. The graph below shows the solubility of CO2 as temperature increases. CO2 Key Solubility of carbon dioxide (CO2) in water solubility (grams of gas per kilogram of water) 4 3.5 3 2.5 2 1.5 1 0.5 0 0 10 20 30 40 50 60 water temperature (°C) <https://www.engineeringtoolbox.com/gases-solubility-water-d_1148.html> Based on the information provided and your knowledge of photosynthesis, which one of the following statements is correct?","marks":1,"options":[{"label":"A","text":"At 30 °C, photosynthesis and photorespiration will be taking place at equal rates."},{"label":"B","text":"Changes in water temperature will only affect the rate of light-independent reactions."},{"label":"C","text":"At a temperature of 40 °C, Rubisco will be fixing carbon at a slower rate than at 20 °C."},{"label":"D","text":"The number of oxygen molecules entering Rubisco’s active site will decrease as temperature increases."}],"correctAnswer":"C","examinerReport":"Students should know that both oxygen and carbon dioxide can bind to the active site of the Rubisco enzyme. However, as the temperature increases, carbon dioxide is less likely to bind to Rubisco. Therefore, the rate of carbon fixation is slower at 40 °C compared to 20 °C, making option C correct. Option D is incorrect because as temperature increases, the likelihood of oxygen binding to Rubisco increases, not decreases.","reportStats":{"A":5.0,"B":10.0,"C":68.0,"D":17.0},"images":[],"reportImages":[],"preloaded":true,"examPage":11},{"id":"vcabio2024_16","year":"2024","examName":"VCE Biology","number":"16","topic":"Proteins & Enzymes","type":"mcq","text":"Biomass can be used to produce bioethanol. The production of bioethanol is a process that has many steps. In this process","marks":1,"options":[{"label":"A","text":"bioethanol is the only product produced."},{"label":"B","text":"an environment free of microorganisms is required."},{"label":"C","text":"the same enzyme catalyses each step in the process."},{"label":"D","text":"the biomass could be plants containing high levels of cellulose."}],"correctAnswer":"D","examinerReport":"Bioethanol is produced by yeast and microorganisms via fermentation, which also produces carbon dioxide. Cellulose, a component of the cell wall of plants, would be a suitable source of biomass. Option C is incorrect because in biochemical pathways, different enzymes are used to catalyse each step.","reportStats":{"A":6.0,"B":8.0,"C":15.0,"D":72.0},"images":[],"reportImages":[],"preloaded":true,"examPage":11},{"id":"vcabio2025_1","year":"2025","examName":"VCE Biology","number":"1","topic":"DNA Structure & Replication","type":"mcq","text":"In an experiment investigating the effect of different temperatures on DNA structure, which one of the following is the independent variable?","marks":1,"options":[{"label":"A","text":"rate of DNA denaturation"},{"label":"B","text":"mass of DNA in the sample"},{"label":"C","text":"number of nucleotide bases in the DNA sequence"},{"label":"D","text":"temperatures at which the experiment is conducted"}],"correctAnswer":"D","examinerReport":"The independent variable is the variable that the experimenter changes.","reportStats":{"A":7.0,"B":2.0,"C":3.0,"D":87.0},"images":[],"reportImages":[],"preloaded":true,"examPage":2},{"id":"vcabio2025_2","year":"2025","examName":"VCE Biology","number":"2","topic":"Proteins & Enzymes","type":"mcq","text":"The image below shows the structure of haemoglobin. The graph below shows the effect of temperature on the activity of haemoglobin. 100 80 60 40 20 0 activity (%) 0 20 40 60 80 100 temperature (°C) Based on the graph, it can be concluded that at temperatures between","marks":1,"options":[{"label":"A","text":"0 °C and 30 °C the tertiary structure is unravelled."},{"label":"B","text":"0 °C and 30 °C the primary structure is changed."},{"label":"C","text":"30 °C and 40 °C the quaternary structure is denatured."},{"label":"D","text":"30 °C and 100 °C the secondary structure is unaffected."}],"correctAnswer":"C","examinerReport":"Haemoglobin is a protein, so its activity is affected by temperature. The graph shows that activity decreases above 30°C as the protein is denatured, which disrupts secondary, tertiary and (in the case of haemoglobin) quaternary structures.","reportStats":{"A":5.0,"B":3.0,"C":88.0,"D":4.0},"images":[],"reportImages":[],"preloaded":true,"examPage":3},{"id":"vcabio2025_3","year":"2025","examName":"VCE Biology","number":"3","topic":"Cell Biology","type":"mcq","text":"Protein X and Protein Y take different pathways to reach the plasma membrane. These two pathways are shown in the diagram below. Key Protein X Protein Y and therapeutic targets of human diseases’, Journal of Cell Science, vol. 131, 2018 The diagram demonstrates that","marks":1,"options":[{"label":"A","text":"Protein X does not reach the plasma membrane without passing through the Golgi apparatus."},{"label":"B","text":"Protein Y is secreted directly from the rough endoplasmic reticulum without any further modifications."},{"label":"C","text":"Protein Y is the only one to be packaged into a vesicle for secretion."},{"label":"D","text":"Protein X does not undergo further modifications after leaving the rough endoplasmic reticulum."}],"correctAnswer":"D","examinerReport":"In both of the protein secretory pathways shown in the diagram, proteins are packaged into vesicles before being secreted at the plasma membrane. However, the pathways differ: Protein X moves directly from the rough endoplasmic reticulum to the plasma membrane, while Protein Y moves from the rough endoplasmic reticulum to the Golgi apparatus, which is responsible for modifying proteins, before reaching the plasma membrane.","reportStats":{"A":5.0,"B":6.0,"C":9.0,"D":79.0},"images":[],"reportImages":[],"preloaded":true,"examPage":4},{"id":"vcabio2025_4","year":"2025","examName":"VCE Biology","number":"4","topic":"DNA & Gene Expression","type":"mcq","text":"The DNA triplet GCA codes for an amino acid. Which one of the following correctly identifies the corresponding tRNA anticodon for this triplet?","marks":1,"options":[{"label":"A","text":"GCT"},{"label":"B","text":"GCA"},{"label":"C","text":"CGU"},{"label":"D","text":"GCU"}],"correctAnswer":"","examinerReport":"Crop\n\nTransgenic, genetically modified or both\nJustification\nrice\n\nGenetically modified\n\nThe (OsHXK1) gene in rice has been edited without inserting a gene from a different species\nmaize\n\nBoth\nThe maize genome was edited by inserting genes from a different species (Bacillus thuringiensis) into it and all transgenic organisms are genetically modified","reportStats":{},"images":[],"reportImages":[],"preloaded":true,"examPage":4},{"id":"vcabio2025_5","year":"2025","examName":"VCE Biology","number":"5","topic":"DNA & Gene Expression","type":"mcq","text":"During protein synthesis in a eukaryotic cell, which event marks the end of transcription?","marks":1,"options":[{"label":"A","text":"All introns are removed from the pre-mRNA."},{"label":"B","text":"The ribosome reaches a stop codon on the mRNA."},{"label":"C","text":"The polypeptide chain is released from the ribosome."},{"label":"D","text":"RNA polymerase reaches a termination sequence on the DNA template."}],"correctAnswer":"D","examinerReport":"Option D is correct as RNA polymerase reaching a termination sequence on the DNA template is the last step of transcription. Option A is incorrect as the removal of introns is an event in mRNA processing (post-transcription modification). Options B and C are incorrect as these outline events in translation rather than transcription.","reportStats":{"A":14.0,"B":13.0,"C":7.0,"D":67.0},"images":[],"reportImages":[],"preloaded":true,"examPage":5},{"id":"vcabio2025_6","year":"2025","examName":"VCE Biology","number":"6","topic":"DNA & Gene Expression","type":"mcq","text":"Four different sections of DNA are described below. Section Description Q contains exons and introns, and requires splicing to form mature mRNA R a cluster of genes under the control of a single promoter, transcribed together into mRNA S has a promoter region for RNA polymerase binding and does not have introns T codes for proteins that control the expression of other genes Based on the descriptions, which option correctly labels the four sections of DNA? Prokaryotic gene Operon Eukaryotic structural gene Regulatory gene","marks":1,"options":[{"label":"A","text":"T S R Q"},{"label":"B","text":"S R T Q"},{"label":"C","text":"S R Q T"},{"label":"D","text":"R T Q S Use the following information to answer Questions 7–9. Emmanuelle Charpentier and Jennifer A Doudna won the Nobel Prize in Chemistry in 2020 for the discovery of CRISPR-Cas9 genetic scissors. The diagram below shows three different conditions that the scientists tested. Condition 1 acted as the control group, and conditions 2 and 3 were the experimental groups. Cas9 protein Cas9 protein Cas9 protein target DNA target DNA target DNA Cas9 protein + target DNA Cas9 protein + target DNA + crRNA + tracrRNA Cas9 protein + target DNA + single guide RNA tracrRNA crRNA + + + + single guide RNA + + Condition 1 Condition 2 Condition 3 tracrRNA (trans-activating CRISPR RNA) crRNA (CRISPR RNA) Key XBio: The Explorer's Guide to Biology (Explorebiology.org); licensed CC-BY 4.0"}],"correctAnswer":"C","examinerReport":"Option C is correct as section S could be any of the four sections of DNA and thus it could be part of a prokaryotic gene. Section R describes an operon, section Q belongs to a eukaryotic gene as it requires the removal of introns to form mature mRNA, and section T describes a regulatory gene.","reportStats":{"A":7.0,"B":7.0,"C":79.0,"D":7.0},"images":[],"reportImages":[],"preloaded":true,"examPage":5},{"id":"vcabio2025_7","year":"2025","examName":"VCE Biology","number":"7","topic":"General Biology","type":"mcq","text":"What is the purpose of single guide RNA?","marks":1,"options":[{"label":"A","text":"to cut the target sequence"},{"label":"B","text":"to create off-target editing"},{"label":"C","text":"to direct the cutting of DNA"},{"label":"D","text":"to repress the Cas9 protein"}],"correctAnswer":"C","examinerReport":"Single guide RNA binds to the Cas9 protein and directs the Cas9 protein to where to cut the target DNA.","reportStats":{"A":6.0,"B":3.0,"C":90.0,"D":2.0},"images":[],"reportImages":[],"preloaded":true,"examPage":6},{"id":"vcabio2025_8","year":"2025","examName":"VCE Biology","number":"8","topic":"Biotechnology","type":"mcq","text":"To view the outcomes of the three conditions, the scientists ran a gel electrophoresis. The results are shown below. 10 000 5000 3000 2000 1500 1000 500 base pairs DNA ladder Condition 1 Condition 2 Condition 3 XBio: The Explorer's Guide to Biology (Explorebiology.org); licensed CC-BY 4.0 From the results, it can be concluded that CRISPR-Cas9 was functional in","marks":1,"options":[{"label":"A","text":"conditions 1, 2 and 3."},{"label":"B","text":"conditions 2 and 3."},{"label":"C","text":"conditions 1 and 3."},{"label":"D","text":"condition 1 only."}],"correctAnswer":"B","examinerReport":"The gel electrophoresis shows only one larger fragment of DNA in condition 1, while conditions 2 and 3 each show two smaller DNA fragments, indicating that they have been cut at specific sites by CRISPR-Cas9, making option B the correct response.","reportStats":{"A":11.0,"B":80.0,"C":1.0,"D":7.0},"images":[],"reportImages":[],"preloaded":true,"examPage":7},{"id":"vcabio2025_9","year":"2025","examName":"VCE Biology","number":"9","topic":"Biotechnology","type":"mcq","text":"Which hypo e lamb’s fourth largest band did not come from the mother and is not present in father A. Fathers B and D are also not the lamb’s father as the lamb’s shortest band (bottom band) did not come from the mother and is not present in fathers B or D. Only father C contains all three bands that are present in the lamb but not present in the mother.","reportStats":{"A":5.0,"B":27.0,"C":48.0,"D":19.0},"images":[],"reportImages":[],"preloaded":true,"examPage":9},{"id":"vcabio2025_12","year":"2025","examName":"VCE Biology","number":"12","topic":"General Biology","type":"mcq","text":"Which one of the following assists in the movement of the DNA fragments through the gel once an electric current is applied to the gel?","marks":1,"options":[{"label":"A","text":"the ribose sugar"},{"label":"B","text":"the charge of the DNA molecule"},{"label":"C","text":"the number of DNA fragments"},{"label":"D","text":"the types of nitrogenous bases present"}],"correctAnswer":"B","examinerReport":"Once an electric current is applied, DNA fragments travel through the gel from the negative to the positive end because DNA fragments are negatively charged.","reportStats":{"A":3.0,"B":87.0,"C":7.0,"D":2.0},"images":[],"reportImages":[],"preloaded":true,"examPage":9},{"id":"vcabio2025_13","year":"2025","examName":"VCE Biology","number":"13","topic":"DNA & Gene Expression","type":"mcq","text":"The amplification of DNA through polymerase chain reaction includes","marks":1,"options":[{"label":"A","text":"binding of RNA polymerase to the DNA template during the extension stage."},{"label":"B","text":"heating the DNA template to 72 °C during the annealing stage."},{"label":"C","text":"attachment of DNA primers during the denaturation stage."},{"label":"D","text":"repeating the cycle many times."}],"correctAnswer":"D","examinerReport":"Students were required to recall the steps involved in the polymerase chain reaction (PCR). Option A is incorrect as it is Taq/DNA polymerase that binds to the DNA template ells have no glucose source."},{"label":"D","text":"C4 plants consistently produce more ATP from each glucose molecule compared to C3 plants."}],"correctAnswer":"B","examinerReport":"Students were required to recall that the electron transport chain yields 26 or 28 ATP molecules per molecule of glucose, making option A incorrect. Students should also recall that there is variation between theoretical and actual yields of ATP (as outlined in the Frequently asked questions), making option B correct. Option C is incorrect as while root cells may not be able to carry out photosynthesis, they do have glucose from stored glucose/starch in the plant. Option D is incorrect as while C4 plants and C3 plants have some differences in their pathways for photosynthesis, they have the same cellular respiration pathway so they would produce the same amount of ATP per molecule of glucose.","reportStats":{"A":21.0,"B":54.0,"C":15.0,"D":10.0},"images":[],"reportImages":[],"preloaded":true,"examPage":10},{"id":"vcabio2025_16","year":"2025","examName":"VCE Biology","number":"16","topic":"Biotechnology","type":"mcq","text":"Acetic acid is a by-product of some bacterial biochemical pathways. Acetic acid gives vinegar its distinctive taste. Vinegar can be made using sugar, yeast and bacteria. Which one of the following flow charts correctly summarises two of the steps in the process of making vinegar?","marks":1,"options":[{"label":"A","text":"Yeast undergoes alcoholic fermentation, producing glucose. Bacteria break down glucose in the plasmid, forming acetic acid."},{"label":"B","text":"Yeast undergoes fermentation in the cytosol, producing lactic acid. Bacteria join lactic acid together to form acetic acid anaerobically."},{"label":"C","text":"Yeast breaks down glucose to form ethanol via fermentation. Bacteria break down ethanol to produce acetic acid."},{"label":"D","text":"Yeast undergoes anaerobic cellular respiration to produce ethanol. Bacteria process ethanol and form acetic acid ynthesis). Option B is correct as a literature review would be an appropriate methodology to use to collate and analyse secondary data about the amount of NADPH produced in stage S; stage S also includes correct inputs and outputs for the light-dependent stage. Option C is incorrect as while a controlled experiment would be an appropriate methodology, glucose is an output (not an input) in photosynthesis. Option D is incorrect as while a computer model would be a suitable methodology, carbon dioxide is an input (not an output) of the light-independent stage within the stroma.","reportStats":{"A":12.0,"B":36.0,"C":42.0,"D":10.0},"images":[],"reportImages":[],"preloaded":true,"examPage":11},{"id":"vcabio2025_20","year":"2025","examName":"VCE Biology","number":"20","topic":"Photosynthesis","type":"mcq","text":"Three factors that affect the rate of photosynthesis in plants are stated below: • Factor 1 – light intensity • Factor 2 – carbon dioxide concentration • Factor 3 – temperature Scientific data consistently shows specific trends for each factor when other variables are controlled. Graphs were plotted showing the rate of photosynthesis against an increasing change in each factor. If plotted over a large range, which of the following would show graphs with the same trend?","marks":1,"options":[{"label":"A","text":"factors 1 and 2"},{"label":"B","text":"factors 1 and 3"},{"label":"C","text":"factors 2 and 3"},{"label":"D","text":"factors 1, 2 and 3"}],"correctAnswer":"A","examinerReport":"An increase in either light intensity or carbon dioxide concentration will result in the same trend, where the rate of photosynthesis will increase for a period of time and then plateau due to limiting factors, making option A correct. An increase in temperature will result in a different trend, where the rate of photosynthesis will first increase until optimum temperature is reached, then the rate of photosynthesis will decrease sharply as enzymes involved are denatured, making options B, C and D all incorrect.","reportStats":{"A":67.0,"B":19.0,"C":7.0,"D":7.0},"images":[],"reportImages":[],"preloaded":true,"examPage":12},{"id":"vcabio2025_21","year":"2025","examName":"VCE Biology","number":"21","topic":"Proteins & Enzymes","type":"mcq","text":"ATP synthase is an enzyme that is used in the formation of ATP. A competitive inhibitor to ATP synthase is introduced into a cell. The competitive inhibitor would initially","marks":1,"options":[{"label":"A","text":"bind to the active site of ATP, blocking it from binding to ATP synthase."},{"label":"B","text":"reduce the number of ADP molecules available for moving cellular energy."},{"label":"C","text":"bind to the allosteric site of ATP synthase, preventing ADP from binding."},{"label":"D","text":"cause more ADP molecules to be present in the cell. Use the following information to answer Questions 22 and 23. Mint, shown below, is a popular garden herb. The essential oils and phenolic compounds found within the cells of the mint plant protect the plant from pathogens such as bacteria, fungi, yeasts and viruses."}],"correctAnswer":"D","examinerReport":"ATP synthase is the enzyme. ATP is the product. ATP is formed from the combination of substrates ADP and Pi (inorganic phosphate). A competitive inhibitor binds to the active site of the enzyme, where the substrates bind, therefore preventing the substrates from binding. Option D is the correct option because the competitive inhibitor would not allow ADP to bind, resulting in a build-up of this within the cell. Option A is incorrect because the enzyme itself contains the active site, not the substrate or product.","reportStats":{"A":43.0,"B":9.0,"C":15.0,"D":34.0},"images":[],"reportImages":[],"preloaded":true,"examPage":12},{"id":"vcabio2025_22","year":"2025","examName":"VCE Biology","number":"22","topic":"Immune Response","type":"mcq","text":"When the essential oils and phenolic compounds are in the mint plant cells, they act as","marks":1,"options":[
