    </div>` : '';

  const aiHtml = revealed && ans?.aiFeedback ? `
    <div class="ai-result">
      <div class="ai-score-row">
        <div class="score-badge score-${ans.aiScore}">${['❌ Incorrect','⚡ Partial','✅ Mostly Correct','✅ Full Marks'][ans.aiScore]}</div>
        <span style="font-size:.8rem;color:var(--muted)">${ans.aiScore} / 3</span>
      </div>
      <div style="font-size:.86rem;line-height:1.6">${ans.aiFeedback}</div>
      ${ans.aiDiagram ? `<div style="margin-top:12px;background:white;border-radius:8px;padding:10px;overflow-x:auto">${ans.aiDiagram}</div>` : ''}
    </div>` : '';

  const shortArea = !revealed && q.type !== 'mcq' ? `
    <div style="font-size:.78rem;color:var(--muted);margin-bottom:6px;font-weight:700;letter-spacing:.04em">${q.marks} MARK${q.marks!=1?'S':''} — Write your answer below</div>
    <textarea class="short-area" id="short-ans" placeholder="Write your answer here…"></textarea>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-top:10px" id="submit-btn" onclick="submitShort('${q.id}')">Submit Answer</button>
  ` : '';

  const navBar = revealed ? `
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-ghost" style="flex:0 0 auto" onclick="learnContent('${q.id}')">🧠 Learn</button>
      ${_sessIdx > 0 ? `<button class="btn btn-ghost" style="flex:0 0 auto" onclick="prevSessionQ()">← Prev</button>` : ''}
      <button class="btn btn-primary" style="flex:1;justify-content:center;padding:12px;min-width:120px" onclick="nextSessionQ()">
        ${_sessIdx+1 < _sessPool.length ? 'Next →' : 'See Results 🎉'}
      </button>
    </div>` : `
    ${_sessIdx > 0 ? `<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" onclick="prevSessionQ()">← Back to previous question</button></div>` : ''}
  `;

  // Exam page image — pre-rendered, no PDF loading needed
  const subjectSlug = 'chemistry';
  const examPageImg = q.examPage ? `
    <div style="margin-bottom:16px">
      <div style="font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:6px">
        📄 ${q.year} EXAM — PAGE ${q.examPage}
        <button onclick="toggleExamPage('${q.id}')" style="background:none;border:none;cursor:pointer;font-size:.7rem;color:var(--accent);padding:0;font-weight:700" id="expg-toggle-${q.id}">hide</button>
      </div>
      <div id="expg-${q.id}">
        <img src="exam-images/${subjectSlug}/${q.year}/p${q.examPage}.jpg"
          style="max-width:100%;border-radius:8px;border:1px solid var(--border);display:block"
          onerror="this.parentElement.innerHTML='<div style=\\'font-size:.78rem;color:var(--muted);padding:8px\\'>📄 Exam page image not available</div>'"
        >
      </div>
    </div>` : '';

  return `
    <div class="q-label">
      <span class="q-num">${q.number||'Q?'}</span>
      ${qTypeTag(q.type)}
      ${q.marks?`<span class="pill">${q.marks} mark${q.marks!=1?'s':''}</span>`:''}
      ${q.topic?`<span style="font-size:.75rem;color:var(--muted)">${q.topic}</span>`:''}
    </div>
    ${examPageImg}
    <div class="q-text">${q.text}</div>
    ${q.images?.filter(Boolean).map(img=>`<img src="${img}" style="max-width:100%;border-radius:8px;margin-bottom:12px;display:block">`).join('')||''}
    ${optHtml}
    ${shortArea}
    ${reportHtml}
    ${aiHtml}
    ${navBar}`;
}

function toggleExamPage(qid) {
  const el = document.getElementById('expg-'+qid);
  const btn = document.getElementById('expg-toggle-'+qid);
  if (!el || !btn) return;
  const hidden = el.style.display === 'none';
  el.style.display = hidden ? 'block' : 'none';
  btn.textContent = hidden ? 'hide' : 'show';
}

function chooseMCQ(qid, choice) {
  const q = _sessPool.find(x=>x.id===qid); if(!q) return;
  const correct = q.correctAnswer ? choice===q.correctAnswer : null;
  _sess.answers[qid] = {choice, correct, ts:Date.now()};
  save();
  document.getElementById('sess-body').innerHTML = renderQView(q, true);
}

async function submitShort(qid) {
  const q = _sessPool.find(x=>x.id===qid); if(!q) return;
  const ans = document.getElementById('short-ans')?.value?.trim();
  if (!ans) { toast('❌ Write an answer first'); return; }
  const btn = document.getElementById('submit-btn');
  if (btn) { btn.textContent='Grading…'; btn.disabled=true; }
  _sess.answers[qid] = {text:ans, aiScore:null, aiFeedback:null, ts:Date.now()};

  try {
    const reportCtx = q.examinerReport ? `\n\nEXAMINER'S REPORT FOR THIS QUESTION:\n${q.examinerReport}` : '';
    // Detect if question involves drawing/diagrams
    const needsDiagram = /draw|diagram|sketch|label|annotate|graph|table|flowchart|cycle|pathway|structure/i.test(q.text);
    const diagramInstruction = needsDiagram
      ? ' If a diagram, labelled structure, cycle, graph, or flowchart would help illustrate the correct answer, include one as valid inline SVG in the "diagram" field (viewBox="0 0 500 350", white bg, clear labels, biology-accurate). Otherwise set "diagram":null.'
      : ' Set "diagram":null.';
    const feedback = await callAI(
      'You are a strict VCE Chemistry exam marker. Grade the student answer and return ONLY valid JSON (no markdown). Score: 0=incorrect/irrelevant, 1=partially correct, 2=mostly correct minor gaps, 3=full marks.' + diagramInstruction,
      [{role:'user',content:`QUESTION: ${q.text}\nMARKS: ${q.marks}${reportCtx}\n\nSTUDENT ANSWER: ${ans}\n\nReturn ONLY JSON: {"score":0,"feedback":"Detailed feedback explaining what was missing and what a full-marks answer needs, referencing the examiner report where available.","diagram":null}`}]
    );
    const parsed = JSON.parse(feedback.replace(/```json|```/g,''));
    _sess.answers[qid].aiScore = Math.min(3,Math.max(0,parsed.score));
    _sess.answers[qid].aiFeedback = parsed.feedback||'';
    _sess.answers[qid].aiDiagram = parsed.diagram||null;
  } catch(e) {
    _sess.answers[qid].aiScore = -1;
    _sess.answers[qid].aiFeedback = 'Could not grade — check your API key.';
    _sess.answers[qid].aiDiagram = null;
  }
  save();
  document.getElementById('sess-body').innerHTML = renderQView(q, true);
}

function nextSessionQ() {
  if (_sessIdx + 1 >= _sessPool.length) { endSession(); return; }
  _sessIdx++;
  showSessionQ();
}

function prevSessionQ() {
  if (_sessIdx > 0) { _sessIdx--; showSessionQ(); }
}

function endSession() {
  _sess.completedAt = Date.now();
  save();
  showResults();
}

function showResults() {
  const ol = document.getElementById('session-overlay');
  const qs = _sessPool;
  const ans = _sess.answers;
  let correct=0, total=0;
  qs.forEach(q=>{
    const a = ans[q.id];
    if(!a) return;
    total++;
    if(a.correct||a.aiScore>=2) correct++;
  });

  const pct = total ? Math.round(correct/total*100) : 0;
  const color = pct>=70?'var(--correct)':pct>=50?'var(--partial)':'var(--wrong)';

  ol.innerHTML = `
    <div class="sess-topbar">
      <button class="btn btn-ghost btn-sm" onclick="exitSession()">← Back</button>
      <div style="font-weight:800;font-size:.95rem;flex:1;text-align:center">Results</div>
      <div style="width:80px"></div>
    </div>
    <div class="sess-body">
      <div style="text-align:center;margin-bottom:28px">
        <div style="font-size:3.5rem;font-weight:900;letter-spacing:-.06em;color:${color}">${pct}%</div>
        <div style="color:var(--muted);margin-top:4px;font-size:.88rem">${correct} of ${total} answered correctly</div>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        ${qs.map(q=>{
          const a = ans[q.id];
          const correct = a?.correct||a?.aiScore>=2;
          const partial = a?.aiScore===1;
          const dotColor = !a?'var(--muted)':correct?'var(--correct)':partial?'var(--partial)':'var(--wrong)';
          return `<div class="result-q-row">
            <div class="result-dot" style="background:${dotColor}"></div>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
                <span class="q-num">${q.number}</span>
                ${q.topic?`<span style="font-size:.75rem;color:var(--muted)">${q.topic}</span>`:''}
                ${q.marks?`<span class="pill">${q.marks}m</span>`:''}
              </div>
              <div style="font-size:.83rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:480px">${q.text.slice(0,100)}</div>
              ${a?.aiFeedback?`<div style="font-size:.78rem;color:var(--muted);margin-top:3px;line-height:1.4">${a.aiFeedback.slice(0,120)}…</div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="exitSession()">Done</button>
        <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="retrySession()">Retry ↺</button>
      </div>
    </div>`;
}

function retrySession() {
  const newSess = {
    id:uid(), mode:_sess.mode, filters:_sess.filters,
    qIds:[..._sess.qIds], answers:{},
    startedAt:Date.now(), completedAt:null
  };
  S.sessions.push(newSess); save();
  const pool = newSess.qIds.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean);
  runSession(newSess, pool);
}

function exitSession() {
  document.getElementById('session-overlay').classList.add('hidden');
  nav(curView);
}

// ══════════════════════════════════════════
// HISTORY
// ══════════════════════════════════════════
function renderHistory() {
  const pc = document.getElementById('page-content');
  const done = S.sessions.filter(s=>s.completedAt).reverse();
  if (!done.length) { pc.innerHTML=`<div class="empty"><div class="emi">📈</div>No sessions yet — start practising!</div>`; return; }

  pc.innerHTML = `<div class="card" style="padding:0;overflow:hidden">
    ${done.map(s=>{
      const qs = s.qIds?.length||0;
      const ans = Object.values(s.answers||{});
      const correct = ans.filter(a=>a.correct||a.aiScore>=2).length;
      const pct = ans.length ? Math.round(correct/ans.length*100) : null;
      const color = pct==null?'var(--muted)':pct>=70?'var(--correct)':pct>=50?'var(--partial)':'var(--wrong)';
      return `<div style="display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)">
        <div style="flex:1">
          <div style="font-weight:700;font-size:.9rem">${modeLabel(s.mode)}</div>
          <div style="font-size:.78rem;color:var(--muted);margin-top:2px">
            ${fmtDate(s.startedAt)} · ${qs} questions
            ${s.filters?.topic?` · ${s.filters.topic}`:''}
            ${s.filters?.marks?` · ${s.filters.marks}m`:''}
            ${s.filters?.year?` · ${s.filters.year}`:''}
          </div>
        </div>
        <div style="font-size:1.1rem;font-weight:800;color:${color}">${pct!=null?pct+'%':'—'}</div>
      </div>`;
    }).join('')}
  </div>`;
}


// ══════════════════════════════════════════
// LEARN CONTENT (AI concept explanation)
// ══════════════════════════════════════════
async function learnContent(qid) {
  const q = S.questions.find(x=>x.id===qid); if(!q) return;
  if (!S.settings.apiKey) { toast('❌ Add an API key in Settings to use Learn Content'); return; }

  openModal(`
    <div class="modal-title">🧠 Learn the Content</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span class="q-num">${q.number}</span>
      <span class="pill">${q.topic||'Biology'}</span>
      ${q.year?`<span class="pill">${q.year}</span>`:''}
    </div>
    <div style="font-size:.88rem;color:var(--muted);margin-bottom:16px;line-height:1.5">${q.text.slice(0,200)}${q.text.length>200?'…':''}</div>
    <div id="learn-body" style="text-align:center;padding:20px">
      <div class="spin" style="font-size:1.8rem">🧬</div>
      <div style="color:var(--muted);margin-top:10px;font-size:.85rem">Generating explanation…</div>
    </div>
    <div class="mactions" style="margin-top:0">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>`);

  try {
    const reportCtx = q.examinerReport ? `

EXAMINER'S REPORT: ${q.examinerReport}` : '';
    const correctCtx = q.correctAnswer ? `

CORRECT ANSWER: ${q.correctAnswer}` : '';
    const needsDiagram = /draw|diagram|sketch|label|annotate|graph|table|flowchart|cycle|pathway|structure|process|stage|phase/i.test(q.text + (q.topic||''));
    const raw = await callAI(
      'You are a VCE Chemistry teacher. Return ONLY valid JSON (no markdown). Explain the biological concept tested by this question.' + (needsDiagram ? ' Also produce a clear, accurate inline SVG diagram (viewBox="0 0 520 360", white background, labelled, biology-accurate) illustrating the key concept — put it in the "diagram" field. If no diagram adds value, set "diagram":null.' : ' Set "diagram":null.'),
      [{role:'user', content: 'QUESTION: '+q.text+correctCtx+reportCtx+'\n\nReturn ONLY JSON: {"concept":"What biological topic this tests","facts":["fact1","fact2","fact3"],"struggles":"Common mistakes","tip":"Exam approach tip","diagram":null}'}]
    );
    let parsed2 = {};
    try { parsed2 = JSON.parse(raw.replace(/```json|```/g,'')); } catch(e) { parsed2 = {concept:'', facts:[], struggles:'', tip:'', diagram:null}; }
    const text = `**The Core Concept**\n${parsed2.concept||''}\n\n**Key Facts to Know**\n${(parsed2.facts||[]).map(f=>'- '+f).join('\n')}\n\n**Why Students Struggle**\n${parsed2.struggles||''}\n\n**Exam Tip**\n${parsed2.tip||''}`;
    const diagramSvg = parsed2.diagram||null;

    const el = document.getElementById('learn-body');
    if (!el) return;
    // Convert markdown-like formatting to HTML
    const formatted = text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^- (.+)/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\s*)+/gs, m => '<ul style="padding-left:18px;margin:6px 0">'+m+'</ul>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    el.innerHTML = '<div style="text-align:left;font-size:.88rem;line-height:1.7;color:var(--text)"><p>'+formatted+'</p></div>'
      + (diagramSvg ? '<div style="margin-top:14px;background:white;border-radius:10px;padding:12px;overflow-x:auto;border:1px solid var(--border)"><div style="font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;text-transform:uppercase">📊 Concept Diagram</div>'+diagramSvg+'</div>' : '');
  } catch(e) {
    const el = document.getElementById('learn-body');
    if (el) el.innerHTML = '<div style="color:var(--wrong);font-size:.85rem">Could not load explanation: '+e.message+'</div>';
  }
}

// ══════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════
function openSettings() {
  openModal(`
    <div class="modal-title">⚙️ Settings</div>
    <div class="fg"><label class="fl">Subject Name</label>
      <input class="fi" id="set-subj" value="${S.subject||''}"></div>
    <div class="fg"><label class="fl">Anthropic API Key</label>
      <input class="fi" id="set-key" type="password" value="${S.settings.apiKey||''}" placeholder="sk-ant-…"></div>
    <div class="fg"><label class="fl">Theme</label>
      <select class="fi" id="set-theme">
        <option value="">System default</option>
        <option value="dark" ${S.settings.dark===true?'selected':''}>Dark</option>
        <option value="light" ${S.settings.dark===false?'selected':''}>Light</option>
      </select></div>
    <hr class="divider">
    <div style="font-size:.82rem;color:var(--wrong);cursor:pointer;font-weight:600" onclick="resetAll()">⚠️ Reset all data (clears everything)</div>
    <div class="mactions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>`);
}

function saveSettings() {
  S.subject = document.getElementById('set-subj').value.trim()||S.subject;
  S.settings.apiKey = document.getElementById('set-key').value.trim();
  const th = document.getElementById('set-theme').value;
  S.settings.dark = th===''?null:th==='dark';
  if(th==='dark') document.documentElement.setAttribute('data-theme','dark');
  else if(th==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('sb-subject-lbl').textContent = S.subject.toUpperCase();
  document.title = S.subject + ' — Exam Practice';
  save(); closeModal(); toast('✅ Settings saved');
}

function resetAll() {
  if (!confirm('Delete ALL questions, sessions, and settings? This cannot be undone.')) return;
  localStorage.removeItem(STORE_KEY);
  location.reload();
}
</script>

</html>
