s image-based. See examiner report below for context.\n\nExaminer notes: Any valid semi-structural representation of pentan-1-ol. Typical examples of acceptable forms are:\nCH3CH2CH2CH2CH2OH   or   CH3(CH2)4OH   or   CH3(CH2)3CH2OH\nStudents should be aware that a representation such as ‘OHCH2CH2CH2CH2CH3’ is an incorrect representation of a terminal hydroxyl group.","marks":1,"topic":"Organic Chemistry","examinerReport":"Any valid semi-structural representation of pentan-1-ol. Typical examples of acceptable forms are:\nCH3CH2CH2CH2CH2OH   or   CH3(CH2)4OH   or   CH3(CH2)3CH2OH\nStudents should be aware that a representation such as ‘OHCH2CH2CH2CH2CH3’ is an incorrect representation of a terminal hydroxyl group.","answer":"","examPage":18},{"id":"60475b82","year":2024,"subject":"VCE Chemistry","section":"B","number":"2c","type":"short","text":"[2024 VCE Chemistry Section B – Question 2c]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Either propan-1-ol or 1-propanol were acceptable responses. Both of these follow IUPAC nomenclature conventions.","marks":1,"topic":"Organic Chemistry","examinerReport":"Either propan-1-ol or 1-propanol were acceptable responses. Both of these follow IUPAC nomenclature conventions.","answer":"","examPage":18},{"id":"19c6d5c9","year":2024,"subject":"VCE Chemistry","section":"B","number":"2di","type":"short","text":"[2024 VCE Chemistry Section B – Question 2di]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Any of the following qualitative tests were accepted for the first mark.\nThe second mark was associated with the correct observation applicable to the test chosen.\nTest\nObservation\npH test using a pH meter\npH would be shown as less than 7\npH testing using an indicator / pH paper*\nCorrect colour obse","marks":2,"topic":"Acids and Bases","examinerReport":"Any of the following qualitative tests were accepted for the first mark.\nThe second mark was associated with the correct observation applicable to the test chosen.\nTest\nObservation\npH test using a pH meter\npH would be shown as less than 7\npH testing using an indicator / pH paper*\nCorrect colour observation stated\nAdding any metal carbonate (carbonate test)\nBubbles forming\nAdding an alcohol and sulfuric acid (esterification)\nDistinct smell being formed**\nAdding a group 2 metal***\nBubbles forming\nIR spectroscopy\nBoth the O-H bond at 2500–3500 cm−1 and the C=O at around 1800 cm−1\n* The indicator must be able to undergo a distinct colour change at a pH less than 7.** Normally the smell is described as ‘sweet’ or ‘fruity’, but any ‘smell’ was accepted as a significant number of students would have manufactured biodiesel as part of their laboratory work and biodiesels do not have this type of ‘fruity’ smell.*** Group 1 metals were not accepted as these produce gas if any labile hydrogen is present, and therefore cannot be used to identify the compound specifically as a carboxylic acid.\nIncorrect responses such as ‘limewater test’ could not be awarded marks as this tests the product of the reaction between a carboxylic acid and a metal carbonate, not the carboxylic acid itself. The addition of an acid to limewater produces a salt and water, which cannot be observed.\nIn order to gain these marks for the limewater test, the student needed to indicate that the unknown organic compound had to be reacted with a metal carbonate first, and the gas produced then tested using the limewater test to confirm the presence of carbon dioxide being evolved.","answer":"","examPage":18},{"id":"6e564820","year":2024,"subject":"VCE Chemistry","section":"B","number":"2dii","type":"short","text":"[2024 VCE Chemistry Section B – Question 2dii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: A clear skeletal diagram was required as represented below.\nThe only significant issue that arose from this question related to the fact that some students did not use the box provided on page 14 (as specified in the question) and instead provided their response in the blank space at the bottom of p","marks":2,"topic":"General Chemistry","examinerReport":"A clear skeletal diagram was required as represented below.\nThe only significant issue that arose from this question related to the fact that some students did not use the box provided on page 14 (as specified in the question) and instead provided their response in the blank space at the bottom of page 15. Students are reminded to provide responses in the correct location on the examination.","answer":"","examPage":18},{"id":"fbca32f0","year":2024,"subject":"VCE Chemistry","section":"B","number":"3a","type":"short","text":"[2024 VCE Chemistry Section B – Question 3a]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Students needed to calculate the correct value for the energy released, with units.\nEnergy released: 9.5 × 17 + 3.4 × 3.7 + 47.3 × 16 = 1044 kJ or 1.0 × 103 kJ","marks":1,"topic":"General Chemistry","examinerReport":"Students needed to calculate the correct value for the energy released, with units.\nEnergy released: 9.5 × 17 + 3.4 × 3.7 + 47.3 × 16 = 1044 kJ or 1.0 × 103 kJ","answer":"","examPage":20},{"id":"6e10f35d","year":2024,"subject":"VCE Chemistry","section":"B","number":"3bi","type":"short","text":"[2024 VCE Chemistry Section B – Question 3bi]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Peptide bond/link or amide bond/link","marks":1,"topic":"General Chemistry","examinerReport":"Peptide bond/link or amide bond/link","answer":"","examPage":20},{"id":"9e0fa281","year":2024,"subject":"VCE Chemistry","section":"B","number":"3bii","type":"short","text":"[2024 VCE Chemistry Section B – Question 3bii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The reaction type is a condensation reaction.","marks":1,"topic":"General Chemistry","examinerReport":"The reaction type is a condensation reaction.","answer":"","examPage":20},{"id":"4207cd27","year":2024,"subject":"VCE Chemistry","section":"B","number":"3biii","type":"short","text":"[2024 VCE Chemistry Section B – Question 3biii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Either of leucine or serine was accepted.\nMany students were unable to successfully identify either of these compounds.","marks":1,"topic":"General Chemistry","examinerReport":"Either of leucine or serine was accepted.\nMany students were unable to successfully identify either of these compounds.","answer":"","examPage":20},{"id":"3cf4cf8e","year":2024,"subject":"VCE Chemistry","section":"B","number":"3ci","type":"short","text":"[2024 VCE Chemistry Section B – Question 3ci]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Students needed to identify that oleic acid has just one C=C present in its structure, and that stearic acid does not have a C=C. This response could also have been represented by stating that oleic acid had two fewer hydrogens present in its structure compared with stearic acid.\nStudents needed to ","marks":1,"topic":"Acids and Bases","examinerReport":"Students needed to identify that oleic acid has just one C=C present in its structure, and that stearic acid does not have a C=C. This response could also have been represented by stating that oleic acid had two fewer hydrogens present in its structure compared with stearic acid.\nStudents needed to be careful and not state that stearic had ‘no double bonds’, as this could not be accepted.\nWhen asked to identify a difference, a direct comparison of the two compounds is usually required. It was insufficient to provide a response such as ‘Oleic acid has one C=C double bond’ as this did not indicate whether the stearic has no C=C bonds or has multiple C=C bonds.","answer":"","examPage":20},{"id":"77b7cd5f","year":2024,"subject":"VCE Chemistry","section":"B","number":"3cii","type":"short","text":"[2024 VCE Chemistry Section B – Question 3cii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Either of the following equations was accepted:\nC18H34O2 + 25½O2  18CO2 + 17H2O\n2C18H34O2 + 51O2  36CO2 + 34H2O\nThe first mark was awarded for the correct identification of reactants and products.\nThe second mark was awarded for correct balancing of the equation.","marks":2,"topic":"General Chemistry","examinerReport":"Either of the following equations was accepted:\nC18H34O2 + 25½O2  18CO2 + 17H2O\n2C18H34O2 + 51O2  36CO2 + 34H2O\nThe first mark was awarded for the correct identification of reactants and products.\nThe second mark was awarded for correct balancing of the equation.","answer":"","examPage":20},{"id":"ca11b7bf","year":2024,"subject":"VCE Chemistry","section":"B","number":"3ciii","type":"short","text":"[2024 VCE Chemistry Section B – Question 3ciii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for correctly identifying two bond types that differed in the structures of oleic acid and stearic acids and then using the data provided in the Data Book to predict the greatest enthalpy change.\nThe second mark was awarded to students who correctly identified an extra bon","marks":2,"topic":"Acids and Bases","examinerReport":"The first mark was awarded for correctly identifying two bond types that differed in the structures of oleic acid and stearic acids and then using the data provided in the Data Book to predict the greatest enthalpy change.\nThe second mark was awarded to students who correctly identified an extra bond type that enhanced their prediction.\nIt was common to see responses gain the first mark for the comparison of data for the C=C (614 kJ) associated with oleic acid and either the C-C (346 kJ) or the C-H (414 kJ) of stearic acid. The second mark was harder to obtain as fewer responses demonstrated that ½(O=O) or 2(O-H) were also involved in the enthalpy change.","answer":"","examPage":20},{"id":"974c257d","year":2024,"subject":"VCE Chemistry","section":"B","number":"4a","type":"short","text":"[2024 VCE Chemistry Section B – Question 4a]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The correct response required by students was:\nHowever, given the nature of this question being novel, and the lack of familiarity of students with this expression, a correct representation of the relevant product and reactant concentrations was also accepted for this examination.","marks":1,"topic":"Quantitative Chemistry","examinerReport":"The correct response required by students was:\nHowever, given the nature of this question being novel, and the lack of familiarity of students with this expression, a correct representation of the relevant product and reactant concentrations was also accepted for this examination.","answer":"","examPage":22},{"id":"e98e06ed","year":2024,"subject":"VCE Chemistry","section":"B","number":"4b","type":"short","text":"[2024 VCE Chemistry Section B – Question 4b]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Students needed to calculate the correct value for the partial pressure.\ntherefore PNH3 = 0.696 kPa\nThis question was not well answered, even when the correct representation was used.","marks":1,"topic":"General Chemistry","examinerReport":"Students needed to calculate the correct value for the partial pressure.\ntherefore PNH3 = 0.696 kPa\nThis question was not well answered, even when the correct representation was used.","answer":"","examPage":22},{"id":"4fa2c52e","year":2024,"subject":"VCE Chemistry","section":"B","number":"4c","type":"short","text":"[2024 VCE Chemistry Section B – Question 4c]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for any one of the following three valid stresses that caused Q  K:\nremoval of product / addition of reactant / reduction in volume (increase in all partial pressures).\nThe second mark was awarded for the correct identification of the forward shift in the equilibrium.\nThe ","marks":3,"topic":"Chemical Equilibrium","examinerReport":"The first mark was awarded for any one of the following three valid stresses that caused Q  K:\nremoval of product / addition of reactant / reduction in volume (increase in all partial pressures).\nThe second mark was awarded for the correct identification of the forward shift in the equilibrium.\nThe third mark was awarded for a description of how this shift applied to either:\nthe partial changes in quantities associated with the stress\nrestoring the equilibrium so that Q = K.\nSome responses did not gain full marks as they failed to provide sufficiently specific responses that linked directly to the stress they had selected.\nAttempts to provide a response based on temperature change could not be accepted as the stem of the question emphasised that the process occurred at a constant temperature. Students are reminded to fully read the stem of each question.","answer":"","examPage":22},{"id":"2729bf6e","year":2024,"subject":"VCE Chemistry","section":"B","number":"4d","type":"short","text":"[2024 VCE Chemistry Section B – Question 4d]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for a clear identification of what the term ‘conflict’ related to in terms of the optimal rate and temperature when ammonia is being produced. A good example showing detailed understanding of this conflict could have been:\nDue to the exothermic nature of the equilibrium, a","marks":3,"topic":"Chemical Equilibrium","examinerReport":"The first mark was awarded for a clear identification of what the term ‘conflict’ related to in terms of the optimal rate and temperature when ammonia is being produced. A good example showing detailed understanding of this conflict could have been:\nDue to the exothermic nature of the equilibrium, at high temperature the rate of formation of ammonia is high but the yield will be low, whereas at low temperature the rate of formation of ammonia is too slow but the yield is very high.\nThe second mark was awarded for a clear statement that linked the presence of the catalyst to allowing a sufficiently fast rate to be occurring at a lower temperature, and hence reducing energy requirements.\nThe third mark was awarded for a clear statement that linked the lower temperature requirements with the green chemistry principle of ‘catalysis’, which states that ‘Catalysts … using less energy and reagents in reaction processes/pathways’. Therefore, a student needed to show reasoning for this choice based on linking the lower temperature to this concept.\nMost responses effectively linked the green chemistry principle to this issue, but often did not fully identify the ‘conflict’ that was asked for in the stem of the question.","answer":"","examPage":22},{"id":"df830f0a","year":2024,"subject":"VCE Chemistry","section":"B","number":"5ai","type":"short","text":"[2024 VCE Chemistry Section B – Question 5ai]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for the correct calculation of the mole of butane:\nn(C4H10) = 0.580 / 58 = 0.010 mol\nThe second mark was awarded for calculating the correct quantity of energy released, with units:\nE = 0.010 × 2880 = 28.8 kJ","marks":2,"topic":"Quantitative Chemistry","examinerReport":"The first mark was awarded for the correct calculation of the mole of butane:\nn(C4H10) = 0.580 / 58 = 0.010 mol\nThe second mark was awarded for calculating the correct quantity of energy released, with units:\nE = 0.010 × 2880 = 28.8 kJ","answer":"","examPage":26},{"id":"f08c37e5","year":2024,"subject":"VCE Chemistry","section":"B","number":"5aii","type":"short","text":"[2024 VCE Chemistry Section B – Question 5aii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The mark was awarded for the correct calculation of the energy change of the water, with units:\nE = 100 × 4.18 × 35.6 = 14.9 kJ\nIt was concerning to see some responses using the density of water, 0.997, in these calculations as, even if it was relevant, this was only applicable in the previous study","marks":1,"topic":"General Chemistry","examinerReport":"The mark was awarded for the correct calculation of the energy change of the water, with units:\nE = 100 × 4.18 × 35.6 = 14.9 kJ\nIt was concerning to see some responses using the density of water, 0.997, in these calculations as, even if it was relevant, this was only applicable in the previous study design and Data Book.","answer":"","examPage":26},{"id":"243d1dfc","year":2024,"subject":"VCE Chemistry","section":"B","number":"5aiii","type":"short","text":"[2024 VCE Chemistry Section B – Question 5aiii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for the correct calculation of the % energy efficiency.\nThe second mark was awarded for the value being quoted to three significant figures.\n% Efficiency = 100 × 14.9 / 28.8 = 51.7%","marks":2,"topic":"General Chemistry","examinerReport":"The first mark was awarded for the correct calculation of the % energy efficiency.\nThe second mark was awarded for the value being quoted to three significant figures.\n% Efficiency = 100 × 14.9 / 28.8 = 51.7%","answer":"","examPage":26},{"id":"e0f7ac73","year":2024,"subject":"VCE Chemistry","section":"B","number":"5bi","type":"short","text":"[2024 VCE Chemistry Section B – Question 5bi]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for the response demonstrating that a solution calorimeter needs to be calculated because energy is needed to heat the water and it is needed to heat the internal components of the calorimeter; that is, energy from the reaction is not solely transferred to the water (hence","marks":2,"topic":"Thermochemistry","examinerReport":"The first mark was awarded for the response demonstrating that a solution calorimeter needs to be calculated because energy is needed to heat the water and it is needed to heat the internal components of the calorimeter; that is, energy from the reaction is not solely transferred to the water (hence why q = mC∆T cannot be used).\nThe second mark was awarded for understanding that, without this calibration factor, we cannot use the change in temperature of an unknown reaction to determine an accurate value for the enthalpy change. Without calibration, the enthalpy value obtained will always be less than the true value for a given calorimeter using a fixed quantity of solution.","answer":"","examPage":26},{"id":"e6c50eaf","year":2024,"subject":"VCE Chemistry","section":"B","number":"5bii","type":"short","text":"[2024 VCE Chemistry Section B – Question 5bii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for the correct calculation of energy released, with units:\nenergy released(based in limiting reagent) = 0.048 × 24.5 = 1.176 kJ or 1176 J\nThe second mark was awarded for the correct change in temperature:\nchange in temperature = 1176 / 470 = 2.5 °C\nThe third mark was awar","marks":3,"topic":"Acids and Bases","examinerReport":"The first mark was awarded for the correct calculation of energy released, with units:\nenergy released(based in limiting reagent) = 0.048 × 24.5 = 1.176 kJ or 1176 J\nThe second mark was awarded for the correct change in temperature:\nchange in temperature = 1176 / 470 = 2.5 °C\nThe third mark was awarded for the correct final temperature:\nmaximum temperature reached = 25.0 + 2.5 = 27.5 °C\nErrors occurred when:\nthe stoichiometry was not taken into account when determining the energy released\nthere was no consideration of the units of the energy and the calibration factor\nresponses determined a negative energy released and subtracted the temperature change.","answer":"","examPage":26},{"id":"6ac80db4","year":2024,"subject":"VCE Chemistry","section":"B","number":"5biii","type":"short","text":"[2024 VCE Chemistry Section B – Question 5biii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Any of the following were valid responses:\nThe concentration of KI in the stock solution was higher than 0.960 M.\nThe amount of KI added to the calorimeter was too high.\nThe total volume of solution in the calorimeter was lower than that used to calibrate it.\nThe calorimeter’s calibration factor was","marks":1,"topic":"Reaction Kinetics","examinerReport":"Any of the following were valid responses:\nThe concentration of KI in the stock solution was higher than 0.960 M.\nThe amount of KI added to the calorimeter was too high.\nThe total volume of solution in the calorimeter was lower than that used to calibrate it.\nThe calorimeter’s calibration factor was smaller than the true value.\nThis question was not well answered.","answer":"","examPage":26},{"id":"e2ace000","year":2024,"subject":"VCE Chemistry","section":"B","number":"6a","type":"short","text":"[2024 VCE Chemistry Section B – Question 6a]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: To gain the mark, the response needed to clearly identify the bond type as O-H and state that it was due to an ‘alcohol’ as shown in the Data Book (i.e. O-H (alcohol)).","marks":1,"topic":"Organic Chemistry","examinerReport":"To gain the mark, the response needed to clearly identify the bond type as O-H and state that it was due to an ‘alcohol’ as shown in the Data Book (i.e. O-H (alcohol)).","answer":"","examPage":30},{"id":"356cada6","year":2024,"subject":"VCE Chemistry","section":"B","number":"6bi","type":"short","text":"[2024 VCE Chemistry Section B – Question 6bi]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: m/z = 56\nStudents should avoid attempting to use ‘m/z’ as a unit (for example, ‘56 m/z’).","marks":1,"topic":"General Chemistry","examinerReport":"m/z = 56\nStudents should avoid attempting to use ‘m/z’ as a unit (for example, ‘56 m/z’).","answer":"","examPage":30},{"id":"57d0674c","year":2024,"subject":"VCE Chemistry","section":"B","number":"6bii","type":"short","text":"[2024 VCE Chemistry Section B – Question 6bii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Either of the following representations were accepted:\n[ C4H9O ]+ or [ (CH3)2CCH2OH ]+","marks":1,"topic":"General Chemistry","examinerReport":"Either of the following representations were accepted:\n[ C4H9O ]+ or [ (CH3)2CCH2OH ]+","answer":"","examPage":30},{"id":"e47579cc","year":2024,"subject":"VCE Chemistry","section":"B","number":"6c","type":"short","text":"[2024 VCE Chemistry Section B – Question 6c]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: One mark was awarded for recognising that the compound had only four carbon environments.\nOne mark was awarded for recognising that the compound must have two carbons in the same environment.\nThe third mark could be obtained from any one of the following:\na statement that Compound X has a side chain","marks":3,"topic":"General Chemistry","examinerReport":"One mark was awarded for recognising that the compound had only four carbon environments.\nOne mark was awarded for recognising that the compound must have two carbons in the same environment.\nThe third mark could be obtained from any one of the following:\na statement that Compound X has a side chain/branch or is a non-linear molecule\na statement that Compound X has a point of symmetry\nany reference to one of the specific peaks located on the spectra being matched to a particular carbon type and chemical shift from item 23 of the Data Book.","answer":"","examPage":30},{"id":"d74b5a99","year":2024,"subject":"VCE Chemistry","section":"B","number":"6di","type":"short","text":"[2024 VCE Chemistry Section B – Question 6di]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The integration curve is a representation of the area of a signal for a hydrogen environment or a ‘peak area’.\nThis question was not well answered, and often responses to Question 6d.ii were repeat answers. Careful reading of the question was needed to understand the correct terminology that applied","marks":1,"topic":"Analytical Chemistry","examinerReport":"The integration curve is a representation of the area of a signal for a hydrogen environment or a ‘peak area’.\nThis question was not well answered, and often responses to Question 6d.ii were repeat answers. Careful reading of the question was needed to understand the correct terminology that applied to each of these two questions.","answer":"","examPage":30},{"id":"ed69daa4","year":2024,"subject":"VCE Chemistry","section":"B","number":"6dii","type":"short","text":"[2024 VCE Chemistry Section B – Question 6dii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The relative size of an integration curve is proportional to the ratio or the relative number of hydrogens present in that hydrogen environment.","marks":1,"topic":"Analytical Chemistry","examinerReport":"The relative size of an integration curve is proportional to the ratio or the relative number of hydrogens present in that hydrogen environment.","answer":"","examPage":30},{"id":"85bdc734","year":2024,"subject":"VCE Chemistry","section":"B","number":"6diii","type":"short","text":"[2024 VCE Chemistry Section B – Question 6diii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The relative size of an integration curve shown in the table indicates that the ratio of hydrogens present in each of the compound’s four hydrogen environments are 1:2:2:6.\nThis question was not well answered, and often responses did not relate understanding of these integration curves back to the s","marks":1,"topic":"Analytical Chemistry","examinerReport":"The relative size of an integration curve shown in the table indicates that the ratio of hydrogens present in each of the compound’s four hydrogen environments are 1:2:2:6.\nThis question was not well answered, and often responses did not relate understanding of these integration curves back to the structure of Compound X.","answer":"","examPage":30},{"id":"4d52ac49","year":2024,"subject":"VCE Chemistry","section":"B","number":"6div","type":"short","text":"[2024 VCE Chemistry Section B – Question 6div]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for understanding that the peak at 0.96 suggests that an R-CH3 group is present.\nThe second mark was awarded for linking the information from Question 6d.iii and stating that therefore there must be two R-CH3 groups present in Compound X.","marks":2,"topic":"General Chemistry","examinerReport":"The first mark was awarded for understanding that the peak at 0.96 suggests that an R-CH3 group is present.\nThe second mark was awarded for linking the information from Question 6d.iii and stating that therefore there must be two R-CH3 groups present in Compound X.","answer":"","examPage":30},{"id":"6f635857","year":2024,"subject":"VCE Chemistry","section":"B","number":"6e","type":"short","text":"[2024 VCE Chemistry Section B – Question 6e]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for any structure showing the correct atoms connected to form an alcohol with a chemical formula of C5H11ClO.\nThe second mark was awarded for the correct structure of 3-chloro-2,2-dimethylpropan-1-ol.","marks":2,"topic":"Organic Chemistry","examinerReport":"The first mark was awarded for any structure showing the correct atoms connected to form an alcohol with a chemical formula of C5H11ClO.\nThe second mark was awarded for the correct structure of 3-chloro-2,2-dimethylpropan-1-ol.","answer":"","examPage":30},{"id":"40eb141d","year":2024,"subject":"VCE Chemistry","section":"B","number":"7ai","type":"short","text":"[2024 VCE Chemistry Section B – Question 7ai]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The anode is the iron (Fe) electrode.","marks":1,"topic":"Electrochemistry","examinerReport":"The anode is the iron (Fe) electrode.","answer":"","examPage":34},{"id":"7c643700","year":2024,"subject":"VCE Chemistry","section":"B","number":"7aii","type":"short","text":"[2024 VCE Chemistry Section B – Question 7aii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: H2O(l) + 2e− → H2(g) + 2OH−(aq)\nThis question was assessed for the use of states.\nStudents need to be aware that for reactions that occur during a specific redox process, the single-headed arrow ‘→’ is required.\nA significant number of students responded to this question by writing an equation based","marks":1,"topic":"Electrochemistry","examinerReport":"H2O(l) + 2e− → H2(g) + 2OH−(aq)\nThis question was assessed for the use of states.\nStudents need to be aware that for reactions that occur during a specific redox process, the single-headed arrow ‘→’ is required.\nA significant number of students responded to this question by writing an equation based on either iron or platinum reacting. It is recommended that students sketch out a diagram of the cell to assist them to understand the processes occurring at each electrode.","answer":"","examPage":34},{"id":"1eaac2c0","year":2024,"subject":"VCE Chemistry","section":"B","number":"7aiii","type":"short","text":"[2024 VCE Chemistry Section B – Question 7aiii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Any of the following were valid responses:\nOne of the products of the reaction is hydrogen gas, which does not stay in contact with the electrode and therefore is not available to react spontaneously.\nIron(II) hydroxide would form and may not remain in contact with the electrode, and therefore is no","marks":1,"topic":"Electrochemistry","examinerReport":"Any of the following were valid responses:\nOne of the products of the reaction is hydrogen gas, which does not stay in contact with the electrode and therefore is not available to react spontaneously.\nIron(II) hydroxide would form and may not remain in contact with the electrode, and therefore is not available to react spontaneously.\nThere are no oxidants/reductants present that are strong enough to react spontaneously with a reductant/oxidant.\nStudents needed to provide a specific response – statements such as ‘this is a non-spontaneous process’ do not demonstrate the required understanding of chemical processes.","answer":"","examPage":34},{"id":"01acc1b3","year":2024,"subject":"VCE Chemistry","section":"B","number":"7bi","type":"short","text":"[2024 VCE Chemistry Section B – Question 7bi]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Electrode X is positive during recharging.","marks":1,"topic":"Electrochemistry","examinerReport":"Electrode X is positive during recharging.","answer":"","examPage":34},{"id":"60f437bc","year":2024,"subject":"VCE Chemistry","section":"B","number":"7bii","type":"short","text":"[2024 VCE Chemistry Section B – Question 7bii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for the correct calculation of charge.\nQ = 1.25 × 1 × 60 × 60 = 4500 C\nThe second mark was awarded for the correct n(e).\nn(e) = 4500 / 96 500 = 0.04663 mol\nThe third mark was awarded for the correct n(LiC6).\nFrom equation stoichiometry, n(LiC6) = n(e) = 0.04663 mol\nThe fou","marks":4,"topic":"Quantitative Chemistry","examinerReport":"The first mark was awarded for the correct calculation of charge.\nQ = 1.25 × 1 × 60 × 60 = 4500 C\nThe second mark was awarded for the correct n(e).\nn(e) = 4500 / 96 500 = 0.04663 mol\nThe third mark was awarded for the correct n(LiC6).\nFrom equation stoichiometry, n(LiC6) = n(e) = 0.04663 mol\nThe fourth mark was awarded for the correct m(LiC6), with units.\nm(LiC6) = 78.9 × 0.04663 = 3.68 g\nIn general, this question was answered extremely well.","answer":"","examPage":34},{"id":"86e0b4a9","year":2024,"subject":"VCE Chemistry","section":"B","number":"7ci","type":"short","text":"[2024 VCE Chemistry Section B – Question 7ci]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Electromagnetic / light energy / sunlight to chemical energy","marks":1,"topic":"General Chemistry","examinerReport":"Electromagnetic / light energy / sunlight to chemical energy","answer":"","examPage":34},{"id":"bfb23ffb","year":2024,"subject":"VCE Chemistry","section":"B","number":"7cii","type":"short","text":"[2024 VCE Chemistry Section B – Question 7cii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The arrow needed to be drawn in the box provided, and be pointing to the right.","marks":1,"topic":"General Chemistry","examinerReport":"The arrow needed to be drawn in the box provided, and be pointing to the right.","answer":"","examPage":34},{"id":"dbcb377a","year":2024,"subject":"VCE Chemistry","section":"B","number":"7ciii","type":"short","text":"[2024 VCE Chemistry Section B – Question 7ciii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Any two of the following were valid responses:\nElectrons are continually generated at the anode and used up at the cathode, hence maintaining the charge balance.\nH+ ions are continually generated at the anode and flow to the cathode where they are removed, hence maintaining the charge balance.\nThe f","marks":2,"topic":"Electrochemistry","examinerReport":"Any two of the following were valid responses:\nElectrons are continually generated at the anode and used up at the cathode, hence maintaining the charge balance.\nH+ ions are continually generated at the anode and flow to the cathode where they are removed, hence maintaining the charge balance.\nThe flow of electrons to the cathode is balanced by the flow of protons to the cathode.\nIons flow through the system to balance the charge.\nSome students attempted to show a balance by using hydroxide ions, but this was not accepted due to the clear information in the question that the reaction was occurring under acidic conditions.","answer":"","examPage":34},{"id":"10daf183","year":2024,"subject":"VCE Chemistry","section":"B","number":"8ai","type":"short","text":"[2024 VCE Chemistry Section B – Question 8ai]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: C6H12O6(aq)  2C2H5OH(aq) + 2CO2(g)","marks":1,"topic":"General Chemistry","examinerReport":"C6H12O6(aq)  2C2H5OH(aq) + 2CO2(g)","answer":"","examPage":38},{"id":"93841487","year":2024,"subject":"VCE Chemistry","section":"B","number":"8aii","type":"short","text":"[2024 VCE Chemistry Section B – Question 8aii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The high temperature will denature the enzyme.\nMany responses stated that the ‘yeast would be killed/destroyed/denatured’. These responses could not be accepted as they showed no understanding that the enzyme is the key component needed for this reaction to occur and not the organism itself.","marks":1,"topic":"General Chemistry","examinerReport":"The high temperature will denature the enzyme.\nMany responses stated that the ‘yeast would be killed/destroyed/denatured’. These responses could not be accepted as they showed no understanding that the enzyme is the key component needed for this reaction to occur and not the organism itself.","answer":"","examPage":38},{"id":"114456af","year":2024,"subject":"VCE Chemistry","section":"B","number":"8bi","type":"short","text":"[2024 VCE Chemistry Section B – Question 8bi]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The mark was awarded for the correct calculation of the amount of carbon dioxide.\nn(CO2) = 0.1 / 44 = 0.0023 mol","marks":1,"topic":"Quantitative Chemistry","examinerReport":"The mark was awarded for the correct calculation of the amount of carbon dioxide.\nn(CO2) = 0.1 / 44 = 0.0023 mol","answer":"","examPage":38},{"id":"e43a75ff","year":2024,"subject":"VCE Chemistry","section":"B","number":"8bii","type":"short","text":"[2024 VCE Chemistry Section B – Question 8bii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The mark was awarded for the correct calculation of the amount of carbon dioxide.\nV(CO2) = 32.5 – 0.5 = 32.0 mL\nn(CO2) = 0.032 / 24.8 = 0.00129 mol\nThe most common errors were caused by failure to:\nsubtract the initial volume from the final volume\ndivide the volume of gas by 1000 to convert to litre","marks":1,"topic":"Quantitative Chemistry","examinerReport":"The mark was awarded for the correct calculation of the amount of carbon dioxide.\nV(CO2) = 32.5 – 0.5 = 32.0 mL\nn(CO2) = 0.032 / 24.8 = 0.00129 mol\nThe most common errors were caused by failure to:\nsubtract the initial volume from the final volume\ndivide the volume of gas by 1000 to convert to litres.","answer":"","examPage":38},{"id":"ef59cb0b","year":2024,"subject":"VCE Chemistry","section":"B","number":"8biii","type":"short","text":"[2024 VCE Chemistry Section B – Question 8biii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Any of the following valid responses were accepted:\nThe gas collected behaves as an ideal gas.\nCarbon dioxide does not react with / dissolve in water, so all CO2 produced ends up as gas in the burette.\nGas collected in the burette is 25 °C.\nGas collected in the burette is 100 kPa.\nThe only gas prese","marks":1,"topic":"General Chemistry","examinerReport":"Any of the following valid responses were accepted:\nThe gas collected behaves as an ideal gas.\nCarbon dioxide does not react with / dissolve in water, so all CO2 produced ends up as gas in the burette.\nGas collected in the burette is 25 °C.\nGas collected in the burette is 100 kPa.\nThe only gas present in the burette is carbon dioxide.\nResponses simply stating that ‘the experiment was being conducted at SLC’ contained insufficient information as the question clearly states that the glucose reacting with yeast enzymes occurs at 35 °C.","answer":"","examPage":38},{"id":"e2a59257","year":2024,"subject":"VCE Chemistry","section":"B","number":"8biv","type":"short","text":"[2024 VCE Chemistry Section B – Question 8biv]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: One mark was awarded for each correct resolution value.\nIn method A, the resolution of the balance was 0.1 g.\nIn method B, the resolution of the burette must have been 1 mL.\nUnits were required for resolution quantities.\nWhile some students could identify the correct resolution of the balance, a sig","marks":2,"topic":"Analytical Chemistry","examinerReport":"One mark was awarded for each correct resolution value.\nIn method A, the resolution of the balance was 0.1 g.\nIn method B, the resolution of the burette must have been 1 mL.\nUnits were required for resolution quantities.\nWhile some students could identify the correct resolution of the balance, a significant number of students was unable to determine the resolution of the burette. For further details about this question, please refer to the introductory section of this report.","answer":"","examPage":38},{"id":"951da84f","year":2024,"subject":"VCE Chemistry","section":"B","number":"8ci","type":"short","text":"[2024 VCE Chemistry Section B – Question 8ci]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The independent variable is the concentration of the glucose solution.","marks":1,"topic":"Quantitative Chemistry","examinerReport":"The independent variable is the concentration of the glucose solution.","answer":"","examPage":38},{"id":"08190b58","year":2024,"subject":"VCE Chemistry","section":"B","number":"8cii","type":"short","text":"[2024 VCE Chemistry Section B – Question 8cii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for identifying that the hypothesis is not supported.\nThe second mark was awarded for a clear reference to the graph that indicated that the ‘slope of the line’ or the ‘quantity of gas formed’ over the first 15 minutes was the same.\nStudents often responded to this questio","marks":2,"topic":"Acids and Bases","examinerReport":"The first mark was awarded for identifying that the hypothesis is not supported.\nThe second mark was awarded for a clear reference to the graph that indicated that the ‘slope of the line’ or the ‘quantity of gas formed’ over the first 15 minutes was the same.\nStudents often responded to this question without making a direct reference to the graph. A response that simply stated that the ‘rate’ was the same for the first 15 minutes was not awarded the mark.","answer":"","examPage":38},{"id":"7fc495be","year":2024,"subject":"VCE Chemistry","section":"B","number":"8di","type":"short","text":"[2024 VCE Chemistry Section B – Question 8di]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: Any of the following valid responses were accepted:\nThe gas may dissolve in the water as it bubbles through.\nThe collected gas pressure may not be the same as atmospheric pressure.\nSome gas may escape before the stopper is applied / Not all gas was collected in the burette.\nThere may be difficulty i","marks":1,"topic":"Acids and Bases","examinerReport":"Any of the following valid responses were accepted:\nThe gas may dissolve in the water as it bubbles through.\nThe collected gas pressure may not be the same as atmospheric pressure.\nSome gas may escape before the stopper is applied / Not all gas was collected in the burette.\nThere may be difficulty in setting up the complex arrangement.\nThe gas temperature is not at 25 °C (originally at 35 °C).\nThe burette cannot collect the 500 mL of gas shown forming in the graph.\nThe only condition that could have voided one of these responses was if the student had used the same response in Question 8b.iii.","answer":"","examPage":38},{"id":"17363f16","year":2024,"subject":"VCE Chemistry","section":"B","number":"8dii","type":"short","text":"[2024 VCE Chemistry Section B – Question 8dii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The discussion is where the limitation should be identified.\nThis was well answered by students.","marks":1,"topic":"General Chemistry","examinerReport":"The discussion is where the limitation should be identified.\nThis was well answered by students.","answer":"","examPage":38},{"id":"12b288ee","year":2024,"subject":"VCE Chemistry","section":"B","number":"9ai","type":"short","text":"[2024 VCE Chemistry Section B – Question 9ai]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: n(paracetamol) = 1.4 / 109 = 0.01284 mol and therefore m(paracetamol) = 0.01284 × 151 = 1.94 g\nThe first mark was awarded for the correct calculation of the % yield of reaction P2.\n% yield = 100 × 0.80 / 1.94 = 41%\nThe second mark was awarded for the correct % atom economy.\n% atom economy = 100 × 15","marks":4,"topic":"Quantitative Chemistry","examinerReport":"n(paracetamol) = 1.4 / 109 = 0.01284 mol and therefore m(paracetamol) = 0.01284 × 151 = 1.94 g\nThe first mark was awarded for the correct calculation of the % yield of reaction P2.\n% yield = 100 × 0.80 / 1.94 = 41%\nThe second mark was awarded for the correct % atom economy.\n% atom economy = 100 × 151 / (109 + 60) = 89%\nThe third mark was awarded for the comparison of % yield.\nThe percentage yield is higher for reaction P1 with 87% compared to reaction P2, which is 41%.\nThe fourth mark was awarded for the correct m(LiC6).\nThe percentage atom economy is higher for reaction P2 with 89% compared to reaction P1, which is 72%.\nIn general, this question was well answered, although some students either calculated the % atom economy or the % yield, rather than both of these as required.","answer":"","examPage":50},{"id":"03ec0807","year":2024,"subject":"VCE Chemistry","section":"B","number":"9aii","type":"short","text":"[2024 VCE Chemistry Section B – Question 9aii]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first mark was awarded for identifying % atom economy as the relevant green chemistry principle, as % yield is not specifically addressed as a green chemistry principle.\nThe second mark was awarded for responding that the % atom economy for reaction P2 was better aligned with this green chemistr","marks":2,"topic":"Quantitative Chemistry","examinerReport":"The first mark was awarded for identifying % atom economy as the relevant green chemistry principle, as % yield is not specifically addressed as a green chemistry principle.\nThe second mark was awarded for responding that the % atom economy for reaction P2 was better aligned with this green chemistry principle because it had the higher % atom economy.","answer":"","examPage":50},{"id":"a38f01b5","year":2024,"subject":"VCE Chemistry","section":"B","number":"9b","type":"short","text":"[2024 VCE Chemistry Section B – Question 9b]\n\nNote: The original exam PDF is image-based. See examiner report below for context.\n\nExaminer notes: The first two marks were awarded for identifying the following two points.\nReaction P1 produces waste ethanoic acid (with other contaminates).\nReaction P2 produces wastewater (with other contaminates).\nThe third mark was awarded for any one of the following valid comments.\nReaction P1 has a much hig","marks":3,"topic":"Acids and Bases","examinerReport":"The first two marks were awarded for identifying the following two points.\nReaction P1 produces waste ethanoic acid (with other contaminates).\nReaction P2 produces wastewater (with other contaminates).\nThe third mark was awarded for any one of the following valid comments.\nReaction P1 has a much higher yield, and therefore potentially produces much less waste.\nReaction P2 has a much lower yield, and therefore potentially produces much greater waste.\nRecycling of ethanoic acid or unused reactants can reduce the waste from reaction P1.\nAny suitable comment that related waste back to the % atom economy values.","answer":"","examPage":50}];

<script>
// ── STATE ──
const STORE_KEY = 'ep_chemistry';
let S = { subject:'', questions:[], sessions:[], settings:{apiKey:'',accent:'#f5a623',dark:null} };
// In-memory PDF store per year: { '2022': 'base64...', ... } — not persisted to localStorage
const _examPdfs = {};
// PDF pages for the current session's year (rendered once, reused across questions)
let _sessPdfPages = null;
let _sessPdfYear = null;
// Page cache: { '2022_5': 'data:image/png;base64,...' }
const _pageCache = {};
let curView = 'dashboard';

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({...S, questions: S.questions.map(q=>({...q,images:[],reportImages:[]}))})); } catch(e){} }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const d = JSON.parse(raw); S = {...S,...d}; }
  } catch(e){}
}
function uid() { return Math.random().toString(36).slice(2)+Date.now().toString(36); }

// ── INIT ──
load();
// Auto-configure if URL param matches a known subject
if (!S.subject) {
  S.subject = 'VCE Chemistry';
  save();
}
if (!S.subject) { hideLoader(); document.getElementById('setup').classList.remove('hidden'); }
else { bootApp(); }

function finishSetup() {
  const subj = document.getElementById('setup-subj').value.trim();
  const key = document.getElementById('setup-key').value.trim();
  if (!subj) { toast('❌ Enter a subject name'); return; }
  S.subject = subj;
  S.settings.apiKey = key;
  save();
  document.getElementById('setup').classList.add('hidden');
  bootApp();
}

function hideLoader() {
  const l = document.getElementById('page-loader');
  if (l) l.style.display = 'none';
}

function bootApp() {
  // Merge pre-loaded VCE Biology questions if not already present
  if (typeof VCE_BIO_PRELOAD !== 'undefined') {
    const existingIds = new Set(S.questions.map(q=>q.id));
    const toAdd = VCE_BIO_PRELOAD.filter(q=>!existingIds.has(q.id));
    if (toAdd.length) {
      S.questions.push(...toAdd);
      save();
    }
  }
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('sb-subject-lbl').textContent = S.subject.toUpperCase();
  document.getElementById('sb-title-lbl').textContent = 'Exam Practice';
  document.title = S.subject + ' — Exam Practice';
  if (S.settings.dark === true) document.documentElement.setAttribute('data-theme','dark');
  if (S.settings.dark === false) document.documentElement.setAttribute('data-theme','light');
  hideLoader();
  nav('dashboard');
}

// ── NAVIGATION ──
function nav(view) {
  curView = view;
  document.querySelectorAll('.sb-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  const titles = {dashboard:'Dashboard', bank:'Question Bank', upload:'Upload Exam', practice:'Practice', history:'History'};
  document.getElementById('topbar-title').textContent = titles[view] || view;
  document.getElementById('topbar-actions').innerHTML = '';
  const fn = {dashboard:renderDashboard, bank:renderBank, upload:renderUpload, practice:renderPractice, history:renderHistory}[view];
  if (fn) fn();
}

// ── TOAST ──
let _toastTimer;
function toast(msg, dur=2800) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove('show'), dur);
}

// ── MODAL ──
function openModal(html) {
  document.getElementById('overlay-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" onclick="event.stopPropagation()" id="modal-content">${html}</div></div>`;
}
function closeModal() { document.getElementById('overlay-root').innerHTML = ''; }

// ── HELPERS ──
function qTypeTag(type) {
  const labels = {mcq:'MCQ', short:'Short Answer', extended:'Extended Response'};
  return `<span class="tag ${type}">${labels[type]||type}</span>`;
}
function topics() {
  return [...new Set(S.questions.map(q=>q.topic).filter(Boolean))].sort();
}
function years() {
  return [...new Set(S.questions.map(q=>q.year).filter(Boolean))].sort((a,b)=>b-a);
}
function markValues() {
  return [...new Set(S.questions.map(q=>q.marks).filter(Boolean))].sort((a,b)=>a-b);
}

// ══════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════
function renderDashboard() {
  const pc = document.getElementById('page-content');
  const qs = S.questions;
  const sess = S.sessions;
  const done = sess.filter(s=>s.completedAt);
  const mcqAll = qs.filter(q=>q.type==='mcq');
  const shortAll = qs.filter(q=>q.type!=='mcq');

  // accuracy across completed sessions
  let totalAns=0, totalCorrect=0;
  done.forEach(s=>{
    Object.values(s.answers||{}).forEach(a=>{
      totalAns++;
      if (a.correct || a.aiScore >= 2) totalCorrect++;
    });
  });
  const acc = totalAns ? Math.round(totalCorrect/totalAns*100) : null;

  pc.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val">${qs.length}</div><div class="stat-lbl">Questions</div></div>
      <div class="stat-card"><div class="stat-val">${mcqAll.length}</div><div class="stat-lbl">MCQ</div></div>
      <div class="stat-card"><div class="stat-val">${shortAll.length}</div><div class="stat-lbl">Short / Extended</div></div>
      <div class="stat-card"><div class="stat-val">${acc!==null?acc+'%':'—'}</div><div class="stat-lbl">Accuracy</div></div>
    </div>

    <div class="card" style="margin-top:20px">
      <div style="font-weight:800;font-size:.92rem;margin-bottom:14px;letter-spacing:-.01em">Quick Practice</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">
        ${modeCard('🔵','MCQ Quiz','Random multiple-choice questions','mcq-quiz')}
        ${modeCard('📄','Mock Exam','Full exam paper by year','mock-exam')}
        ${modeCard('✏️','Short Answer','Extended response questions','short-string')}
        ${modeCard('⭐','Skills Trainer','Practice by marks allocated','skills')}

async function handleUpFiles(rawFiles, key) {
  const files = [...rawFiles];
  for (const f of files) {
    const isDocx = f.name.endsWith('.docx');
    const data = await new Promise(res=>{
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      if (isDocx) r.readAsArrayBuffer(f); else r.readAsDataURL(f);
    });
    _uploadFiles[key].push({name:f.name, type: isDocx?'application/docx':f.type, data, size:f.size});
  }
  const listEl = document.getElementById(`fi-${key}-list`);
  if (listEl) listEl.textContent = _uploadFiles[key].map(f=>'📎 '+f.name).join(' · ');
}

async function pdfPageImages(base64, scale=1.5) {
  if (typeof pdfjsLib==='undefined') return [];
  const bytes = Uint8Array.from(atob(base64), c=>c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({data:bytes}).promise;
  const imgs = [];
  for (let p=1;p<=pdf.numPages;p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width=vp.width; canvas.height=vp.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    imgs.push(canvas.toDataURL('image/png'));
  }
  return imgs;
}

async function fileToBlocks(files) {
  const blocks = []; let hasPdf=false;
  for (const f of files) {
    const base64 = typeof f.data==='string' ? f.data.split(',')[1]||f.data : '';
    if (f.type==='application/docx') {
      try {
        const zip = await JSZip.loadAsync(f.data);
        const xml = await zip.file('word/document.xml').async('string');
        const text = xml.replace(/<w:p[ >][^>]*>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
        blocks.push({type:'text',text:`[DOCX: ${f.name}]\n${text.slice(0,20000)}`});
      } catch{}
    } else if (f.type==='application/pdf') {
      const imgs = await pdfPageImages(base64);
      for (const img of imgs) {
        const b64 = img.split(',')[1];
        blocks.push({type:'image',source:{type:'base64',media_type:'image/png',data:b64}});
      }
      hasPdf=true;
    } else if (f.type.startsWith('image/')) {
      blocks.push({type:'image',source:{type:'base64',media_type:f.type,data:base64}});
    }
  }
  return {blocks,hasPdf};
}

// Parse VCE examiner report DOCX text — handles 2022–2025 format variations
function parseVCEReport(docxText) {
  const reportData = {};
  const lines = docxText.split('\n').map(l => l.trim());

  // ── Section A ──
  // Find the header row: look for "Question" then "Correct answer" pattern
  let tableStart = -1;
  for (let i = 0; i < lines.length - 5; i++) {
    if (lines[i] === 'Question' && lines[i+1] === 'Correct answer' && lines[i+2].startsWith('% A')) {
      tableStart = i + 7; // skip 7 header rows: Q, Correct, %A, %B, %C, %D, Comments
      break;
    }
  }

  // Also try alternate header with no separate Comments column
  if (tableStart === -1) {
    for (let i = 0; i < lines.length - 3; i++) {
      if (lines[i] === 'Question' && (lines[i+1] === 'Correct answer' || lines[i+1] === 'Correct Answer')) {
        tableStart = i + 5; break;
      }
    }
  }

  if (tableStart > -1) {
    let i = tableStart;
    // Find where Section B questions start
    const secBStart = lines.findIndex((l,idx) => idx > tableStart && /^Question \d/.test(l));
    const tableEnd = secBStart > -1 ? secBStart : lines.length;

    while (i < tableEnd) {
      const num = parseInt(lines[i]);
      if (!isNaN(num) && num >= 1 && num <= 40 && /^\d+$/.test(lines[i])) {
        const correct = lines[i+1];
        const pA = parseFloat(lines[i+2]);
        const pB = parseFloat(lines[i+3]);
        const pC = parseFloat(lines[i+4]);
        const pD = parseFloat(lines[i+5]);
        i += 6;
        // Accumulate comment lines until next question number
        const commentLines = [];
        while (i < tableEnd) {
          const peek = lines[i];
          const peekNum = parseInt(peek);
          if (!isNaN(peekNum) && /^\d+$/.test(peek) && peekNum > num && peekNum <= 40) break;
          if (['A','B','C','D'].includes(peek)) break; // next row's correct answer
          if (peek) commentLines.push(peek);
          i++;
        }
        if (['A','B','C','D'].includes(correct) && !isNaN(pA)) {
          reportData[String(num)] = {
            correctAnswer: correct,
            reportStats: {A: pA, B: pB, C: pC, D: pD},
            examinerReport: commentLines.join(' ').trim()
          };
        }
      } else { i++; }
    }
  }

  // ── Section B ──
  // Split on "Question N..." blocks — handles "1a.", "1a.i", "2b.ii" etc.
  // Normalise: remove all dots, spaces → "1a", "1ai", "2bii"
  const normNum = n => n.replace(/[\s.]/g, '');

  // Find all Section B question positions
  const qRegex = /^Question (\d+[a-z]*(?:\.[ivx]+)?\.?)\s*$/i;
  const qPositions = [];
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(qRegex);
    if (m) qPositions.push({line: i, rawNum: m[1]});
  }

  for (let qi = 0; qi < qPositions.length; qi++) {
    const {line: start, rawNum} = qPositions[qi];
    const end = qi + 1 < qPositions.length ? qPositions[qi+1].line : lines.length;
    const block = lines.slice(start, end);

    // Find max mark from distribution table
    const markIdx = block.findIndex(l => l === 'Mark');
    const avgIdx = block.findIndex(l => l === 'Average');
    let maxMarks = 1;
    if (markIdx > -1 && avgIdx > markIdx) {
      const markNums = block.slice(markIdx+1, avgIdx).map(Number).filter(n => !isNaN(n) && n > 0);
      if (markNums.length) maxMarks = Math.max(...markNums);
    }

    // Sample answer: after the % distribution numbers
    const pctIdx = block.findIndex(l => l === '%');
    let sampleAnswer = '';
    if (pctIdx > -1) {
      // Skip number/decimal lines after %
      let textStart = pctIdx + 1;
      while (textStart < block.length && /^[\d.]+$/.test(block[textStart])) textStart++;
      sampleAnswer = block.slice(textStart).join('\n').trim();
    }

    const key = normNum(rawNum);
    reportData[key] = {examinerReport: sampleAnswer, marks: maxMarks};
  }

  return reportData;
}

async function runExtraction() {
  const year = document.getElementById('up-year').value.trim();
  const examName = document.getElementById('up-name').value.trim();
  if (!_uploadFiles.paper.length) { toast('❌ Upload the exam paper first'); return; }
  if (!S.settings.apiKey) { toast('❌ Add an API key in Settings'); return; }

  openModal(`<div class="modal-title">✨ Extracting Questions…</div>
    <div style="text-align:center;padding:30px">
      <div class="spin" style="font-size:2rem">⚙️</div>
      <p id="ext-status" style="color:var(--muted);margin-top:14px;font-size:.88rem">Rendering document pages…</p>
    </div>`);
  const setStatus = t => { const el=document.getElementById('ext-status'); if(el) el.textContent=t; };

  try {
    // ── Step 1: Extract report data (DOCX is structured — parse it directly) ──
    let reportData = {};
    let reportDocxText = '';
    for (const f of _uploadFiles.report) {
      if (f.type === 'application/docx') {
        setStatus('Parsing examiner report…');
        try {
          const zip = await JSZip.loadAsync(f.data);
          const xml = await zip.file('word/document.xml').async('string');
          reportDocxText = xml.replace(/<w:p[ >][^>]*>/g,'\n').replace(/<[^>]+>/g,'')
            .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\r/g,'')
            .replace(/\n{3,}/g,'\n\n').trim();
          reportData = parseVCEReport(reportDocxText);
        } catch(e) { console.warn('DOCX parse error', e); }
      }
    }
    // If report is PDF/image, fall back to AI extraction
    const hasDocxReport = Object.keys(reportData).length > 0;
    if (!hasDocxReport && _uploadFiles.report.length) {
      setStatus('Extracting report with AI (non-DOCX format)…');
      const {blocks: rBlocks} = await fileToBlocks(_uploadFiles.report);
      if (rBlocks.length) {
        const rRaw = await callAI(
          'Extract VCE examiner report data. Return ONLY valid JSON, no markdown.',
          [{role:'user',content:[...rBlocks,{type:'text',text:`Extract data for every question from this VCE ${S.subject} examiner report.
Section A: for each MCQ question 1-40 extract correct answer letter and % for A,B,C,D.
Section B: for each question (e.g. "1a", "2b", "3ai") extract the sample answer / examiner commentary and max marks awarded.
Return ONLY: {"report":{"1":{"correctAnswer":"B","reportStats":{"A":15,"B":60,"C":20,"D":5},"examinerReport":"comment"},"1a":{"examinerReport":"sample answer...","marks":3}}}`}]}]);
        try { reportData = JSON.parse(rRaw.replace(/```json|```/g,'')).report||{}; } catch{}
      }
    }

    // ── Step 2: Extract questions from exam paper (PDF rendered as images) ──
    setStatus('Rendering exam paper pages…');
    const {blocks: paperBlocks} = await fileToBlocks(_uploadFiles.paper);

    setStatus(`Extracting questions from ${_uploadFiles.paper.length} file(s)…`);

    // Use larger context model for question extraction since papers can be long
    const qSystem = `You are extracting questions from a VCE Chemistry exam paper. This is a Victorian Certificate of Education exam. Return ONLY valid JSON, no markdown fences.`;
    const qPrompt = `Extract EVERY question from this VCE Chemistry exam paper.

SECTION A — Multiple Choice (Questions 1–40, each 1 mark):
- number: "1", "2", … "40" (plain integer as string)
- type: "mcq"
- marks: 1
- Include ALL 4 options A, B, C, D with their full text

SECTION B — Short/Extended Answer:
Questions have sub-parts like "a.", "b.", "c." and further sub-sub-parts "i.", "ii.", "iii."
- number: remove all dots and spaces → "1a", "1b", "2ai", "2aii", "3bii", "5aii" etc.
- type: "short" if 1–2 marks, "extended" if 3+ marks
- marks: number shown in brackets next to the question, e.g. (3 marks) → 3

Topic categories for VCE Chemistry: "Atomic Structure", "Chemical Bonding", "Organic Chemistry", "Equilibrium", "Acids & Bases", "Redox & Electrochemistry", "Energetics & Thermochemistry", "Rates of Reaction", "Analytical Chemistry", "Polymers & Materials", "Environmental Chemistry", "Scientific Investigation"

Return ONLY valid JSON (no markdown fences):
{"questions":[
  {"number":"1","type":"mcq","text":"Full question stem text including any scenario/stimulus text before the options","marks":1,"topic":"Topic name","options":[{"label":"A","text":"option text"},{"label":"B","text":"..."},{"label":"C","text":"..."},{"label":"D","text":"..."}]},
  {"number":"1a","type":"short","text":"Full question text for part a","marks":1,"topic":"Topic name"},
  {"number":"1b","type":"extended","text":"Full question text for part b","marks":4,"topic":"Topic name"}
]}`;

    const qMsg = [{role:'user',content:[...paperBlocks,{type:'text',text:qPrompt}]}];
    // Use sonnet for better extraction quality on long exam papers
    const qRes = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:8192,system:qSystem,messages:qMsg})
    });
    const qData = await qRes.json();
    if (qData.error) throw new Error(qData.error.message);
    let extracted = [];
    try { extracted = JSON.parse(qData.content[0].text.replace(/```json|```/g,'')).questions||[]; }
    catch { throw new Error('AI returned invalid JSON. Try again.'); }

    // ── Step 3: Merge questions with report data ──
    const newQs = extracted.map(q => {
      // Try exact match first, then fuzzy (e.g. "1a" vs "1a.")
      const rep = reportData[q.number]
        || reportData[q.number.replace(/\./g,'')]
        || reportData[q.number+'a']
        || {};
      return {
        id: uid(),
        year: year || null,
        examName: examName || null,
        number: q.number,
        topic: q.topic || '',
        type: q.type || 'short',
        text: q.text || '',
        marks: rep.marks || q.marks || 1,
        options: q.options || [],
        correctAnswer: rep.correctAnswer || null,
        examinerReport: rep.examinerReport || '',
        reportStats: rep.reportStats || {},
        images: [], reportImages: []
      };
    });

    const matched = newQs.filter(q=>q.examinerReport||q.correctAnswer).length;
    closeModal();
    setTimeout(()=>reviewExtractedModal(newQs, year, examName, matched), 50);
  } catch(e) {
    closeModal();
    setTimeout(()=>openModal(`<div class="modal-title">❌ Extraction Failed</div><p style="color:var(--muted);margin-bottom:8px">${e.message}</p><div class="mactions"><button class="btn btn-primary" onclick="closeModal()">OK</button></div>`),50);
  }
}

function launchSession(mode) {
  const topic = document.getElementById('pm-topic')?.value||'';
  const year  = document.getElementById('pm-year')?.value||'';
  const marks = document.getElementById('pm-marks')?.value||'';
  const countEl = document.getElementById('pm-count');
  const count = countEl ? (+countEl.value||0) : 0;

  let pool = S.questions.filter(q=>{
    if (mode==='mcq-quiz' && q.type!=='mcq') return false;
    if (mode==='short-string' && q.type==='mcq') return false;
    if (mode==='skills' && marks && q.marks!=marks) return false;
    if (topic && q.topic!==topic) return false;
    if (year && q.year!=year) return false;
    return true;
  });

  if (!pool.length) { toast('❌ No questions match those filters'); return; }

  if (mode === 'mock-exam') {
    // Sort by question number in exam order: MCQ 1-40 first, then section B by number string
    pool = pool.sort((a, b) => {
      const aIsNum = /^\d+$/.test(a.number);
      const bIsNum = /^\d+$/.test(b.number);
      if (aIsNum && bIsNum) return +a.number - +b.number;
      if (aIsNum) return -1;
      if (bIsNum) return 1;
      return a.number.localeCompare(b.number, undefined, {numeric: true});
    });
  } else {
    pool = pool.sort(()=>Math.random()-.5);
    if (count && count < pool.length) pool = pool.slice(0, count);
  }

  const session = {
    id:uid(), mode,
    filters:{topic, year, marks: marks?+marks:null},
    qIds: pool.map(q=>q.id),
    answers:{},
    startedAt: Date.now(),
    completedAt: null
  };
  S.sessions.push(session);
  save();
  closeModal();
  runSession(session, pool);
}

// ── PDF YEAR ATTACHMENT + AI IMAGE EXTRACTION ──
// After attaching a PDF, Claude Vision identifies which page each image-referencing
// question's visual is on, crops it, and stores it directly in q.images (memory only).

async function pdfToImagesSmall(base64) {
  if (typeof pdfjsLib === 'undefined') return [];
  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
  const imgs = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({scale: 1.2});
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;
    imgs.push({dataUrl: canvas.toDataURL('image/jpeg', 0.82), w: vp.width, h: vp.height});
  }
  return imgs;
}

function cropImageRegion(dataUrl, w, h, x, y, cw, ch) {
  const img = new Image();
  img.src = dataUrl;
  const canvas = document.createElement('canvas');
  const pw = Math.round(cw * w), ph = Math.round(ch * h);
  canvas.width = pw; canvas.height = ph;
  canvas.getContext('2d').drawImage(img, x*w, y*h, pw, ph, 0, 0, pw, ph);
  return canvas.toDataURL('image/jpeg', 0.9);
}

async function loadPdfForYear(year, qid) {
  // If images already extracted for this year, just refresh the slot
  const alreadyDone = S.questions.some(q => q.year == year && q.images?.some(Boolean));
  if (alreadyDone) { refreshImageSlot(qid); return; }

  if (!S.settings.apiKey) { toast('❌ Add API key in Settings to auto-extract images'); return; }

  // File picker
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.pdf';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const slot = document.getElementById('img-slot-'+qid);
    if (slot) slot.innerHTML = '<div style="color:var(--muted);font-size:.84rem;padding:12px;text-align:center"><div class="spin" style="font-size:1.2rem;display:inline-block">⏳</div> Rendering PDF pages…</div>';

    const base64 = await new Promise(res => {
      const r = new FileReader(); r.onload = e => res(e.target.result.split(',')[1]); r.readAsDataURL(f);
    });

    if (slot) slot.innerHTML = '<div style="color:var(--muted);font-size:.84rem;padding:12px;text-align:center"><div class="spin" style="font-size:1.2rem;display:inline-block">🔍</div> Analysing pages with AI…</div>';

    await extractImagesFromPdf(base64, year);
    refreshImageSlot(qid);
  };
  inp.click();
}

async function extractImagesFromPdf(base64, year) {
  const pages = await pdfToImagesSmall(base64);
  // Get all image-referencing question numbers for this year
  const imgQs = S.questions.filter(q => q.year == year && questionHasImage(q));
  if (!imgQs.length) { toast('No image questions found for '+year); return; }

  // Send pages in batches of 6 to Claude Vision
  const BATCH = 6;
  const pageAssignments = {}; // { qNumber: {page, x, y, w, h} }

  for (let i = 0; i < pages.length; i += BATCH) {
    const batch = pages.slice(i, i+BATCH);
    const imgBlocks = batch.map((pg, bi) => ({
      type: 'image',
      source: {type: 'base64', media_type: 'image/jpeg', data: pg.dataUrl.split(',')[1]}
    }));
    const qNums = imgQs.map(q => q.number).join(', ');
    const pageNums = batch.map((_, bi) => `Image ${bi+1} = page ${i+bi+1}`).join(', ');

    try {
      const resp = await callAI(
        'You are analysing VCE Chemistry exam PDF pages. Identify visual elements (diagrams, graphs, micrographs, images, tables) and which question number each belongs to. Return ONLY valid JSON.',
        [{role:'user', content: [
          ...imgBlocks,
          {type:'text', text:`Pages shown: ${pageNums}. Questions needing images: ${qNums}. For each image/diagram/graph/table you can see, identify the question number and its bounding box as fractions (0-1) of that page. Return ONLY JSON: {"found":[{"qNumber":"5","pageIndex":0,"x":0.0,"y":0.3,"w":1.0,"h":0.45},...]}`}
        ]}]
      );
      const parsed = JSON.parse(resp.replace(/\`\`\`json|\`\`\`/g, ''));
      for (const item of (parsed.found || [])) {
        if (!pageAssignments[item.qNumber]) {
          pageAssignments[item.qNumber] = {
            pageDataUrl: pages[i + item.pageIndex]?.dataUrl,
            pw: pages[i + item.pageIndex]?.w,
            ph: pages[i + item.pageIndex]?.h,
            x: item.x, y: item.y, w: item.w, h: item.h
          };
        }
      }
    } catch(e) { console.warn('Batch image extract error:', e); }
  }

  // Crop and assign images to questions
  let assigned = 0;
  for (const q of imgQs) {
    const pa = pageAssignments[q.number];
    if (pa?.pageDataUrl) {
      const cropped = cropImageRegion(pa.pageDataUrl, pa.pw, pa.ph, pa.x, pa.y, pa.w, pa.h);
      q.images = [cropped];
      assigned++;
    }
  }
  toast('✅ ' + assigned + ' images extracted for ' + year);
  // Don't save to localStorage (images too large) — in memory only
}

function refreshImageSlot(qid) {
  const q = S.questions.find(x => x.id === qid);
  if (!q) return;
  const slot = document.getElementById('img-slot-'+qid);
  if (!slot) return;
  if (q.images?.some(Boolean)) {
    slot.innerHTML = q.images.filter(Boolean).map(img =>
      `<img src="${img}" style="max-width:100%;border-radius:10px;margin-bottom:8px;display:block;border:1px solid var(--border)">`
    ).join('');
  } else {
    const yr = q.year, qi = q.id;
    slot.innerHTML = `<div onclick="loadPdfForYear('${yr}','${qi}')" style="border:2px dashed var(--border);border-radius:10px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--surface2)" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'"><span style="font-size:1.4rem">🖼️</span><div><div style="font-weight:700;font-size:.85rem">Image not extracted yet</div><div style="font-size:.76rem;color:var(--muted);margin-top:2px">Tap to attach the ${yr} exam PDF — AI extracts all images automatically</div></div></div>`;
  }
}

const _imgKeywords = /\b(the following|the image|the diagram|the graph|the table|the figure|refer to|shown below|below shows|shown in|the micrograph|the photograph|the model|the flowchart)\b/i;
